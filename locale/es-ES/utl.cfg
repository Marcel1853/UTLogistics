[mod-setting-description]
utl-status-color-incoming=Color de este estado en el panel de visualización de la estación UTL (conectado por cable) y en las lámparas de la parada.
utl-status-color-stopped=Color de este estado en el panel de visualización de la estación UTL (conectado por cable) y en las lámparas de la parada.
utl-status-color-depot=Color de este estado en el panel de visualización de la estación UTL (conectado por cable) y en las lámparas de la parada.
utl-status-color-idle=Color de este estado en el panel de visualización de la estación UTL (conectado por cable) y en las lámparas de la parada.
utl-status-color-off=Color de este estado en el panel de visualización de la estación UTL (conectado por cable) y en las lámparas de la parada.
utl-leader-inactive-days=Un líder de equipo que no se conecta durante tantos días (tiempo de juego, con el servidor en marcha) pierde los derechos de líder. Si no queda ningún líder, asume el miembro activo más antiguo. 0 = nunca.
utl-timeout-mode="Carga o inactividad" (por defecto): el tren sale en cuanto está lleno o vacío o nada ha cambiado durante ese tiempo – con lo que tenga, aunque el cofre esté vacío. "Carga e inactividad": sale solo cuando está lleno o vacío y nada ha cambiado durante ese tiempo. Cada equipo puede ajustarlo en el gestor de UTL.
utl-top-up=Si la demanda aumenta mientras un tren aún va hacia el proveedor o está cargando allí, la cantidad se suma a la lista de carga en curso en lugar de iniciar un segundo viaje. Requiere que el mismo proveedor tenga la mercancía y que el tren tenga espacio. Ahorra trenes, pero el tren se queda más tiempo en el proveedor. Por defecto: desactivado.
utl-multi-pickup=Si un proveedor no tiene suficiente para la demanda, el tren recoge el resto en un segundo proveedor de la misma red – un viaje con dos paradas de carga en lugar de dos viajes. Solo en la misma superficie, como máximo dos proveedores. Por defecto: desactivado.
utl-min-load-percent=Un tren solo sale si se llena al menos este porcentaje de su espacio de carga – cuentan todas las mercancías que el mismo proveedor entrega a este solicitante. Se acabaron los viajes por pequeños restos (por ejemplo, cuando a un solicitante solo le faltan 1000); la demanda espera hasta que se junte bastante. 0 = desactivado. Por defecto: 0.
utl-multi-pickup-detour=El segundo proveedor solo se visita si el desvío es como mucho este porcentaje de la distancia directa del primer proveedor al solicitante (en línea recta). Si está más lejos, va un segundo tren. 0 = se permite cualquier desvío. Por defecto: 50.
utl-cleanup-offer=Permite que las estaciones de limpieza vuelvan a ofrecer su contenido a la red – se activa por estación con la casilla «Volver a ofrecer el contenido» (desactivada allí por defecto). Desactivado aquí = desactivado en todo el mapa.
utl-storage=Permite el tipo de estación «Almacén» (existencias mínimas/máximas por mercancía). Desactivado = los almacenes no ofrecen ni piden nada, en todo el mapa.
utl-load-timeout=Segundos sin ningún cambio en la carga en el proveedor (0 = sin condición). Con "Carga o inactividad" (por defecto) también sale antes de cargarlo todo si no se añadió nada durante ese tiempo – con lo que tenga; con "Carga e inactividad" sale solo cuando todo está cargado y nada ha cambiado durante ese tiempo. Si no cargó nada, la entrega se cancela. Valor por defecto para todos los equipos; cada equipo puede fijar sus propios valores en el gestor de UTL (pestaña "Ajustes").
utl-unload-timeout=Segundos sin ningún cambio en la carga en el solicitante (0 = sin condición). Con "Carga e inactividad" el tren sale cuando está vacío y nada ha cambiado durante ese tiempo; con "Carga o inactividad" también antes, y los restos van a una estación de limpieza. Valor por defecto para todos los equipos; cada equipo puede fijar sus propios valores en el gestor de UTL.
utl-item-group=Automático: raíles, raíles elevados, señales, paradas, locomotoras y vagones – también los de otros mods – reciben la pestaña «Trenes». Si otro mod ya tiene su propia pestaña de trenes, los objetos de UTL van allí y UTL no reordena nada. Siempre UTL: UTL coloca todos los objetos de tren en su pestaña. Desactivado: no se reordena nada.
utl-signal-style=Clásico: vehículos y cofres del juego con un símbolo en la esquina. Plano: símbolos sencillos propios al estilo de las señales vanilla (gris claro con contorno oscuro). Requiere reiniciar.
utl-station-lamps=Además del panel de visualización: las dos pequeñas lámparas en lo alto de las paradas UTL se encienden con el color del estado (azul = tren en camino, verde = tren detenido, cian = tren esperando en el depósito, amarillo = no pasa nada, rojo = desactivada; colores en los ajustes del mapa). Son pequeñas – la indicación principal es un panel de visualización conectado a la estación por cable. Requiere reiniciar.
utl-heartbeat-interval=Cuántos ticks hay entre los pasos de trabajo de UTL. Cada paso hace solo una pequeña cantidad fija de trabajo. Más alto = menos CPU, pero reacciones más lentas.
utl-debug-log=Escribe mensajes adicionales en factorio-current.log. Actívalo solo para buscar errores.
utl-station-batch-size=Cuántas estaciones se leen por pulso. Todas las estaciones se recorren por turnos.
utl-max-deliveries-per-cycle=Cuántos trenes envía como máximo el despachador por ciclo (cada 3 pulsos). Más bajo = carga de CPU más uniforme.
utl-research-required=Activado: el control de carga (filtros de vagón, salida de pedidos), las estaciones de almacén y los enlaces de redes deben investigarse primero. Desactivado: todo está disponible enseguida, hasta 3 socios por red.
utl-station-output=Junto a cada estación hay una pequeña salida con los pedidos en curso como señales: positivo en el proveedor (tanto hay que cargar), negativo en el solicitante (tanto está llegando). Úsala para insertadores con filtro, bombas y paneles. No la conectes a la entrada de la estación – eso volvería a las existencias.
utl-wagon-filters=Mientras hay una entrega en curso, UTL ajusta las ranuras de los vagones de carga a las mercancías de ese pedido y bloquea el resto. Así un proveedor puede guardar varias mercancías en un cofre y los insertadores normales cargan solo lo pedido. Los vagones en los que tú mismo pusiste filtros no se tocan. No se aplica a los fluidos.
utl-chaining=Un tren que acaba de descargar o sale de una estación de repostaje/limpieza toma enseguida una entrega adecuada (prefiriendo un proveedor cercano) en lugar de volver primero al depósito. Ahorra viajes en vacío.
utl-fuel-threshold=Si alguna locomotora de un tren está por debajo de este nivel de combustible, el tren pasa por una estación de repostaje UTL adecuada antes de su siguiente pedido o desde el depósito (misma red, longitud del tren dentro del rango de la estación). 0 = desactivado.
utl-fuel-minimum=Por debajo de este nivel de combustible (la locomotora más baja) un tren ya no acepta pedidos, salvo que pueda repostar por el camino en una estación de repostaje UTL accesible y libre. Se queda en el depósito, aparece la alerta "falta combustible" y la salida del depósito lo indica. Entre este valor y "Repostar por debajo de" un tren puede circular sin parada de repostaje si ninguna estación está libre. 0 = desactivado.
utl-alert-no-train-minutes=La alerta «ningún tren adecuado» solo aparece cuando una demanda lleva sin atenderse tanto tiempo. Mientras un tren con la mercancía va hacia la estación, cuenta como atendida. 0 = inmediatamente.
utl-stuck-minutes=Si un tren de entrega pasa tanto tiempo sin avanzar – esperando en una señal, sin encontrar camino o con el destino lleno –, aparece la alerta «tren atascado» y el gestor de UTL lo muestra en ese tren. UTL no cancela nada. La carga y la descarga no cuentan (para eso están los límites de tiempo). 0 = desactivado. Por defecto: 5.
utl-alerts-no-train=Alerta cuando una estación necesita algo y un proveedor lo tiene, pero no hay ningún tren libre o adecuado (red, longitud del tren).
utl-alerts-cargo=Alerta cuando un tren espera en el depósito con carga sobrante, no se vació en el solicitante o cargó menos de lo pedido en el proveedor.
utl-alerts-trains=Alerta cuando un tren de entrega no encuentra camino, no se encuentra ningún depósito libre, el repostaje falló o se canceló una entrega.
utl-default-provide-threshold=Valor inicial para estaciones nuevas.
utl-default-request-threshold=Valor inicial para estaciones nuevas.
utl-news=Tras una actualización de UTL, una línea corta en el chat sobre las novedades – con un enlace a la página «Novedades de UTL» en consejos y trucos.
utl-manager-width=Ancho del gestor de UTL en píxeles con la escala de interfaz al 100 %. Por defecto 1040. Si la ventana no cabe en la pantalla, se hace más pequeña.
utl-manager-height=Alto del gestor de UTL en píxeles con la escala de interfaz al 100 %. Por defecto 620. Si la ventana no cabe en la pantalla, se hace más pequeña.
utl-stop-style=Vanilla: los gráficos de la parada normal. UTL: modelo propio con mástil de celosía, armario de control y cables de colores (prueba), con las piezas de la parada normal junto a la vía. El color de la estación sigue siendo libre. Requiere reiniciar.

