[entity-description]
utl-station-settings=Almacén invisible de los ajustes de la estación (pedidos, función, valores) para que funcionen los parámetros de los planos. UTL lo construye solo – no hacen falta robots ni objetos.
utl-port=Puerto de Cargo Ships con lógica UTL integrada – como la parada de tren UTL, pero para barcos. Conecta cofres/depósitos directamente a él: valores positivos = oferta, negativos = demanda.
utl-network-combinator=Emite el estado de una red UTL como señales: existencias, existencias de almacén, demanda, escasez o número de trenes. Ajusta red y modo en su ventana. Lo que hagas con las señales (lámpara, panel, plataforma de aterrizaje de carga …) lo cableas tú.
utl-train-stop=Parada de tren con lógica UTL integrada. Conecta cofres/depósitos directamente a la parada: valores positivos = oferta, negativos = demanda. Se puede colocar directamente sobre paradas normales.
utl-station-combinator=Acompaña a una parada de tren normal: conecta su SALIDA (rojo o verde) a la parada. Conecta cofres/depósitos o la demanda a la ENTRADA: valores positivos = oferta, valores negativos = demanda. Funciones y umbrales se ajustan en la ventana.

