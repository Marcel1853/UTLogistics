utl-network-combinator=Desbloquea el combinador de red UTL: emite como señales las existencias, las existencias de almacén, la demanda, la escasez o el número de trenes de una red.
utl-loading-control=Filtros de vagón al cargar y la salida de pedidos en cada parada: los trenes solo se llevan lo pedido, y los insertadores y bombas pueden activarse según el pedido en curso.
utl-networks-1=Una red puede tener un socio. Ambas se ayudan entonces con trenes, depósitos, estaciones de repostaje y de limpieza.
utl-networks-2=Una red puede tener dos socios.
utl-networks-3=Una red puede tener tres socios.
utl-train-logistics=Desbloquea la parada de tren UTL y el combinador de estación UTL: tráfico automático de trenes entre proveedores y solicitantes. El puerto UTL (Cargo Ships) llega con "Transporte fluvial automatizado".
