[tips-and-tricks-item-description]
utl-network-combinator=El [item=utl-network-combinator] [font=default-bold]combinador de red[/font] emite el estado de una red UTL como señales. En su ventana eliges la red (si quieres, con sus redes enlazadas) y qué emite:\n• [font=default-bold]Existencias[/font] – por mercancía, lo que ofrecen los proveedores de la red,\n• [font=default-bold]Existencias de almacén[/font] – lo que está guardado en las estaciones de almacén,\n• [font=default-bold]Demanda[/font] – lo que piden los solicitantes,\n• [font=default-bold]Escasez[/font] – lo que necesitan los solicitantes y nadie ofrece,\n• [font=default-bold]Trenes[/font] – total, libres, en camino, entregas, poco combustible, sin camino; además, si trenes de redes enlazadas ayudan aquí o trenes propios trabajan en otro lugar.\n\nEn la escena el solicitante quiere hierro y cobre. El tren trae hierro, nadie ofrece cobre – por eso en el modo "Escasez" el combinador solo emite cobre, y la lámpara se enciende.\n\nLo que pase con las señales depende de tu cableado: una lámpara como en la escena, un panel – o en Space Age la [font=default-bold]escasez[/font] hacia una plataforma de aterrizaje de carga ("establecer peticiones") para que traiga de la órbita lo que falta. Se desbloquea con "UTL: Combinador de red".
utl-overview=UTL despacha trenes automáticamente: desde el [font=default-bold]depósito[/font] hasta un [font=default-bold]proveedor[/font] que tiene lo que necesita un [font=default-bold]solicitante[/font], y luego hasta el solicitante.\n\nInicio rápido:\n1. Depósito: [item=utl-train-stop] con la función "Depósito", un tren con solo el depósito en su horario (vacío, automático).\n2. Proveedor: parada con la función "Proveedor", cofres conectados a la parada por cable.\n3. Solicitante: función "Solicitante", rellena una ranura de pedido en la ventana.\n\nTu horario se mantiene: UTL solo inserta paradas temporales, los grupos de trenes y las interrupciones siguen ahí. Tras descargar, el tren toma enseguida el siguiente pedido cercano.
utl-train-stop=La [item=utl-train-stop] es una parada de tren y una estación UTL a la vez. Conecta cofres y depósitos (rojo o verde) directamente a la parada: los valores positivos se ofrecen, los negativos se piden. Ajusta función, red y valores en el panel UTL a la izquierda de la ventana de la parada.\n\nSe puede construir directamente sobre una parada de tren normal.
utl-combinator=Para estaciones existentes: coloca un [item=utl-station-combinator] junto a una parada de tren normal.\n\nConecta la [font=default-bold]salida[/font] del combinador (rojo o verde) a la parada – así UTL sabe qué parada le pertenece.\n[font=default-bold]Entrada[/font]: los cofres/depósitos.\n\nSin cable en la salida, la ventana muestra "Sin parada". El combinador no necesita electricidad.
utl-roles=Cada estación recibe una función en su ventana:\n\n[font=default-bold]Proveedor[/font] – se recogen las mercancías con valor positivo.\n[font=default-bold]Solicitante[/font] – se entregan las mercancías con valor negativo o de las ranuras de pedido.\nProveedor + solicitante – búfer.\n[font=default-bold]Depósito[/font] – aquí esperan los trenes libres.\n[font=default-bold]Estación de repostaje[/font] – aquí repostan los trenes.\n[font=default-bold]Limpieza[/font] – aquí se vacían los trenes con carga sobrante.\n[font=default-bold]Almacén[/font] – recibe y entrega, con existencias mínimas y máximas por mercancía (avanzado, investigación "UTL: Almacén").
utl-requests=La cantidad de una ranura de pedido es un [font=default-bold]objetivo de existencias[/font], no un encargo: UTL entrega "objetivo − en existencias − ya en camino".\n\nPara varios trenes a la vez, pon un objetivo de existencias mayor. Si el proveedor tiene más mercancías que necesita el mismo solicitante, el tren también las carga mientras quede espacio. Los fluidos viajan en vagones cisterna (bombas en el vagón, depósito conectado a la estación).\n\nVarias mercancías en un proveedor: basta un cofre mixto – durante una entrega UTL filtra las ranuras del vagón a las mercancías pedidas. Con la salida de pedidos también puedes activar insertadores y bombas según el pedido en curso (investigación \"UTL: Control de carga\").\n\n"En camino" en la ventana de la estación muestra lo que se está entregando o recogiendo ahora mismo.
utl-values=En la pestaña "Valores":\n• [font=default-bold]Longitud mín./máx. del tren[/font] – solo trenes adecuados (las locomotoras cuentan, 0 = cualquiera).\n• [font=default-bold]Trenes máx.[/font] – como mucho tantos a la vez (el límite de trenes de la parada también cuenta).\n• [font=default-bold]Umbrales[/font] – las mercancías solo se ofrecen o entregan a partir de esta cantidad (también en pilas).\n• [font=default-bold]Prioridad[/font] – la más alta va primero.\n• [font=default-bold]Ranuras bloqueadas[/font] por vagón.\n\nPuedes hacer cálculos en cada campo numérico, por ejemplo "4000*2". ⟲ restablece un valor.\n\n[font=default-bold]Red[/font]: separa varias redes de transporte en un mismo mapa. Solo trabajan juntas las estaciones con exactamente el mismo nombre, en todas las funciones: un tren del depósito "Mineral" solo atiende estaciones de mineral, solo reposta en estaciones de repostaje de mineral y solo se vacía en limpiezas de mineral.\n\nVacío = red "default". Por eso cada red necesita su propio depósito, estación de repostaje y limpieza. Un depósito en la red equivocada provoca la alerta "ningún tren libre en la red …" aunque haya trenes esperando.\n\nCon la investigación "UTL: Enlaces de redes" las redes pueden enlazarse para ayudarse – ver la entrada "Redes".
utl-networks=La [font=default-bold]red[/font] separa varios sistemas de transporte en un mismo mapa – sin separar los raíles. En la escena los dos trenes circulan por [font=default-bold]el mismo circuito[/font]: "Erze" (mineral) y "Platten" (placas), cada red con su propio depósito, proveedor y solicitante.\n\nSolo trabajan juntas las estaciones con [font=default-bold]exactamente el mismo nombre[/font]. Por eso el tren de mineral pasa de largo por la estación de placas.\n\nEsto vale para todas las funciones: un tren solo reposta en una estación de repostaje de su propia red y solo se vacía en una limpieza de su propia red. Por eso cada red necesita su propio depósito, estación de repostaje y limpieza – salvo que enlaces redes.\n\nVacío = red "default". Deja el campo vacío en todas partes si solo quieres una gran red.\n\nLas redes también pueden [font=default-bold]enlazarse[/font] para ayudarse – ver \"Enlazar redes\".
utl-depots=Los trenes libres esperan [font=default-bold]vacíos[/font] en paradas con la función "Depósito" – cada parada de depósito necesita la función, el nombre solo no basta.\n\nSi un tren acaba en una parada con el nombre de un depósito pero sin la función, se va solo a un depósito de verdad.\n\nLongitud mín./máx. del tren en un depósito: un tren que no encaja se va a un depósito adecuado con el mismo nombre.
utl-fuel=Si una locomotora está por debajo del límite de repostaje (ajuste del mapa, 40 % por defecto), el tren pasa primero por una [font=default-bold]estación de repostaje[/font] adecuada y luego sigue con su pedido.\n\nLos insertadores de la estación de repostaje llenan las locomotoras. El tren espera hasta que todas las locomotoras estén llenas (máx. 30 s).\n\nSin ninguna estación de repostaje en la red, los trenes con poco combustible circulan con normalidad – entonces repostas tú (por ejemplo, con una interrupción).
utl-cleanup=Un tren con carga sobrante va a una estación de [font=default-bold]limpieza[/font] adecuada, se vacía allí (insertadores o bombas) y luego toma el siguiente pedido.\n\nLo que acepta una estación de limpieza se ajusta en la pestaña "Valores": [virtual-signal=utl-cleanup-all-items] todos los objetos, [virtual-signal=utl-cleanup-all-fluids] todos los fluidos o mercancías sueltas. Las mercancías indicadas una a una van primero; si una estación no basta, el tren visita varias seguidas.\n\nSin limpieza adecuada, el tren espera en el depósito y se muestra una alerta.
utl-cleanup-return=Lo que acaba en una limpieza no tiene por qué quedarse allí. Marca [font=default-bold]Volver a ofrecer el contenido[/font] en una estación de limpieza y esta ofrece el contenido de sus cofres a la red – como un proveedor. Para ello los cofres deben estar conectados a la parada.\n\nEl rango de al lado decide cuándo se usa la limpieza: [font=default-bold]Solo como reserva[/font] (primero los proveedores normales), [font=default-bold]Como cualquier proveedor[/font] o [font=default-bold]Vaciar primero[/font].\n\nLas mercancías que sobraron en un solicitante no se le devuelven desde ninguna limpieza durante 5 minutos – si no, irían y vendrían. Se puede desactivar para todo el mapa: ajuste del mapa «La limpieza puede volver a ofrecer su contenido».\n\n[font=default-bold]Montado como en la escena:[/font] insertador de descarga (vagón → cofre), insertador de transferencia (cofre → cofre), insertador de carga (cofre → vagón). La salida de pedidos los activa: el de carga con [virtual-signal=utl-loading] > 0, el de descarga con [virtual-signal=utl-loading] = 0 – la carga sobrante no tiene pedido y así se descarga. El insertador de carga tiene «Establecer filtros» activado y solo coge las mercancías pedidas: el tren trae hierro y cobre, solo se recoge el cobre.
utl-storage=Un [font=default-bold]almacén[/font] recibe y entrega. Por mercancía fijas unas existencias mínimas y máximas:\n• por debajo del mínimo pide – hasta el máximo,\n• lo que esté por encima del mínimo lo ofrece como un proveedor normal – si el almacén está más cerca del solicitante, entrega él.\n\nAsí un almacén mantiene existencias cerca de los consumidores. Dos almacenes nunca se pasan mercancías de un lado a otro: solo se ofrece lo que está por encima del mínimo y solo se pide por debajo del mínimo. Con «Aceptar carga sobrante» también recibe restos de carga.\n\nUn almacén necesita insertadores en ambos sentidos: los de descarga ponen las mercancías en cofres, los de transferencia las pasan a los cofres de carga, los de carga las meten en el tren. La salida de pedidos los activa – cargar mientras [virtual-signal=utl-loading] > 0, si no, descargar. Se desbloquea con «UTL: Almacén» y se puede desactivar con el ajuste del mapa «Permitir estaciones de almacén».
utl-copy=[font=default-bold]Mayús + clic derecho[/font] en una estación copia sus ajustes UTL, [font=default-bold]Mayús + clic izquierdo[/font] en otra los pega.\n\n[item=blueprint] Los planos, copiar/pegar (Ctrl + C / Ctrl + V) y la clonación conservan los ajustes.
utl-manager=El [font=default-bold]gestor de UTL[/font] muestra toda tu red ferroviaria de un vistazo. Ábrelo con el botón de locomotora de la barra de accesos directos o con [font=default-bold]Ctrl + Mayús + U[/font] (o [font=default-bold]Ctrl + Alt + U[/font]). Arriba a la derecha: lupa = búsqueda (filtra por nombre), flechas = actualizar ahora.\n\nLas pestañas:\n• [font=default-bold]Depósitos[/font] – a la izquierda cada depósito con trenes libres/totales. Haz clic en un depósito para ver sus trenes a la derecha con composición, estado y carga; el botón del tren sigue al tren en el mapa.\n• [font=default-bold]Estaciones[/font] – función, oferta (verde), demanda (rojo), en camino (azul = llegando, amarillo = recogiéndose) y número de trenes. La red aparece tras el nombre, con enlaces, por ejemplo [Hierro ↔ Cobre]. Haz clic en el nombre para ver la estación en el mapa.\n• [font=default-bold]Redes[/font] – cada red con sus enlaces, ver "Gestor: Redes".\n• [font=default-bold]Inventario[/font] – todo lo ofrecido, pedido y en movimiento, ver "Gestor: Inventario".\n• [font=default-bold]Historial[/font] – las últimas 100 entregas con su duración; las canceladas en rojo con el motivo.\n• [font=default-bold]Alertas[/font] – ningún tren libre o adecuado, carga sobrante, carga que falta, sin camino, repostaje fallido. Cada grupo se puede desactivar en los ajustes por jugador.\n\nEn la escena un tren con carga sobrante llega al depósito y no hay limpieza – así se ve la alerta en la pestaña \"Alertas\". El botón de al lado muestra el lugar en el mapa.\n\nVarios planetas: junto a la lupa eliges qué planeta se muestra – \"Automático\" sigue el planeta en el que estás o que estás mirando; \"Todos los planetas\" lo muestra todo. Los depósitos con el mismo nombre en planetas distintos siguen separados.\n\nEn la pestaña "Ajustes" cambias los valores de carga (inactividad al cargar/descargar, carga y/o inactividad) sin el menú principal – por equipo si hay equipos (los cambian los líderes), si no, para todos (solo administradores).
utl-network-links=Puedes [font=default-bold]crear[/font] tantas redes como quieras. Solo el [font=default-bold]enlace[/font] está limitado – la investigación "UTL: Enlaces de redes I–III" permite 1, 2 o 3 socias por red.\n\nEn la escena solo la red "Eisen" (hierro) tiene un tren; proveedor y solicitante están en la red "Kupfer" (cobre) – al principio no se mueve nada. En la ventana de la estación del depósito, recuadro [font=default-bold]"Enlazada con"[/font]:\n1. Elige "Kupfer" de la lista – pasa a ser socia al instante, y el tren de hierro sale.\n2. Haz clic en [font=default-bold]Nueva[/font], escribe un nombre ("Kohle", carbón), ✓ – la red se crea y se enlaza de una vez.\nCada socia se muestra luego como un botón; un clic quita el enlace. El contador (2 / 2) muestra las socias usadas y permitidas, la descripción nombra la investigación para tener más.\n\nCómo funciona un enlace – una [font=default-bold]estrella[/font]:\n• Centro y socia se ayudan con trenes, depósitos, estaciones de repostaje y de limpieza.\n• Las socias [font=default-bold]no[/font] se ayudan entre sí: un tren de cobre nunca circula para "Kohle".\n• Una socia no pertenece a ninguna otra red ni tiene socias propias.\n• El enlace vale para toda la red en esta superficie, no solo para la estación. En Vulcanus montas estrellas aparte.
utl-manager-networks=La pestaña [font=default-bold]Redes[/font] del gestor: a la izquierda cada red (con la superficie si hay varios planetas) con su número de estaciones, trenes libres y entregas en curso.\n\nHaz clic en una red para ver a la derecha:\n• arriba el recuadro [font=default-bold]"Enlazada con"[/font] – elige una socia de la lista o escribe un nombre nuevo y ✓; un clic en un botón de socia quita el enlace. Funciona igual que en la ventana de la estación.\n• debajo cada estación de la estrella con su función y red; las estaciones socias aparecen en gris.\n\nSi la red elegida es ella misma una socia, el botón muestra su centro; un clic sale de la estrella.\n\nLa pestaña [font=default-bold]Estaciones[/font] muestra el enlace tras el nombre: [Hierro ↔ Cobre] para el centro, [Cobre → Hierro] para una socia.
utl-manager-inventory=La pestaña [font=default-bold]Inventario[/font] del gestor muestra todo lo de la red como iconos a la izquierda: [font=default-bold]oferta[/font] (verde), [font=default-bold]demanda[/font] (rojo) y [font=default-bold]en camino[/font] (azul).\n\n[font=default-bold]Haz clic en una mercancía[/font] – a la derecha aparecen:\n• los totales de oferta, demanda y en camino,\n• cada estación que la tiene o la necesita (haz clic en el nombre para verla en el mapa),\n• cada tren que la transporta ahora mismo, con origen y destino.\n\nVuelve a hacer clic en la misma mercancía para cerrar la vista. La pestaña no se actualiza sola para que la lista no salte mientras lees – usa las flechas de arriba.
utl-news=Lo más importante de la [font=default-bold]0.0.27[/font]:\n\n• UTL Manager: nuevo filtro de mercancía en la barra de título – elige un objeto o fluido y las pestañas solo muestran lo relacionado con él. Clic derecho lo borra.\n• Los vagones cisterna de mayor calidad cuentan ahora con su capacidad real (un vagón cisterna legendario lleva 2,5 veces más) – antes UTL solo planificaba 50k por vagón.\n\nNovedades de 0.0.26: la ventana de la estación en modo «libre» siempre se puede volver a acoplar.\n\nNovedades de 0.0.25: nuevos idiomas – ruso, chino (simplificado), francés, español, polaco y portugués de Brasil.\n\nTodos los cambios: portal de mods, pestaña «Changelog».

