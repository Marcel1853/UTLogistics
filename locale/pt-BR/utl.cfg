[tips-and-tricks-item-description]
utl-network-combinator=O [item=utl-network-combinator] [font=default-bold]combinador de rede[/font] emite o estado de uma rede UTL como sinais. Na janela dele você escolhe a rede (se quiser, com as redes ligadas) e o que ele emite:\n• [font=default-bold]Estoque[/font] – por item, o que os fornecedores da rede oferecem,\n• [font=default-bold]Estoque dos armazéns[/font] – o que está guardado nas estações de armazém,\n• [font=default-bold]Demanda[/font] – o que os solicitantes pedem,\n• [font=default-bold]Falta[/font] – o que os solicitantes precisam e ninguém oferece,\n• [font=default-bold]Trens[/font] – total, livres, a caminho, entregas, pouco combustível, sem caminho; e também se trens de redes ligadas ajudam aqui ou trens próprios trabalham em outro lugar.\n\nNa cena o solicitante quer ferro e cobre. O trem traz ferro, ninguém oferece cobre – por isso, no modo "Falta", o combinador emite só cobre, e a lâmpada acende.\n\nO que acontece com os sinais depende da sua fiação: uma lâmpada como na cena, um painel – ou, no Space Age, a [font=default-bold]falta[/font] ligada a uma plataforma de pouso de carga ("definir pedidos") para ela buscar da órbita os itens que faltam. Liberado por "UTL: Combinador de rede".
utl-overview=O UTL despacha trens automaticamente: do [font=default-bold]depósito[/font] para um [font=default-bold]fornecedor[/font] que tem o que um [font=default-bold]solicitante[/font] precisa, e depois para o solicitante.\n\nComeço rápido:\n1. Depósito: [item=utl-train-stop] com a função "Depósito", um trem só com o depósito no itinerário (vazio, automático).\n2. Fornecedor: parada com a função "Fornecedor", baús ligados à parada por fio.\n3. Solicitante: função "Solicitante", preencha um espaço de pedido na janela.\n\nSeu itinerário é mantido: o UTL só insere paradas temporárias, grupos de trens e interrupções continuam. Depois de descarregar, o trem pega logo o próximo pedido próximo.
utl-train-stop=A [item=utl-train-stop] é uma parada de trem e uma estação UTL ao mesmo tempo. Ligue baús e tanques (vermelho ou verde) direto na parada: valores positivos são oferecidos, negativos são pedidos. Defina função, rede e valores no painel UTL à esquerda da janela da parada.\n\nEla pode ser construída diretamente sobre uma parada de trem normal.
utl-combinator=Para estações existentes: coloque um [item=utl-station-combinator] ao lado de uma parada de trem normal.\n\nLigue a [font=default-bold]saída[/font] do combinador (vermelho ou verde) na parada – assim o UTL sabe qual parada pertence a ele.\n[font=default-bold]Entrada[/font]: os baús/tanques.\n\nSem fio na saída, a janela mostra "Sem parada". O combinador não precisa de energia.
utl-roles=Cada estação recebe uma função na sua janela:\n\n[font=default-bold]Fornecedor[/font] – itens com valor positivo são buscados.\n[font=default-bold]Solicitante[/font] – itens com valor negativo ou dos espaços de pedido são entregues.\nFornecedor + solicitante – estoque intermediário.\n[font=default-bold]Depósito[/font] – trens livres esperam aqui.\n[font=default-bold]Estação de abastecimento[/font] – trens abastecem aqui.\n[font=default-bold]Limpeza[/font] – trens com carga restante são esvaziados aqui.\n[font=default-bold]Armazém[/font] – recebe e entrega, com estoque mínimo e máximo por item (avançado, pesquisa "UTL: Armazém").
utl-requests=A quantidade em um espaço de pedido é um [font=default-bold]estoque-alvo[/font], não uma encomenda: o UTL entrega "alvo − em estoque − já a caminho".\n\nPara vários trens de uma vez, defina um estoque-alvo maior. Se o fornecedor tiver mais itens de que o mesmo solicitante precisa, o trem também os carrega enquanto houver espaço. Fluidos viajam em vagões-tanque (bombas no vagão, tanque ligado à estação).\n\nVários itens em um fornecedor: um baú misto basta – durante uma entrega o UTL filtra os espaços do vagão para os itens pedidos. Com a saída de pedidos você também pode comandar insersores e bombas pelo pedido em andamento (pesquisa \"UTL: Controle de carga\").\n\n"A caminho" na janela da estação mostra o que está sendo entregue ou buscado agora.
utl-values=Na aba "Valores":\n• [font=default-bold]Compr. mín./máx. do trem[/font] – só trens adequados (locomotivas contam, 0 = qualquer).\n• [font=default-bold]Máx. de trens[/font] – no máximo esta quantidade ao mesmo tempo (o limite de trens da parada também vale).\n• [font=default-bold]Limites[/font] – itens só são oferecidos ou entregues a partir desta quantidade (também em pilhas).\n• [font=default-bold]Prioridade[/font] – maior vai primeiro.\n• [font=default-bold]Espaços bloqueados[/font] por vagão.\n\nVocê pode fazer contas em todo campo numérico, por exemplo "4000*2". ⟲ volta um valor ao padrão.\n\n[font=default-bold]Rede[/font]: separa várias redes de transporte em um mesmo mapa. Só estações com exatamente o mesmo nome trabalham juntas, em todas as funções: um trem do depósito "Minério" só atende estações de minério, só abastece em estações de abastecimento de minério e só é esvaziado em limpezas de minério.\n\nVazio = rede "default". Por isso cada rede precisa do seu próprio depósito, estação de abastecimento e limpeza. Um depósito na rede errada causa o alerta "nenhum trem livre na rede …" mesmo com trens esperando.\n\nCom a pesquisa "UTL: Ligações de rede" as redes podem ser ligadas para se ajudarem – veja a entrada "Redes".
utl-networks=A [font=default-bold]rede[/font] separa vários sistemas de transporte em um mesmo mapa – sem separar os trilhos. Na cena os dois trens rodam [font=default-bold]no mesmo circuito[/font]: "Erze" (minério) e "Platten" (placas), cada rede com seu próprio depósito, fornecedor e solicitante.\n\nSó estações com [font=default-bold]exatamente o mesmo nome[/font] trabalham juntas. Por isso o trem de minério passa direto pela estação de placas.\n\nIsso vale para todas as funções: um trem só abastece em uma estação de abastecimento da sua própria rede e só é esvaziado em uma limpeza da sua própria rede. Por isso cada rede precisa do seu próprio depósito, estação de abastecimento e limpeza – a não ser que você ligue redes.\n\nVazio = rede "default". Deixe o campo vazio em todo lugar se quiser só uma grande rede.\n\nRedes também podem ser [font=default-bold]ligadas[/font] para se ajudarem – veja \"Ligar redes\".
utl-depots=Trens livres esperam [font=default-bold]vazios[/font] em paradas com a função "Depósito" – toda parada de depósito precisa da função, só o nome não basta.\n\nSe um trem acabar em uma parada com o nome de um depósito, mas sem a função, ele vai sozinho para um depósito de verdade.\n\nCompr. mín./máx. do trem em um depósito: um trem que não se encaixa vai para um depósito compatível de mesmo nome.
utl-fuel=Se uma locomotiva estiver abaixo do limite de abastecimento (configuração do mapa, padrão 40 %), o trem passa primeiro por uma [font=default-bold]estação de abastecimento[/font] compatível e depois segue para o pedido.\n\nInsersores na estação de abastecimento enchem as locomotivas. O trem espera até todas as locomotivas estarem cheias (máx. 30 s).\n\nSem nenhuma estação de abastecimento na rede, trens com pouco combustível rodam normalmente – aí você mesmo abastece (por exemplo, com uma interrupção).
utl-cleanup=Um trem com carga restante vai para uma estação de [font=default-bold]limpeza[/font] compatível, é esvaziado lá (insersores ou bombas) e depois pega o próximo pedido.\n\nO que uma estação de limpeza aceita é definido na aba "Valores": [virtual-signal=utl-cleanup-all-items] todos os itens, [virtual-signal=utl-cleanup-all-fluids] todos os fluidos ou itens individuais. Itens informados um a um vêm primeiro; se uma estação não bastar, o trem visita várias em sequência.\n\nSem limpeza adequada, o trem espera no depósito e aparece um alerta.
utl-cleanup-return=O que vai para uma limpeza não precisa ficar lá. Marque [font=default-bold]Oferecer conteúdo de novo[/font] em uma estação de limpeza e ela oferece o conteúdo dos baús à rede – como um fornecedor. Para isso os baús precisam estar ligados à parada.\n\nA classificação ao lado decide quando a limpeza é usada: [font=default-bold]Só como reserva[/font] (fornecedores normais vêm primeiro), [font=default-bold]Como qualquer fornecedor[/font] ou [font=default-bold]Esvaziar primeiro[/font].\n\nItens que sobraram em um solicitante não são levados de volta a ele por nenhuma limpeza durante 5 minutos – senão ficariam indo e voltando. Pode ser desligado para o mapa inteiro: configuração do mapa “Limpeza pode oferecer seu conteúdo de novo”.\n\n[font=default-bold]Montado como na cena:[/font] insersor de descarga (vagão → baú), insersor de transferência (baú → baú), insersor de carga (baú → vagão). A saída de pedidos os comanda: insersor de carga com [virtual-signal=utl-loading] > 0, insersor de descarga com [virtual-signal=utl-loading] = 0 – carga restante não tem pedido e é descarregada assim. O insersor de carga tem “Definir filtros” ligado e só pega os itens pedidos: o trem traz ferro e cobre, só o cobre é buscado.
utl-storage=Um [font=default-bold]armazém[/font] recebe e entrega. Por item você define um estoque mínimo e um máximo:\n• abaixo do mínimo ele pede – até o máximo,\n• o que estiver acima do mínimo ele oferece como um fornecedor normal – se o armazém estiver mais perto do solicitante, ele entrega.\n\nAssim um armazém mantém estoque perto dos consumidores. Dois armazéns nunca empurram itens de um para o outro: só o que está acima do mínimo é oferecido, e só abaixo do mínimo se pede. Com “Aceitar carga restante” ele também recebe carga restante.\n\nUm armazém precisa de insersores nos dois sentidos: insersores de descarga põem os itens em baús, insersores de transferência os passam para os baús de carga, insersores de carga os põem no trem. A saída de pedidos os comanda – carregar enquanto [virtual-signal=utl-loading] > 0, senão descarregar. Liberado por “UTL: Armazém”, pode ser desligado com a configuração do mapa “Permitir estações de armazém”.
utl-copy=[font=default-bold]Shift + clique direito[/font] em uma estação copia as configurações UTL dela, [font=default-bold]Shift + clique esquerdo[/font] em outra cola.\n\n[item=blueprint] Plantas, copiar/colar (Ctrl + C / Ctrl + V) e clonagem mantêm as configurações.
utl-manager=O [font=default-bold]Gerenciador UTL[/font] mostra toda a sua rede de trens de relance. Abra com o botão de locomotiva na barra de atalhos ou [font=default-bold]Ctrl + Shift + U[/font] (ou [font=default-bold]Ctrl + Alt + U[/font]). No canto superior direito: lupa = busca (filtra por nome), setas = atualizar agora.\n\nAs abas:\n• [font=default-bold]Depósitos[/font] – à esquerda cada depósito com trens livres/total. Clique em um depósito para ver seus trens à direita com composição, estado e carga; o botão do trem segue o trem no mapa.\n• [font=default-bold]Estações[/font] – função, oferta (verde), demanda (vermelho), a caminho (azul = chegando, amarelo = sendo buscado) e número de trens. A rede aparece depois do nome, com ligações, por exemplo [Ferro ↔ Cobre]. Clique no nome para ver a estação no mapa.\n• [font=default-bold]Redes[/font] – cada rede com suas ligações, veja "Gerenciador: Redes".\n• [font=default-bold]Inventário[/font] – tudo o que é oferecido, pedido e está em movimento, veja "Gerenciador: Inventário".\n• [font=default-bold]Histórico[/font] – as últimas 100 entregas com duração; as canceladas em vermelho com o motivo.\n• [font=default-bold]Alertas[/font] – nenhum trem livre ou adequado, carga restante, carga faltando, sem caminho, abastecimento falhou. Cada grupo pode ser desligado nas configurações por jogador.\n\nNa cena um trem com carga restante chega ao depósito e não há limpeza – é assim que o alerta aparece na aba \"Alertas\". O botão ao lado mostra o local no mapa.\n\nVários planetas: ao lado da lupa você escolhe qual planeta é mostrado – \"Automático\" segue o planeta em que você está ou para o qual está olhando; \"Todos os planetas\" mostra tudo. Depósitos com o mesmo nome em planetas diferentes continuam separados.\n\nNa aba "Configurações" você muda os valores de carga (inatividade no carregamento/descarregamento, carga e/ou inatividade) sem o menu principal – por equipe quando há equipes (os líderes alteram), senão para todos (só administradores).
utl-network-links=Você pode [font=default-bold]criar[/font] quantas redes quiser. Só a [font=default-bold]ligação[/font] é limitada – a pesquisa "UTL: Ligações de rede I–III" permite 1, 2 ou 3 parceiras por rede.\n\nNa cena só a rede "Eisen" (ferro) tem um trem; fornecedor e solicitante estão na rede "Kupfer" (cobre) – no começo nada se move. Na janela da estação do depósito, quadro [font=default-bold]"Ligada com"[/font]:\n1. Escolha "Kupfer" na lista – ela vira parceira na hora, e o trem de ferro parte.\n2. Clique em [font=default-bold]Nova[/font], digite um nome ("Kohle", carvão), ✓ – a rede é criada e ligada de uma vez.\nCada parceira aparece então como um botão; um clique remove a ligação. O contador (2 / 2) mostra parceiras usadas e permitidas, a dica cita a pesquisa para ter mais.\n\nComo uma ligação funciona – uma [font=default-bold]estrela[/font]:\n• Centro e parceira se ajudam com trens, depósitos, estações de abastecimento e de limpeza.\n• Parceiras [font=default-bold]não[/font] se ajudam entre si: um trem de cobre nunca roda para "Kohle".\n• Uma parceira não pertence a nenhuma outra rede e não ganha parceiras próprias.\n• A ligação vale para a rede inteira nesta superfície, não só para a estação. Em Vulcanus você monta estrelas separadas.
utl-manager-networks=A aba [font=default-bold]Redes[/font] no gerenciador: à esquerda cada rede (com a superfície quando há vários planetas) com seu número de estações, trens livres e entregas em andamento.\n\nClique em uma rede para ver à direita:\n• em cima o quadro [font=default-bold]"Ligada com"[/font] – escolha uma parceira na lista ou digite um nome novo e ✓; um clique em um botão de parceira remove a ligação. Funciona igual à janela da estação.\n• embaixo cada estação da estrela com função e rede; estações parceiras ficam em cinza.\n\nSe a rede escolhida for ela mesma uma parceira, o botão mostra o centro dela; um clique sai da estrela.\n\nA aba [font=default-bold]Estações[/font] mostra a ligação depois do nome: [Ferro ↔ Cobre] para o centro, [Cobre → Ferro] para uma parceira.
utl-manager-inventory=A aba [font=default-bold]Inventário[/font] no gerenciador mostra tudo da rede como ícones à esquerda: [font=default-bold]oferta[/font] (verde), [font=default-bold]demanda[/font] (vermelho) e [font=default-bold]a caminho[/font] (azul).\n\n[font=default-bold]Clique em um item[/font] – à direita aparecem:\n• os totais de oferta, demanda e a caminho,\n• cada estação que tem ou precisa dele (clique no nome para vê-la no mapa),\n• cada trem que o transporta agora, com origem e destino.\n\nClique de novo no mesmo item para fechar a visão. A aba não se atualiza sozinha, para a lista não pular enquanto você lê – use as setas em cima.
utl-news=O mais importante da [font=default-bold]0.0.26[/font]:\n\n• A janela da estação no modo “livre” sempre pode ser encaixada de novo: um pequeno painel com os botões esquerda/direita/livre fica agora junto à janela da parada (a janela livre podia ficar escondida atrás dela).\n\nNovo na 0.0.25: novos idiomas – russo, chinês (simplificado), francês, espanhol, polonês e português do Brasil.\n\nTodas as mudanças: portal de mods, aba “Changelog”.

