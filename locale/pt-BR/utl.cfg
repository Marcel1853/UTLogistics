cleanup-offer-tooltip=O UTL oferece de volta à rede o que estiver guardado nesta limpeza – como um fornecedor. Os baús precisam estar ligados à parada ou ao combinador, como em qualquer fornecedor.
cleanup-offer-disabled=Desativado neste mapa (configuração do mapa “Limpeza pode oferecer seu conteúdo de novo”).
