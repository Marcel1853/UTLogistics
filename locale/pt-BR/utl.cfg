value-max_trains-tooltip=No máximo esta quantidade de trens aqui ou a caminho ao mesmo tempo – em fornecedores, solicitantes, armazéns, abastecimento, limpeza e depósitos. Um limite de trens na parada também vale. 0 = sem limite (depósito: um trem).
