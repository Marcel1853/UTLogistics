value-output-tooltip=A pequena saída ao lado da parada traz os pedidos em andamento como sinais: itens a carregar aqui positivos, itens chegando aqui negativos, mais o número de trens de entrega a caminho daqui. Enquanto um trem de entrega estiver parado aqui, somam-se número do trem, comprimento do trem e quantidade de vagões. Desligado: a saída some.
value-depot-output=Saída de depósito
value-depot-output-tooltip=A pequena saída verde ao lado do depósito: enquanto um trem estiver parado aqui, traz número do trem, comprimento, locomotivas, vagões e "pouco combustível" (1 = deve abastecer). Sempre: trens livres nos depósitos com este nome e trens a caminho daqui. Desligado: a saída some.
value-filter_load=Carregar só o pedido atual
value-filter_load-tooltip=O UTL define os espaços dos vagões para os itens da entrega em andamento e bloqueia o resto – um baú com vários itens e um insersor comum bastam. Desligado: os vagões ficam livres como antes. Não vale para fluidos.
