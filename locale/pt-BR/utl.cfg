section-storage-tooltip=Abaixo do mínimo, o armazém pede – até o máximo. O que estiver acima do mínimo ele oferece como um fornecedor normal; se estiver mais perto do solicitante, ele ganha. Itens sem limites (por exemplo, carga restante) são oferecidos por completo, como reserva.
