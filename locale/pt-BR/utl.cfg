utl-network-combinator=Libera o combinador de rede UTL: ele emite como sinais o estoque, o estoque dos armazéns, a demanda, a falta ou a contagem de trens de uma rede.
utl-loading-control=Filtros nos vagões ao carregar e a saída de pedidos em cada parada: os trens só levam o que foi pedido, e insersores e bombas podem ser comandados pelo pedido em andamento.
utl-networks-1=Uma rede pode ter um parceiro. As duas então se ajudam com trens, depósitos, estações de abastecimento e de limpeza.
utl-networks-2=Uma rede pode ter dois parceiros.
utl-networks-3=Uma rede pode ter três parceiros.
utl-train-logistics=Libera a parada de trem UTL e o combinador de estação UTL: tráfego automático de trens entre fornecedores e solicitantes. O porto UTL (Cargo Ships) vem com "Transporte aquático automatizado".
utl-storage=Estações de armazém – para estações que recebem e entregam.
utl-storage-2=Mais itens diferentes por estação de armazém.
utl-storage-3=Mais itens diferentes por estação de armazém.
utl-storage-4=Mais itens diferentes por estação de armazém.

