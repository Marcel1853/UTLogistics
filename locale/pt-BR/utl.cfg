[entity-description]
utl-station-settings=Depósito invisível das configurações da estação (pedidos, função, valores), para que os parâmetros de planta funcionem. O UTL o constrói sozinho – sem robôs nem itens.
utl-port=Porto do Cargo Ships com lógica UTL embutida – como a parada de trem UTL, só que para navios. Ligue baús/tanques direto nele: valores positivos = oferta, negativos = demanda.
utl-network-combinator=Emite o estado de uma rede UTL como sinais: estoque, estoque dos armazéns, demanda, falta ou contagem de trens. Defina rede e modo na janela dele. O que fazer com os sinais (lâmpada, painel, plataforma de pouso de carga …) você liga por conta própria.
utl-train-stop=Parada de trem com lógica UTL embutida. Ligue baús/tanques direto na parada: valores positivos = oferta, negativos = demanda. Pode ser colocada diretamente sobre paradas normais.
utl-station-combinator=Pertence a uma parada de trem normal: ligue a SAÍDA dele (vermelho ou verde) na parada. Ligue baús/tanques ou a demanda na ENTRADA: valores positivos = oferta, valores negativos = demanda. Defina funções e limites na janela.

