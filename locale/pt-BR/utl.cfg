[mod-setting-description]
utl-status-color-incoming=Cor deste estado no painel de exibição da estação UTL (ligado por fio) e nas lâmpadas da parada.
utl-status-color-stopped=Cor deste estado no painel de exibição da estação UTL (ligado por fio) e nas lâmpadas da parada.
utl-status-color-depot=Cor deste estado no painel de exibição da estação UTL (ligado por fio) e nas lâmpadas da parada.
utl-status-color-idle=Cor deste estado no painel de exibição da estação UTL (ligado por fio) e nas lâmpadas da parada.
utl-status-color-off=Cor deste estado no painel de exibição da estação UTL (ligado por fio) e nas lâmpadas da parada.
utl-leader-inactive-days=Um líder de equipe que não fica online por esta quantidade de dias (tempo de jogo, com o servidor rodando) perde os direitos de líder. Se não sobrar nenhum líder, o membro ativo mais antigo assume. 0 = nunca.
utl-timeout-mode="Carga ou inatividade" (padrão): o trem parte assim que estiver cheio ou vazio, ou quando nada mudou por esse tempo – com o que tiver, mesmo com o baú vazio. "Carga e inatividade": parte só quando estiver cheio ou vazio e nada tiver mudado por esse tempo. Cada equipe pode ajustar isso no Gerenciador UTL.
utl-top-up=Se a demanda aumentar enquanto um trem ainda está a caminho do fornecedor ou carregando lá, a quantidade é somada à lista de carga em andamento em vez de iniciar uma segunda viagem. Requer que o mesmo fornecedor tenha os itens e que o trem tenha espaço. Economiza trens, mas o trem fica mais tempo no fornecedor. Padrão: desligado.
utl-multi-pickup=Se um fornecedor não tiver o suficiente para a demanda, o trem pega o resto em um segundo fornecedor da mesma rede – uma viagem com duas paradas de carga em vez de duas viagens. Só na mesma superfície, no máximo dois fornecedores. Padrão: desligado.
utl-min-load-percent=Um trem só parte se pelo menos esta porcentagem do seu espaço de carga for preenchida – contam todos os itens que o mesmo fornecedor entrega para este solicitante. Sem viagens para pequenas sobras (por exemplo, quando faltam só 1000 a um solicitante); a demanda espera até juntar o suficiente. 0 = desligado. Padrão: 0.
utl-multi-pickup-detour=O segundo fornecedor só é visitado se o desvio for no máximo esta porcentagem da distância direta do primeiro fornecedor até o solicitante (em linha reta). Se estiver mais longe, vai um segundo trem. 0 = qualquer desvio é permitido. Padrão: 50.
utl-cleanup-offer=Permite que estações de limpeza ofereçam seu conteúdo de volta à rede – ligado por estação com a caixa “Oferecer conteúdo de novo” (desligada lá por padrão). Desligado aqui = desativado no mapa inteiro.
utl-storage=Permite o tipo de estação “Armazém” (estoque mínimo/máximo por item). Desligado = armazéns não oferecem nem pedem nada, no mapa inteiro.
utl-load-timeout=Segundos sem nenhuma mudança na carga no fornecedor (0 = sem condição). Com "Carga ou inatividade" (padrão), o trem também parte antes de tudo estar carregado, se nada foi adicionado por esse tempo – com o que tiver; com "Carga e inatividade", parte só quando tudo estiver carregado e nada tiver mudado por esse tempo. Se não carregou nada, a entrega é cancelada. Padrão para todas as equipes; cada equipe pode definir seus próprios valores no Gerenciador UTL (aba "Configurações").
utl-unload-timeout=Segundos sem nenhuma mudança na carga no solicitante (0 = sem condição). Com "Carga e inatividade", o trem parte quando estiver vazio e nada tiver mudado por esse tempo; com "Carga ou inatividade", também antes, e as sobras vão para uma estação de limpeza. Padrão para todas as equipes; cada equipe pode definir seus próprios valores no Gerenciador UTL.
utl-item-group=Automático: trilhos, trilhos elevados, sinais, paradas, locomotivas e vagões – inclusive de outros mods – ganham a aba “Trens”. Se outro mod já tiver sua própria aba de trens, os itens do UTL vão para lá e o UTL não reorganiza nada. Sempre UTL: o UTL coloca todos os itens de trem na sua aba. Desligado: nada é reorganizado.
utl-signal-style=Clássico: veículos e baús do jogo com um símbolo no canto. Plano: símbolos simples próprios no estilo dos sinais vanilla (cinza-claro com contorno escuro). Requer reinício.
utl-station-lamps=Além do painel de exibição: as duas pequenas lâmpadas no topo das paradas UTL acendem na cor do estado (azul = trem a caminho, verde = trem parado, ciano = trem esperando no depósito, amarelo = nada acontecendo, vermelho = desativada; cores nas configurações do mapa). Elas são pequenas – a exibição principal é um painel de exibição ligado à estação por fio. Requer reinício.
utl-heartbeat-interval=Quantos ticks entre os passos de trabalho do UTL. Cada passo faz só uma quantidade pequena e fixa de trabalho. Maior = menos CPU, mas reações mais lentas.
utl-debug-log=Escreve mensagens adicionais em factorio-current.log. Ative só para encontrar erros.
utl-station-batch-size=Quantas estações são lidas por pulso. Todas as estações são percorridas em sequência.
utl-max-deliveries-per-cycle=Quantos trens o despachante envia no máximo por ciclo (a cada 3 pulsos). Menor = carga de CPU mais suave.
utl-research-required=Ligado: controle de carga (filtros dos vagões, saída de pedidos), estações de armazém e ligações entre redes precisam ser pesquisados primeiro. Desligado: tudo fica disponível de imediato, até 3 parceiros por rede.
utl-station-output=Ao lado de cada estação há uma pequena saída com os pedidos em andamento como sinais: positivo no fornecedor (quanto deve ser carregado), negativo no solicitante (quanto está chegando). Use-a para insersores com filtro, bombas e painéis. Não ligue à entrada da estação – isso voltaria para o estoque.
utl-wagon-filters=Enquanto uma entrega está em andamento, o UTL define os espaços dos vagões de carga para os itens desse pedido e bloqueia o resto. Assim um fornecedor pode guardar vários itens em um baú e insersores comuns carregam só o que foi pedido. Vagões em que você mesmo definiu filtros não são alterados. Não vale para fluidos.
utl-chaining=Um trem que acabou de descarregar ou sai de uma estação de abastecimento/limpeza pega logo uma entrega compatível (preferindo um fornecedor próximo) em vez de voltar primeiro ao depósito. Economiza viagens vazias.
utl-fuel-threshold=Se alguma locomotiva de um trem estiver abaixo deste nível de combustível, o trem passa por uma estação de abastecimento UTL compatível antes do próximo pedido ou a partir do depósito (mesma rede, comprimento do trem dentro da faixa da estação). 0 = desligado.
utl-fuel-minimum=Abaixo deste nível de combustível (locomotiva mais baixa) um trem não aceita mais pedidos, a não ser que possa abastecer no caminho em uma estação de abastecimento UTL alcançável e livre. Ele fica no depósito, aparece o alerta "combustível faltando" e a saída do depósito informa isso. Entre este valor e "Abastecer abaixo de" um trem pode rodar sem parada de abastecimento se nenhuma estação estiver livre. 0 = desligado.
utl-alert-no-train-minutes=O alerta “nenhum trem adequado” só aparece depois que um pedido ficou sem atendimento por esse tempo. Enquanto um trem com o item está a caminho da estação, conta como atendido. 0 = imediatamente.
utl-stuck-minutes=Se um trem de entrega fica parado por esse tempo sem progresso – esperando em um sinal, sem encontrar caminho ou com o destino cheio –, aparece o alerta “trem travado” e o Gerenciador UTL mostra isso no trem. O UTL não cancela nada. Carregar e descarregar não contam (para isso existem os limites de tempo). 0 = desligado. Padrão: 5.
utl-alerts-no-train=Alerta quando uma estação precisa de algo e um fornecedor tem, mas não há trem livre ou adequado (rede, comprimento do trem).
utl-alerts-cargo=Alerta quando um trem espera no depósito com carga restante, não ficou vazio no solicitante ou carregou menos do que o pedido no fornecedor.
utl-alerts-trains=Alerta quando um trem de entrega não encontra caminho, nenhum depósito livre é encontrado, o abastecimento falhou ou uma entrega foi cancelada.
utl-default-provide-threshold=Valor inicial para novas estações.
utl-default-request-threshold=Valor inicial para novas estações.
utl-news=Depois de uma atualização do UTL, uma linha curta no chat sobre o que há de novo – com um link para a página “Novidades no UTL” em dicas e truques.
utl-stop-style=Vanilla: os gráficos da parada normal. UTL: modelo próprio com mastro treliçado, armário de controle e cabos coloridos (em teste), com as peças da parada normal junto ao trilho. A cor da estação continua livre para escolher. Requer reinício.

