cleanup-offer-first=Esvaziar primeiro
cleanup-offer-tier-tooltip=Só como reserva: os fornecedores normais vêm primeiro.\nComo qualquer fornecedor: prioridade, quantidade e distância decidem.\nEsvaziar primeiro: esta limpeza é buscada antes de qualquer fornecedor normal.\nItens que sobraram em um solicitante não são levados de volta a ele por uma limpeza durante 5 minutos.
role-storage=Armazém
role-storage-tooltip=Recebe e entrega: um estoque mínimo e um máximo por item. Abaixo do mínimo, enche até o máximo; o que estiver acima do mínimo é oferecido – como um fornecedor normal, o mais próximo ganha. Para jogadores avançados.
