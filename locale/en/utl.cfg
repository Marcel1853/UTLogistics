utl-station-combinator=UTL station combinator

[entity-description]
utl-train-stop=Train stop with built-in UTL logic. Wire chests/tanks directly to the stop: positive values = supply, negative = demand. Can be placed directly over normal train stops.
utl-station-combinator=Belongs to a normal train stop: wire its OUTPUT (red or green) to the stop. Wire chests/tanks or demand to the INPUT: positive values = supply, negative values = demand. Set roles and thresholds in the window.

