links-iron=Network Eisen (iron): the only train is here
links-copper=Network Kupfer (copper) – no train of its own
links-copper-wait=Network Kupfer: served once iron and copper are linked
ring-network=Network "__1__": own depot, own train
verbund-eisen=Network Eisen (iron) – center: helps copper and coal
verbund-kupfer=Network Kupfer (copper) – partner of iron, no trains of its own
verbund-kohle=Network Kohle (coal) – partner of iron
verbund-stein=Network Stein (stone) – linked to nobody
verbund-depot-eisen=Iron depot: these trains run for iron, copper and coal
verbund-depot-kohle=Coal depot: helps iron – but never copper (partners do not help each other)
verbund-depot-stein=Stone depot: runs for stone only
bsp-mixed=Three chests, three inserters: the job output (red wire) only enables the ordered one
bsp-workshop=Needs iron and copper – gets both in one trip
bsp-copper=Requester: target stock 400 – once the chest is full enough, no train comes
bsp-depot=Depot: role "Depot", train with only the depot in its schedule
bsp-depot2=Second depot with the same name – the fluid train waits here
bsp-tanks=Two tanks: the job output only opens the pump of the ordered fluid
bsp-oil=Pump opens when oil arrives (signal below 0)
bsp-water=Pump opens when water arrives (signal below 0)
last-yard=Yard: 12 tracks with one train each, all with the role "Depot"
last-siding=Station on a siding: platform + 2 waiting spots, chain signal before the switch
last-combinator=Normal train stop + UTL combinator: output wired to the stop
last-fluid=Fluids: pumps at the wagon, tank wired to the station
