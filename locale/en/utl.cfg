utl-overview=Unified Train Logistics
utl-train-stop=UTL train stop
utl-combinator=UTL station combinator
utl-roles=Roles
utl-requests=Requests
utl-values=Values and network
utl-networks=Networks (several transport systems)
utl-depots=Depots
utl-fuel=Refueling
utl-cleanup=Cleanup (leftover cargo)
utl-copy=Copying settings and blueprints
