[mod-setting-description]
utl-own-item-group=Rails, elevated rails, signals, train stops, locomotives and wagons – including other mods' – get their own tab in the crafting menu.
utl-heartbeat-interval=How many ticks between UTL work steps. Each step only does a small, fixed amount of work. Higher = less CPU, but slower reactions.
utl-debug-log=Writes additional messages to factorio-current.log. Enable only for troubleshooting.
utl-station-batch-size=How many stations are read per heartbeat. All stations are covered in turn.
utl-max-deliveries-per-cycle=How many trains the dispatcher sends out per cycle (every 3 heartbeats) at most. Lower = smoother CPU load.
utl-research-required=On: loading control (wagon filters, job output) and network links have to be researched first. Off: everything is available right away, up to 3 partners per network.
utl-station-output=Next to every station sits a small output that carries the running jobs as signals: positive at the provider (this much is to be loaded), negative at the requester (this much is arriving). Use it for filter inserters, pumps and displays. Do not wire it to the station input – that would feed back into the stock.
utl-wagon-filters=While a delivery runs, UTL sets the cargo wagon slots to the goods of that job and locks the rest. A provider can then keep several goods in one chest and plain inserters still load only what was ordered. Wagons where you set filters yourself are left alone. Does not apply to fluids.
utl-chaining=A train that just unloaded or leaves a fuel/cleanup station takes a matching delivery right away (preferring a nearby provider) instead of returning to the depot first. Saves empty trips.
utl-fuel-threshold=If any locomotive of a train is below this fuel level, the train visits a matching UTL fuel station before its next job or from the depot (same network, train length within the station's range). 0 = off.
utl-alert-no-train-minutes=The “no suitable train” alert only appears once a request has been unserved this long. While a train carrying the item is on its way to the station, it counts as served. 0 = immediately.
utl-alerts-no-train=Alert when a station needs something and a provider has it, but there is no free or no fitting train (network, train length).
utl-alerts-cargo=Alert when a train waits in the depot with leftover cargo, did not get empty at the requester, or loaded less than ordered at the provider.
utl-alerts-trains=Alert when a delivery train finds no path, no free depot is found, refueling failed, or a delivery was canceled.
utl-default-provide-threshold=Initial value for new stations.
utl-default-request-threshold=Initial value for new stations.

