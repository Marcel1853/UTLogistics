[tips-and-tricks-item-description]
utl-overview=UTL dispatches trains automatically: from the [font=default-bold]depot[/font] to a [font=default-bold]provider[/font] that has what a [font=default-bold]requester[/font] needs, then to the requester.\n\nQuick start:\n1. Depot: [item=utl-train-stop] with role "Depot", a train with only the depot in its schedule (empty, automatic).\n2. Provider: stop with role "Provider", chests wired to the stop.\n3. Requester: role "Requester", set a request slot in the window.\n\nYour schedule is kept: UTL only inserts temporary stops, train groups and interrupts stay. After unloading, the train takes the next nearby job right away.
utl-train-stop=The [item=utl-train-stop] is a train stop and a UTL station in one. Wire chests and tanks (red or green) directly to the stop: positive values are provided, negative ones requested. Set role, network and values in the UTL panel to the left of the train stop window.\n\nIt can be built directly over a normal train stop.
utl-combinator=For existing stations: place a [item=utl-station-combinator] next to a normal train stop.\n\nWire the combinator's [font=default-bold]output[/font] (red or green) to the stop – this tells UTL which stop belongs to it.\n[font=default-bold]Input[/font]: the chests/tanks.\n\nWithout a wire on the output, the window shows "No train stop". The combinator needs no power.
utl-roles=Every station gets a role in its window:\n\n[font=default-bold]Provider[/font] – goods with a positive value are picked up.\n[font=default-bold]Requester[/font] – goods with a negative value or from the request slots are delivered.\nProvider + requester – buffer.\n[font=default-bold]Depot[/font] – free trains wait here.\n[font=default-bold]Fuel station[/font] – trains refuel here.\n[font=default-bold]Cleanup[/font] – trains with leftover cargo are emptied here.
utl-requests=The amount in a request slot is a [font=default-bold]target stock[/font], not an order: UTL delivers "target − in stock − already in transit".\n\nFor several trains at once, set a higher target stock. If the provider has more goods the same requester needs, the train loads them too while there is room. Fluids travel in fluid wagons (pumps at the wagon, tank wired to the station).\n\nSeveral goods at a provider: one mixed chest is enough – during a delivery UTL filters the wagon slots to the ordered goods. With the job output you can also switch inserters and pumps by the running job (research \"UTL: Loading control\").\n\n"In transit" in the station window shows what is being delivered or picked up right now.
utl-values=In the "Values" tab:\n• [font=default-bold]Min./max. train length[/font] – only fitting trains (locomotives count, 0 = any).\n• [font=default-bold]Max. trains[/font] – at most this many at once (the stop's train limit applies too).\n• [font=default-bold]Thresholds[/font] – goods are offered or delivered only from this amount on (also in stacks).\n• [font=default-bold]Priority[/font] – higher goes first.\n• [font=default-bold]Locked slots[/font] per wagon.\n\nYou can use math in every number field, e.g. "4000*2". ⟲ resets a value.\n\n[font=default-bold]Network[/font]: separates several transport networks on one map. Only stations with exactly the same name work together, in every role: a train from depot "Ore" only serves ore stations, only refuels at ore fuel stations and is only emptied at ore cleanups.\n\nEmpty = network "default". So every network needs its own depot, fuel station and cleanup. A depot in the wrong network causes the alert "no free train in network …" although trains are waiting.\n\nWith the research "UTL: Network links" networks can be linked so they help each other – see the entry "Networks".
utl-networks=The [font=default-bold]network[/font] separates several transport systems on one map – without separating the rails. In the scene both trains run on [font=default-bold]the same loop[/font]: "Erze" (ore) and "Platten" (plates), each network with its own depot, provider and requester.\n\nOnly stations with [font=default-bold]exactly the same name[/font] work together. That is why the ore train drives straight past the plate station.\n\nThis applies to every role: a train only refuels at a fuel station of its own network and is only emptied at a cleanup of its own network. So every network needs its own depot, fuel station and cleanup – unless you link networks.\n\nEmpty = network "default". Leave the field empty everywhere if you just want one big network.\n\nNetworks can also be [font=default-bold]linked[/font] so they help each other – see \"Linking networks\".
utl-depots=Free trains wait [font=default-bold]empty[/font] at stops with the "Depot" role – every depot stop needs the role, the name alone is not enough.\n\nIf a train ends up at a stop with a depot's name but without the role, it moves to a real depot by itself.\n\nMin./max. train length at a depot: a train that does not fit moves to a matching depot with the same name.
utl-fuel=If a locomotive is below the refuel limit (map setting, default 40 %), the train first visits a matching [font=default-bold]fuel station[/font] and then continues to its job.\n\nInserters at the fuel station fill the locomotives. The train waits until all locomotives are full (max. 30 s).\n\nWithout any fuel station in the network, low trains run normally – you refuel yourself then (e.g. with an interrupt).
utl-cleanup=A train with leftover cargo goes to a matching [font=default-bold]cleanup[/font] station, is emptied there (inserters or pumps) and then takes the next job.\n\nWhat a cleanup station accepts is set in the "Values" tab: [virtual-signal=utl-cleanup-all-items] all items, [virtual-signal=utl-cleanup-all-fluids] all fluids or single goods. Goods entered one by one come first; if one station is not enough, the train visits several in a row.\n\nWithout a fitting cleanup, the train waits in the depot and an alert is shown.
utl-copy=[font=default-bold]Shift + right click[/font] on a station copies its UTL settings, [font=default-bold]Shift + left click[/font] on another pastes them.\n\n[item=blueprint] Blueprints, copy/paste (Ctrl + C / Ctrl + V) and cloning keep the settings.
utl-manager=The [font=default-bold]UTL Manager[/font] shows your whole train network at a glance. Open it with the locomotive button in the shortcut bar or [font=default-bold]Ctrl + Shift + U[/font] (or [font=default-bold]Ctrl + Alt + U[/font]). Top right: magnifier = search (filters by name), arrows = refresh now.\n\nThe tabs:\n• [font=default-bold]Depots[/font] – on the left every depot with free/total trains. Click a depot to see its trains on the right with composition, state and cargo; the train button follows the train on the map.\n• [font=default-bold]Stations[/font] – role, supply (green), demand (red), in transit (blue = arriving, yellow = being picked up) and number of trains. The network stands behind the name, with links e.g. [Iron ↔ Copper]. Click the name to see the station on the map.\n• [font=default-bold]Networks[/font] – every network with its links, see "Manager: Networks".\n• [font=default-bold]Inventory[/font] – everything provided, requested and on the move, see "Manager: Inventory".\n• [font=default-bold]History[/font] – the last 100 deliveries with duration; cancelled ones in red with the reason.\n• [font=default-bold]Alerts[/font] – no free or fitting train, leftover cargo, missing cargo, no path, refueling failed. Each group can be turned off in the per-player settings.\n\nIn the scene a train with leftover cargo arrives at the depot and there is no cleanup – this is how the alert looks in the \"Alerts\" tab. The button next to it shows the spot on the map.
utl-network-links=You can [font=default-bold]create[/font] as many networks as you like. Only [font=default-bold]linking[/font] is limited – research "UTL: Network links I–III" allows 1, 2 or 3 partners per network.\n\nIn the scene only the network "Eisen" (iron) has a train, provider and requester are in the network "Kupfer" (copper) – nothing moves at first. In the depot's station window, box [font=default-bold]"Linked with"[/font]:\n1. Pick "Kupfer" from the list – it is a partner right away, and the iron train leaves.\n2. Click [font=default-bold]New[/font], type a name ("Kohle", coal), ✓ – the network is created and linked at once.\nEvery partner then shows as a button; a click removes the link. The counter (2 / 2) shows used and allowed partners, the tooltip names the research for more.\n\nHow a link works – a [font=default-bold]star[/font]:\n• Center and partner help each other with trains, depots, fuel stations and cleanups.\n• Partners do [font=default-bold]not[/font] help each other: a copper train never runs for "Kohle".\n• A partner belongs to no further network and gets no partners of its own.\n• The link applies to the whole network on this surface, not just to the station. On Vulcanus you build separate stars.
utl-manager-networks=The [font=default-bold]Networks[/font] tab in the manager: on the left every network (with the surface when there are several planets) with its number of stations, free trains and running deliveries.\n\nClick a network to see on the right:\n• at the top the box [font=default-bold]"Linked with"[/font] – pick a partner from the list or enter a new name and ✓; a click on a partner button removes the link. It works just like in the station window.\n• below it every station of the star with role and network; partner stations are grey.\n\nIf the selected network is a partner itself, the button shows its center; a click leaves the star.\n\nThe [font=default-bold]Stations[/font] tab shows the link behind the name: [Iron ↔ Copper] for the center, [Copper → Iron] for a partner.
utl-manager-inventory=The [font=default-bold]Inventory[/font] tab in the manager shows everything in the network as icons on the left: [font=default-bold]supply[/font] (green), [font=default-bold]demand[/font] (red) and [font=default-bold]in transit[/font] (blue).\n\n[font=default-bold]Click a good[/font] – on the right you get:\n• the totals for supply, demand and in transit,\n• every station that has or needs it (click the name to see it on the map),\n• every train carrying it right now, with start and destination.\n\nClick the same good again to close the view. The tab does not refresh by itself so the list does not jump while you read – use the arrows at the top.

