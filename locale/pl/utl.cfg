no-free-trains=UTL: sieć "__1__": __2__ zapotrzebowań czeka na wolny pociąg dłużej niż __3__ minut – dodaj pociągi do zajezdni.
no-fitting-train=UTL: __1__ z __2__ do __3__ – wolne pociągi w sieci "__4__" nie pasują (sprawdź długość pociągu lub ładownię).
depot-cargo=UTL: __1__ po oczyszczaniu nadal ma resztki ładunku i czeka w zajezdni __2__ bez zleceń. Sprawdź stację oczyszczania (pełna skrzynia?) lub opróżnij pociąg.
