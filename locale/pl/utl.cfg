settings-map-note=Dotyczą wszystkich drużyn. Wartość zmieniona tutaj obowiązuje zamiast wartości z ustawień moda; jeśli zmienisz ją ponownie w menu ustawień moda, wygrywa menu.
settings-team-note=Te wartości dotyczą tylko twojej drużyny; jako lider drużyny możesz je zmieniać. Bez własnej wartości obowiązuje wartość mapy poniżej.
