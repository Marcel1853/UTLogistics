cancel-tooltip=Anuluj edycję
requests=Zapotrzebowania
requests-tooltip=Czego chce ta stacja – bez okablowania. Działa jak kombinator stałych z ujemnymi wartościami na wejściu.
request-slot-tooltip=Lewy klik: wybierz towar lub zmień ilość\nPrawy klik: wyczyść gniazdo
request-slot-fuel-tooltip=Wybierz paliwo, które zamawia ta stacja paliw (tylko to, co spalają lokomotywy). Prawy klik czyści gniazdo.
