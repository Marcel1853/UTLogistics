[technology-description]
utl-network-combinator=Odblokowuje kombinator sieci UTL: wysyła jako sygnały zapas, zapas magazynów, zapotrzebowanie, braki lub liczbę pociągów sieci.
utl-loading-control=Filtry wagonów przy załadunku i wyjście zleceń przy każdym przystanku: pociągi biorą tylko to, co zamówiono, a podajniki i pompy można przełączać według bieżącego zlecenia.
utl-networks-1=Sieć może mieć jednego partnera. Obie pomagają sobie wtedy pociągami, zajezdniami, stacjami paliw i oczyszczania.
utl-networks-2=Sieć może mieć dwóch partnerów.
utl-networks-3=Sieć może mieć trzech partnerów.
utl-train-logistics=Odblokowuje przystanek UTL i kombinator stacji UTL: automatyczny ruch pociągów między dostawcami a odbiorcami. Port UTL (Cargo Ships) przychodzi z "Zautomatyzowanym transportem wodnym".
utl-storage=Stacje magazynowe – dla stacji, które przyjmują i wydają.
utl-storage-2=Więcej różnych towarów na stację magazynową.
utl-storage-3=Więcej różnych towarów na stację magazynową.
utl-storage-4=Więcej różnych towarów na stację magazynową.

[utl-gui]
window-position=Położenie:
window-position-left=Panel po lewej stronie okna przystanku (domyślnie)
window-position-right=Panel po prawej stronie okna przystanku
window-position-free=Osobne okno, swobodnie przesuwane (miejsce jest zapamiętywane)
expression-tooltip=Można liczyć, np. 4000*2 lub 10*s – s to rozmiar stosu towaru.
readout-network=Sieć
readout-network-tooltip=Którą sieć UTL odczytuje ten kombinator (na jego powierzchni i dla jego drużyny).
readout-star=Uwzględnij połączone sieci
readout-star-tooltip=Licz też połączone sieci (gwiazda) – te same, które pomagają sobie pociągami.
readout-mode=Wyjście
readout-mode-stock=Zapas
readout-mode-stock-tooltip=Na towar – co dostawcy w sieci oferują teraz (magazyny: to, co ponad minimum).
readout-mode-storage=Zapas magazynów
readout-mode-storage-tooltip=Na towar – co leży w stacjach magazynowych sieci.
readout-mode-demand=Zapotrzebowanie
readout-mode-demand-tooltip=Na towar – czego odbiorcy w sieci teraz potrzebują, niezależnie od tego, czy jest oferowane.
readout-mode-shortage=Braki
readout-mode-shortage-tooltip=Na towar – czego potrzebują odbiorcy, a nikt w sieci nie oferuje. Np. podłącz do lądowiska towarowego (ustaw zapotrzebowania), aby sprowadzić to z orbity.
readout-mode-trains=Pociągi
readout-mode-trains-tooltip=Pociągi łącznie, wolne w zajezdni, w drodze, trwające dostawy, z małą ilością paliwa, bez drogi, a także pociągi z połączonych sieci pomagające tutaj i własne pociągi pracujące w innych sieciach – jako sygnały UTL. Liczą się pociągi, których macierzysta zajezdnia jest w tej sieci.
readout-transit=Licz towary w drodze
readout-transit-tooltip=Dolicz towary, które są teraz w pociągach jadących do odbiorców.
readout-output=Obecnie wysyła
readout-hint=Sygnały są na kombinatorze. Co robią (lampa, wyświetlacz, lądowisko towarowe …), zależy od twojego okablowania.
readout-status-ok=__1__ sygnałów – sieć "__2__"
readout-status-empty=Nic do wysłania – sieć "__1__" nie ma teraz wartości dla tego trybu.
tab-station=Stacja
tab-values=Wartości
station-title=Stacja UTL
status-ok=Gotowa · Przystanek: __1__
status-idle=Bez zadania · Przystanek: __1__
status-no-stop=Brak przystanku: podłącz wyjście do zwykłego przystanku
network=Sieć
network-tooltip=Oddzielne sieci transportowe na jednej mapie. Razem pracują tylko stacje o dokładnie tej samej nazwie – dotyczy to też zajezdni, stacji paliw i oczyszczania.\nPuste = sieć "default". Wielkość liter ma znaczenie.
network-pick-tooltip=Wybierz sieć macierzystą – tu widać wszystkie sieci, które już istnieją na tej mapie.
networks-add-tooltip=Wybierz sieć, która już istnieje na mapie i jest jeszcze wolna – stanie się partnerem tej sieci.
networks-new=Nowa
links=Połączona z
links-count=Połączona z (__1__ / __2__)
links-tooltip=Połączone sieci pomagają sobie: pociągi, zajezdnie, stacje paliw i oczyszczania jednej obsługują też drugą. Sieć tutaj jest centrum, połączone są partnerami. Partnerzy nie pomagają sobie nawzajem i nie należą do innej grupy połączeń. Dotyczy całej sieci na tej powierzchni.
link-center-chip=__1__ (centrum)  ×
link-leave-tooltip=Opuść grupę połączeń "__1__".
link-own-partner=Ta sieć jest partnerem "__1__" – partnerzy nie mogą mieć własnych partnerów.
link-self=Sieci nie można połączyć z nią samą.
link-center-is-partner=Ta sieć jest już partnerem innej sieci i nie może mieć własnych partnerów.
link-partner-taken="__1__" jest już połączona z inną siecią.
link-partner-is-center="__1__" ma już własnych partnerów i nie może zostać partnerem.
link-limit=Badania nie pozwalają jeszcze na więcej partnerów.
networks-limit=Możliwych jest najwyżej __1__ partnerów.
networks-limit-research=Osiągnięto __1__ partnerów – więcej z badaniem "__2__".
research-needed=Wymaga badania "__1__".
networks-new-tooltip=Utwórz sieć o nowej nazwie i od razu połącz ją jako partnera.
elevator-network=Dostarczaj przez windę kosmiczną
elevator-network-tooltip=Sieć "__1__" może dostarczać towary przez ukończone, zasilane windy kosmiczne między planetą a orbitą. Dotyczy sieci o tej samej nazwie po obu stronach. Domyślnie: wył.
elevator-none-here=Na tej powierzchni nie ma jeszcze windy kosmicznej.
networks-add-none=Brak wolnej sieci – utwórz ją przyciskiem "Nowa".
networks-chip-tooltip=Usuń połączenie z "__1__".
network-rename-tooltip=Zmień nazwę sieci macierzystej lub wpisz nową.
network-name-tooltip=Wpisz nazwę i naciśnij Enter. Puste = sieć "default".
cancel=Anuluj
role-provider=Dostawca
role-provider-tooltip=Oferuje towary, które na wejściu są dodatnie.
role-active_provider=Aktywny dostawca
role-active_provider-tooltip=Jak aktywna skrzynia zaopatrzeniowa: stacja ma zostać opróżniona, nawet bez zapotrzebowania. Jej towary trafiają najpierw do odbiorców (przed wszystkimi innymi dostawcami), potem do magazynów do ich maksimum, a na końcu do stacji oczyszczania, które przyjmują te towary. Progi i minimalny ładunek nadal obowiązują.
role-requester=Odbiorca
role-requester-tooltip=Zamawia towary: ujemne wartości na wejściu lub gniazda zapotrzebowania poniżej.
role-depot=Zajezdnia
role-depot-tooltip=Tu wolne pociągi czekają na zlecenia.
role-fuel=Stacja paliw
role-fuel-tooltip=Tu przyjeżdżają pociągi z małą ilością paliwa.
role-cleanup=Oczyszczanie
role-cleanup-tooltip=Tu są rozładowywane pociągi z resztkami ładunku.
section-common=Ogólne
section-provider=Dostawca
section-requester=Odbiorca
section-depot=Zajezdnia
section-fuel=Stacja paliw
section-cleanup=Oczyszczanie: co może tu przyjeżdżać
section-cleanup-tooltip=Przyjeżdżają tu tylko pociągi, których resztki ładunku są tu przyjmowane. Towary wpisane pojedynczo mają pierwszeństwo przed "Wszystkie …"; jeśli jedna stacja nie wystarczy, pociąg odwiedza kilka oczyszczeń po kolei.
cleanup-all_items-tooltip=Przyjmuj wszystkie przedmioty (__1__)
cleanup-all_fluids-tooltip=Przyjmuj wszystkie płyny (__1__)\nUwaga: zbiornik mieści tylko jeden płyn – lepiej jedno oczyszczanie na płyn, każde z własnym zbiornikiem.
cleanup-or-single=lub pojedynczo:
cleanup-offer=Ponownie oferuj zawartość
cleanup-offer-tooltip=UTL ponownie oferuje sieci to, co leży w tym oczyszczaniu – jak dostawca. Skrzynie muszą być podłączone do przystanku lub kombinatora, jak u każdego dostawcy.
cleanup-offer-disabled=Wyłączone na tej mapie (ustawienie mapy „Oczyszczanie może ponownie oferować zawartość”).
cleanup-offer-reserve=Tylko jako rezerwa
cleanup-offer-normal=Jak każdy dostawca
cleanup-offer-first=Opróżniaj najpierw
cleanup-offer-tier-tooltip=Tylko jako rezerwa: najpierw zwykli dostawcy.\nJak każdy dostawca: decydują priorytet, ilość i odległość.\nOpróżniaj najpierw: to oczyszczanie jest odbierane przed każdym zwykłym dostawcą.\nTowary pozostałe u odbiorcy nie są mu przez 5 minut przywożone z powrotem z oczyszczania.
role-storage=Magazyn
role-storage-tooltip=Przyjmuje i wydaje: minimalny i maksymalny zapas na towar. Poniżej minimum uzupełnia do maksimum; wszystko ponad minimum jest oferowane – jak u zwykłego dostawcy, wygrywa bliższy. Dla zaawansowanych.
role-storage-locked=Magazyn wymaga badania „UTL: Magazyn” (oraz ustawienia mapy „Zezwalaj na stacje magazynowe”).
role-addon-tooltip=Rola z moda „__1__”. UTL jeździ tutaj tylko tak, jak mówi ten mod.
section-storage=Magazyn
section-storage-tooltip=Poniżej minimum magazyn zamawia – do maksimum. To, co ponad minimum, oferuje jak zwykły dostawca; jeśli jest bliżej odbiorcy, wygrywa. Towary bez limitów (np. resztki ładunku) są oferowane w całości, jako rezerwa.
storage-good=Towar
storage-good-tooltip=Towar, dla którego ten magazyn ma limity. Prawy klik czyści gniazdo.
storage-min=Minimum
storage-min-tooltip=Jeśli zapas spadnie poniżej, magazyn zamawia – do maksimum.
storage-max=Maksimum
storage-max-tooltip=Do tej wartości uzupełnia, gdy magazyn spadnie poniżej minimum.
storage-leftover=Przyjmuj resztki ładunku
storage-leftover-tooltip=Pociągi z resztkami ładunku mogą je tu zostawić, jak na oczyszczaniu. Jakie towary – ustawia się w sekcji oczyszczania.
cleanup-slot-tooltip=Ten towar można tu opróżnić. Prawy klik czyści gniazdo.
on=wł.
off=wył.
reset-tooltip=Przywróć domyślne
value-min_train_length=Min. długość pociągu
value-min_train_length-tooltip=Tylko pociągi z co najmniej tyloma pojazdami (wliczając lokomotywy). 0 = dowolne.\nZajezdnia: krótszy pociąg przejeżdża do pasującej zajezdni o tej samej nazwie.
value-max_train_length=Maks. długość pociągu
value-max_train_length-tooltip=Tylko pociągi z najwyżej tyloma pojazdami (wliczając lokomotywy). 0 = dowolne.\nZajezdnia: dłuższy pociąg przejeżdża do pasującej zajezdni o tej samej nazwie.
value-max_trains=Maks. pociągów
value-max_trains-tooltip=Najwyżej tyle pociągów naraz tutaj lub w drodze – u dostawców, odbiorców, w magazynach, na stacjach paliw, oczyszczania i w zajezdniach. Limit pociągów na przystanku też obowiązuje. 0 = bez limitu (zajezdnia: jeden pociąg).
value-provide_threshold=Próg oferty
value-provide_threshold-tooltip=Towar jest oferowany dopiero od tej ilości.
value-provide_stack_threshold=Próg oferty w stosach
value-provide_stack_threshold-tooltip=Próg w stosach (tylko przedmioty). Obowiązuje, gdy jest wyższy niż próg oferty. 0 = wył.
value-provide_priority=Priorytet oferty
value-provide_priority-tooltip=Dostawcy z wyższym priorytetem są używani najpierw.
value-locked_slots=Zablokowane gniazda na wagon
value-locked_slots-tooltip=Tyle gniazd w każdym wagonie towarowym zostaje pustych przy załadunku.
value-output=Wyjście zleceń
value-output-tooltip=Małe wyjście obok przystanku niesie bieżące zlecenia jako sygnały: towary do załadunku tutaj dodatnie, towary nadjeżdżające tutaj ujemne, plus liczba pociągów z dostawą, które tu jadą. Gdy stoi tu pociąg z dostawą, dochodzą numer pociągu, długość pociągu i liczba wagonów. Wył.: wyjście znika.
value-depot-output=Wyjście zajezdni
value-depot-output-tooltip=Małe zielone wyjście obok zajezdni: gdy stoi tu pociąg, niesie numer pociągu, długość, lokomotywy, wagony i "mało paliwa" (1 = powinien zatankować). Zawsze: wolne pociągi w zajezdniach o tej nazwie i pociągi jadące tutaj. Wył.: wyjście znika.
value-filter_load=Ładuj tylko bieżące zlecenie
value-filter_load-tooltip=UTL ustawia gniazda wagonów na towary bieżącej dostawy i blokuje resztę – wystarczy wtedy jedna skrzynia z kilkoma towarami i zwykły podajnik. Wył.: wagony pozostają wolne jak dawniej. Nie dotyczy płynów.
value-request_threshold=Próg zapotrzebowania
value-request_threshold-tooltip=Towar jest zamawiany dopiero od takiego zapotrzebowania.
value-request_stack_threshold=Próg zapotrzebowania w stosach
value-request_stack_threshold-tooltip=Próg w stosach (tylko przedmioty). Obowiązuje, gdy jest wyższy niż próg zapotrzebowania. 0 = wył.
value-request_priority=Priorytet zapotrzebowania
value-request_priority-tooltip=Odbiorcy z wyższym priorytetem są obsługiwani najpierw.
value-depot_priority=Priorytet zajezdni
value-depot_priority-tooltip=Pociągi z zajezdni o wyższym priorytecie są używane najpierw.
value-fuel_request=Zamawiaj paliwo
value-fuel_request-tooltip=Stacja paliw sama zamawia paliwo: wpisz w gniazdach zapotrzebowania, jakie paliwo i ile – UTL dostarczy je jak odbiorcy (obowiązują próg i priorytet zapotrzebowania). Podajniki rozładunkowe ustaw przy skrzyni, z której biorą podajniki tankujące. Domyślnie: wył.
