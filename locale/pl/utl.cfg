settings-leaders=Liderzy drużyny:
settings-leaders-tooltip=Liderzy drużyny mogą zmieniać wartości drużyny i mianować kolejnych liderów. Kto pierwszy dołączy do drużyny, jest jej liderem; gdy odchodzi ostatni lider, liderem zostaje najdłużej obecny członek.
