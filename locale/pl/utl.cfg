[tips-and-tricks-item-description]
utl-network-combinator=[item=utl-network-combinator] [font=default-bold]Kombinator sieci[/font] wysyła stan sieci UTL jako sygnały. W jego oknie wybierasz sieć (opcjonalnie z połączonymi sieciami) i to, co wysyła:\n• [font=default-bold]Zapas[/font] – na towar, co oferują dostawcy w sieci,\n• [font=default-bold]Zapas magazynów[/font] – co leży w stacjach magazynowych,\n• [font=default-bold]Zapotrzebowanie[/font] – czego potrzebują odbiorcy,\n• [font=default-bold]Braki[/font] – czego potrzebują odbiorcy, a nikt nie oferuje,\n• [font=default-bold]Pociągi[/font] – łącznie, wolne, w drodze, dostawy, mało paliwa, bez drogi; a także, czy pociągi z połączonych sieci pomagają tutaj, czy własne pociągi pracują gdzie indziej.\n\nW scenie odbiorca chce żelaza i miedzi. Pociąg przywozi żelazo, miedzi nikt nie oferuje – dlatego w trybie "Braki" kombinator wysyła tylko miedź, a lampa świeci.\n\nCo dzieje się z sygnałami, zależy od twojego okablowania: lampa jak w scenie, wyświetlacz – albo w Space Age [font=default-bold]braki[/font] do lądowiska towarowego ("ustaw zapotrzebowania"), aby sprowadzało brakujące towary z orbity. Odblokowane przez "UTL: Kombinator sieci".
utl-overview=UTL rozsyła pociągi automatycznie: z [font=default-bold]zajezdni[/font] do [font=default-bold]dostawcy[/font], który ma to, czego potrzebuje [font=default-bold]odbiorca[/font], a potem do odbiorcy.\n\nSzybki start:\n1. Zajezdnia: [item=utl-train-stop] z rolą "Zajezdnia", pociąg z samą zajezdnią w rozkładzie (pusty, automatyczny).\n2. Dostawca: przystanek z rolą "Dostawca", skrzynie podłączone przewodem do przystanku.\n3. Odbiorca: rola "Odbiorca", wypełnij gniazdo zapotrzebowania w oknie.\n\nTwój rozkład zostaje zachowany: UTL wstawia tylko tymczasowe przystanki, grupy pociągów i przerwania pozostają. Po rozładunku pociąg od razu bierze następne pobliskie zlecenie.
utl-train-stop=[item=utl-train-stop] to przystanek i stacja UTL w jednym. Podłączaj skrzynie i zbiorniki (czerwonym lub zielonym) bezpośrednio do przystanku: wartości dodatnie są oferowane, ujemne zamawiane. Rolę, sieć i wartości ustawiasz w panelu UTL po lewej stronie okna przystanku.\n\nMożna go budować bezpośrednio na zwykłym przystanku.
utl-combinator=Dla istniejących stacji: postaw [item=utl-station-combinator] obok zwykłego przystanku.\n\nPodłącz [font=default-bold]wyjście[/font] kombinatora (czerwonym lub zielonym) do przystanku – tak UTL wie, który przystanek do niego należy.\n[font=default-bold]Wejście[/font]: skrzynie/zbiorniki.\n\nBez przewodu na wyjściu okno pokazuje "Brak przystanku". Kombinator nie potrzebuje prądu.
utl-roles=Każda stacja dostaje w swoim oknie rolę:\n\n[font=default-bold]Dostawca[/font] – towary o wartości dodatniej są odbierane.\n[font=default-bold]Odbiorca[/font] – towary o wartości ujemnej lub z gniazd zapotrzebowania są dostarczane.\nDostawca + odbiorca – bufor.\n[font=default-bold]Zajezdnia[/font] – tu czekają wolne pociągi.\n[font=default-bold]Stacja paliw[/font] – tu pociągi tankują.\n[font=default-bold]Oczyszczanie[/font] – tu opróżniane są pociągi z resztkami ładunku.\n[font=default-bold]Magazyn[/font] – przyjmuje i wydaje, z minimalnym i maksymalnym zapasem na towar (zaawansowane, badanie "UTL: Magazyn").
utl-requests=Ilość w gnieździe zapotrzebowania to [font=default-bold]zapas docelowy[/font], a nie zamówienie: UTL dostarcza "cel − w zapasie − już w drodze".\n\nAby jechało kilka pociągów naraz, ustaw wyższy zapas docelowy. Jeśli dostawca ma więcej towarów potrzebnych temu samemu odbiorcy, pociąg ładuje je też, dopóki jest miejsce. Płyny jeżdżą w wagonach-cysternach (pompy przy wagonie, zbiornik podłączony do stacji).\n\nKilka towarów u dostawcy: wystarczy jedna mieszana skrzynia – podczas dostawy UTL filtruje gniazda wagonu na zamówione towary. Z wyjściem zleceń możesz też przełączać podajniki i pompy według bieżącego zlecenia (badanie \"UTL: Kontrola załadunku\").\n\n"W drodze" w oknie stacji pokazuje, co jest teraz dostarczane lub odbierane.
utl-values=Na karcie "Wartości":\n• [font=default-bold]Min./maks. długość pociągu[/font] – tylko pasujące pociągi (lokomotywy się liczą, 0 = dowolne).\n• [font=default-bold]Maks. pociągów[/font] – najwyżej tyle naraz (limit pociągów przystanku też obowiązuje).\n• [font=default-bold]Progi[/font] – towary są oferowane lub dostarczane dopiero od tej ilości (także w stosach).\n• [font=default-bold]Priorytet[/font] – wyższy idzie pierwszy.\n• [font=default-bold]Zablokowane gniazda[/font] na wagon.\n\nW każdym polu liczbowym można liczyć, np. "4000*2". ⟲ przywraca wartość.\n\n[font=default-bold]Sieć[/font]: oddziela kilka sieci transportowych na jednej mapie. Razem pracują tylko stacje o dokładnie tej samej nazwie, we wszystkich rolach: pociąg z zajezdni "Ruda" obsługuje tylko stacje rudy, tankuje tylko na stacjach paliw rudy i jest opróżniany tylko na oczyszczaniach rudy.\n\nPuste = sieć "default". Dlatego każda sieć potrzebuje własnej zajezdni, stacji paliw i oczyszczania. Zajezdnia w złej sieci powoduje alarm "brak wolnego pociągu w sieci …", choć pociągi czekają.\n\nZ badaniem "UTL: Połączenia sieci" sieci można połączyć, aby sobie pomagały – patrz wpis "Sieci".
utl-networks=[font=default-bold]Sieć[/font] oddziela kilka systemów transportowych na jednej mapie – bez rozdzielania torów. W scenie oba pociągi jeżdżą po [font=default-bold]tej samej pętli[/font]: "Erze" (ruda) i "Platten" (płyty), każda sieć z własną zajezdnią, dostawcą i odbiorcą.\n\nRazem pracują tylko stacje o [font=default-bold]dokładnie tej samej nazwie[/font]. Dlatego pociąg z rudą przejeżdża obok stacji płyt.\n\nDotyczy to wszystkich ról: pociąg tankuje tylko na stacji paliw własnej sieci i jest opróżniany tylko na oczyszczaniu własnej sieci. Dlatego każda sieć potrzebuje własnej zajezdni, stacji paliw i oczyszczania – chyba że połączysz sieci.\n\nPuste = sieć "default". Zostaw pole wszędzie puste, jeśli chcesz mieć tylko jedną dużą sieć.\n\nSieci można też [font=default-bold]połączyć[/font], aby sobie pomagały – patrz \"Łączenie sieci\".
utl-depots=Wolne pociągi czekają [font=default-bold]puste[/font] na przystankach z rolą "Zajezdnia" – każdy przystanek zajezdni potrzebuje tej roli, sama nazwa nie wystarczy.\n\nJeśli pociąg trafi na przystanek z nazwą zajezdni, ale bez roli, sam przejedzie do prawdziwej zajezdni.\n\nMin./maks. długość pociągu w zajezdni: niepasujący pociąg przejeżdża do pasującej zajezdni o tej samej nazwie.
utl-fuel=Jeśli lokomotywa ma paliwo poniżej progu tankowania (ustawienie mapy, domyślnie 40 %), pociąg najpierw zajeżdża na pasującą [font=default-bold]stację paliw[/font], a potem jedzie dalej do zlecenia.\n\nPodajniki na stacji paliw napełniają lokomotywy. Pociąg czeka, aż wszystkie lokomotywy będą pełne (maks. 30 s).\n\nBez żadnej stacji paliw w sieci pociągi z małą ilością paliwa jeżdżą normalnie – wtedy tankujesz sam (np. przerwaniem).
utl-cleanup=Pociąg z resztkami ładunku jedzie na pasującą stację [font=default-bold]oczyszczania[/font], jest tam opróżniany (podajnikami lub pompami) i potem bierze następne zlecenie.\n\nCo przyjmuje stacja oczyszczania, ustawia się na karcie "Wartości": [virtual-signal=utl-cleanup-all-items] wszystkie przedmioty, [virtual-signal=utl-cleanup-all-fluids] wszystkie płyny lub pojedyncze towary. Towary wpisane pojedynczo idą pierwsze; jeśli jedna stacja nie wystarczy, pociąg odwiedza kilka po kolei.\n\nBez pasującego oczyszczania pociąg czeka w zajezdni i pojawia się alarm.
utl-cleanup-return=To, co trafi do oczyszczania, nie musi tam zostać. Zaznacz [font=default-bold]Ponownie oferuj zawartość[/font] na stacji oczyszczania, a zaoferuje ona zawartość swoich skrzyń sieci – jak dostawca. Skrzynie muszą być w tym celu podłączone do przystanku.\n\nRanga obok decyduje, kiedy oczyszczanie jest używane: [font=default-bold]Tylko jako rezerwa[/font] (najpierw zwykli dostawcy), [font=default-bold]Jak każdy dostawca[/font] lub [font=default-bold]Opróżniaj najpierw[/font].\n\nTowary pozostałe u odbiorcy nie są mu przez 5 minut przywożone z powrotem z żadnego oczyszczania – inaczej jeździłyby tam i z powrotem. Można wyłączyć dla całej mapy: ustawienie mapy „Oczyszczanie może ponownie oferować zawartość”.\n\n[font=default-bold]Zbudowane jak w scenie:[/font] podajnik rozładunkowy (wagon → skrzynia), podajnik przekładający (skrzynia → skrzynia), podajnik załadunkowy (skrzynia → wagon). Wyjście zleceń je przełącza: załadunkowy przy [virtual-signal=utl-loading] > 0, rozładunkowy przy [virtual-signal=utl-loading] = 0 – resztki ładunku nie mają zlecenia i tak są rozładowywane. Podajnik załadunkowy ma włączone „Ustaw filtry” i bierze tylko zamówione towary: pociąg przywozi żelazo i miedź, odbierana jest tylko miedź.
utl-storage=[font=default-bold]Magazyn[/font] przyjmuje i wydaje. Na każdy towar ustawiasz minimalny i maksymalny zapas:\n• poniżej minimum zamawia – do maksimum,\n• to, co ponad minimum, oferuje jak zwykły dostawca – jeśli magazyn jest bliżej odbiorcy, dostarcza on.\n\nW ten sposób magazyn trzyma zapas blisko odbiorców. Dwa magazyny nigdy nie przerzucają towarów tam i z powrotem: oferowane jest tylko to, co ponad minimum, a zamawiane tylko poniżej minimum. Z „Przyjmuj resztki ładunku” przyjmuje też resztki ładunku.\n\nMagazyn potrzebuje podajników w obu kierunkach: rozładunkowe wkładają towary do skrzyń, przekładające przenoszą je do skrzyń załadunkowych, załadunkowe ładują je do pociągu. Wyjście zleceń je przełącza – ładuj, dopóki [virtual-signal=utl-loading] > 0, w przeciwnym razie rozładowuj. Odblokowane przez „UTL: Magazyn”, wyłączane ustawieniem mapy „Zezwalaj na stacje magazynowe”.
utl-copy=[font=default-bold]Shift + prawy klik[/font] na stacji kopiuje jej ustawienia UTL, [font=default-bold]Shift + lewy klik[/font] na innej je wkleja.\n\n[item=blueprint] Plany, kopiowanie/wklejanie (Ctrl + C / Ctrl + V) i klonowanie zachowują ustawienia.
utl-manager=[font=default-bold]Menedżer UTL[/font] pokazuje całą twoją sieć kolejową na jeden rzut oka. Otwórz go przyciskiem z lokomotywą na pasku skrótów lub [font=default-bold]Ctrl + Shift + U[/font] (albo [font=default-bold]Ctrl + Alt + U[/font]). W prawym górnym rogu: lupa = wyszukiwanie (filtr po nazwie), strzałki = odśwież teraz.\n\nKarty:\n• [font=default-bold]Zajezdnie[/font] – po lewej każda zajezdnia z wolnymi/wszystkimi pociągami. Kliknij zajezdnię, aby po prawej zobaczyć jej pociągi ze składem, stanem i ładunkiem; przycisk pociągu śledzi pociąg na mapie.\n• [font=default-bold]Stacje[/font] – rola, oferta (zielony), zapotrzebowanie (czerwony), w drodze (niebieski = nadjeżdża, żółty = odbierane) i liczba pociągów. Sieć stoi za nazwą, z połączeniami, np. [Żelazo ↔ Miedź]. Kliknij nazwę, aby zobaczyć stację na mapie.\n• [font=default-bold]Sieci[/font] – każda sieć ze swoimi połączeniami, patrz "Menedżer: Sieci".\n• [font=default-bold]Inwentarz[/font] – wszystko oferowane, zamawiane i w ruchu, patrz "Menedżer: Inwentarz".\n• [font=default-bold]Historia[/font] – ostatnie 100 dostaw z czasem trwania; anulowane na czerwono z powodem.\n• [font=default-bold]Alarmy[/font] – brak wolnego lub pasującego pociągu, resztki ładunku, braki ładunku, brak drogi, nieudane tankowanie. Każdą grupę można wyłączyć w ustawieniach gracza.\n\nW scenie pociąg z resztkami ładunku przyjeżdża do zajezdni, a oczyszczania nie ma – tak wygląda alarm na karcie \"Alarmy\". Przycisk obok pokazuje miejsce na mapie.\n\nKilka planet: obok lupy wybierasz, która planeta jest pokazywana – \"Automatycznie\" podąża za planetą, na której jesteś lub którą oglądasz; \"Wszystkie planety\" pokazuje wszystko. Zajezdnie o tej samej nazwie na różnych planetach pozostają oddzielne.\n\nNa karcie "Ustawienia" zmieniasz wartości załadunku (bezczynność przy załadunku/rozładunku, ładunek i/lub bezczynność) bez menu głównego – dla drużyny, jeśli są drużyny (zmieniają liderzy), w przeciwnym razie dla wszystkich (tylko administratorzy).
utl-network-links=Możesz [font=default-bold]tworzyć[/font] dowolnie wiele sieci. Ograniczone jest tylko [font=default-bold]łączenie[/font] – badanie "UTL: Połączenia sieci I–III" pozwala na 1, 2 lub 3 partnerów na sieć.\n\nW scenie pociąg ma tylko sieć "Eisen" (żelazo), dostawca i odbiorca są w sieci "Kupfer" (miedź) – na początku nic się nie rusza. W oknie stacji zajezdni, ramka [font=default-bold]"Połączona z"[/font]:\n1. Wybierz "Kupfer" z listy – od razu staje się partnerem, a pociąg z żelazem odjeżdża.\n2. Kliknij [font=default-bold]Nowa[/font], wpisz nazwę ("Kohle", węgiel), ✓ – sieć zostaje utworzona i od razu połączona.\nKażdy partner jest potem pokazywany jako przycisk; kliknięcie usuwa połączenie. Licznik (2 / 2) pokazuje zajętych i dozwolonych partnerów, podpowiedź podaje badanie na więcej.\n\nJak działa połączenie – [font=default-bold]gwiazda[/font]:\n• Centrum i partner pomagają sobie pociągami, zajezdniami, stacjami paliw i oczyszczania.\n• Partnerzy [font=default-bold]nie[/font] pomagają sobie nawzajem: pociąg z miedzią nigdy nie jeździ dla "Kohle".\n• Partner nie należy do żadnej innej sieci i nie dostaje własnych partnerów.\n• Połączenie dotyczy całej sieci na tej powierzchni, nie tylko stacji. Na Vulcanusie budujesz osobne gwiazdy.
utl-manager-networks=Karta [font=default-bold]Sieci[/font] w menedżerze: po lewej każda sieć (z powierzchnią, gdy jest kilka planet) z liczbą stacji, wolnych pociągów i trwających dostaw.\n\nKliknij sieć, aby po prawej zobaczyć:\n• na górze ramkę [font=default-bold]"Połączona z"[/font] – wybierz partnera z listy lub wpisz nową nazwę i ✓; kliknięcie przycisku partnera usuwa połączenie. Działa tak samo jak w oknie stacji.\n• poniżej każdą stację gwiazdy z rolą i siecią; stacje partnerów są szare.\n\nJeśli wybrana sieć sama jest partnerem, przycisk pokazuje jej centrum; kliknięcie opuszcza gwiazdę.\n\nKarta [font=default-bold]Stacje[/font] pokazuje połączenie za nazwą: [Żelazo ↔ Miedź] dla centrum, [Miedź → Żelazo] dla partnera.
utl-manager-inventory=Karta [font=default-bold]Inwentarz[/font] w menedżerze pokazuje wszystko w sieci jako ikony po lewej: [font=default-bold]oferta[/font] (zielony), [font=default-bold]zapotrzebowanie[/font] (czerwony) i [font=default-bold]w drodze[/font] (niebieski).\n\n[font=default-bold]Kliknij towar[/font] – po prawej pojawią się:\n• sumy oferty, zapotrzebowania i w drodze,\n• każda stacja, która go ma lub potrzebuje (kliknij nazwę, aby zobaczyć ją na mapie),\n• każdy pociąg, który go teraz wiezie, ze startem i celem.\n\nKliknij ten sam towar ponownie, aby zamknąć widok. Karta nie odświeża się sama, żeby lista nie skakała podczas czytania – użyj strzałek u góry.
utl-news=Najważniejsze w [font=default-bold]0.0.27[/font]:\n\n• UTL Manager: nowy filtr towaru na pasku tytułu – wybierz przedmiot lub płyn, a zakładki pokażą tylko to, co z nim związane. Prawy przycisk czyści filtr.\n• Wagony-cysterny wyższej jakości liczą się teraz z prawdziwą pojemnością (legendarna cysterna mieści 2,5 raza więcej) – wcześniej UTL planował tylko 50k na wagon.\n\nNowe w 0.0.26: okno stacji w trybie „swobodnym” zawsze można znowu zadokować.\n\nNowe w 0.0.25: nowe języki – rosyjski, chiński (uproszczony), francuski, hiszpański, polski i portugalski brazylijski.\n\nWszystkie zmiany: portal modów, karta „Changelog”.

