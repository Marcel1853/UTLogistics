[entity-description]
utl-station-settings=Niewidoczny magazyn ustawień stacji (zapotrzebowania, rola, wartości), aby działały parametry planów. UTL buduje go sam – nie potrzeba robotów ani przedmiotów.
utl-port=Port Cargo Ships z wbudowaną logiką UTL – jak przystanek UTL, tylko dla statków. Podłączaj skrzynie/zbiorniki bezpośrednio do niego: wartości dodatnie = oferta, ujemne = zapotrzebowanie.
utl-network-combinator=Wysyła stan sieci UTL jako sygnały: zapas, zapas magazynów, zapotrzebowanie, braki lub liczbę pociągów. Sieć i tryb ustawiasz w jego oknie. Co zrobisz z sygnałami (lampa, wyświetlacz, lądowisko towarowe …), podłączasz sam.
utl-train-stop=Przystanek z wbudowaną logiką UTL. Podłączaj skrzynie/zbiorniki bezpośrednio do przystanku: wartości dodatnie = oferta, ujemne = zapotrzebowanie. Można go stawiać bezpośrednio na zwykłych przystankach.
utl-station-combinator=Należy do zwykłego przystanku: podłącz jego WYJŚCIE (czerwonym lub zielonym) do przystanku. Do WEJŚCIA podłącz skrzynie/zbiorniki lub zapotrzebowanie: wartości dodatnie = oferta, ujemne = zapotrzebowanie. Role i progi ustawia się w oknie.

