[mod-setting-description]
utl-status-color-incoming=Kolor tego stanu na panelu wyświetlacza stacji UTL (podłączonym przewodem) i na lampach przystanku.
utl-status-color-stopped=Kolor tego stanu na panelu wyświetlacza stacji UTL (podłączonym przewodem) i na lampach przystanku.
utl-status-color-depot=Kolor tego stanu na panelu wyświetlacza stacji UTL (podłączonym przewodem) i na lampach przystanku.
utl-status-color-idle=Kolor tego stanu na panelu wyświetlacza stacji UTL (podłączonym przewodem) i na lampach przystanku.
utl-status-color-off=Kolor tego stanu na panelu wyświetlacza stacji UTL (podłączonym przewodem) i na lampach przystanku.
utl-leader-inactive-days=Lider drużyny, który nie był online przez tyle dni (czas gry, gdy serwer działa), traci prawa lidera. Jeśli nie zostanie żaden lider, przejmuje je najdłużej aktywny członek. 0 = nigdy.
utl-timeout-mode="Ładunek lub bezczynność" (domyślnie): pociąg odjeżdża, gdy jest pełny lub pusty albo nic się nie zmieniło przez ten czas – z tym, co ma, nawet gdy skrzynia jest pusta. "Ładunek i bezczynność": odjeżdża tylko, gdy jest pełny lub pusty i nic się nie zmieniło przez ten czas. Każda drużyna może to ustawić w menedżerze UTL.
utl-top-up=Jeśli zapotrzebowanie rośnie, gdy pociąg jest jeszcze w drodze do dostawcy lub tam ładuje, ilość jest dodawana do bieżącej listy załadunku zamiast rozpoczynać drugi kurs. Wymaga, by ten sam dostawca miał towar, a pociąg miejsce. Oszczędza pociągi, ale pociąg dłużej stoi u dostawcy. Domyślnie: wył.
utl-multi-pickup=Jeśli jeden dostawca nie ma dość na zapotrzebowanie, pociąg zabiera resztę od drugiego dostawcy w tej samej sieci – jeden kurs z dwoma postojami załadunku zamiast dwóch kursów. Tylko na tej samej powierzchni, najwyżej dwóch dostawców. Domyślnie: wył.
utl-min-load-percent=Pociąg odjeżdża tylko, jeśli zostanie wypełnione co najmniej tyle procent jego ładowni – liczą się wszystkie towary, które ten sam dostawca przekazuje temu odbiorcy. Koniec kursów dla drobnych resztek (np. gdy odbiorcy brakuje tylko 1000); zapotrzebowanie czeka, aż uzbiera się dość. 0 = wył. Domyślnie: 0.
utl-multi-pickup-detour=Drugi dostawca jest odwiedzany tylko, jeśli objazd wynosi najwyżej tyle procent bezpośredniej odległości od pierwszego dostawcy do odbiorcy (w linii prostej). Jeśli jest dalej, jedzie drugi pociąg. 0 = dowolny objazd dozwolony. Domyślnie: 50.
utl-cleanup-offer=Pozwala stacjom oczyszczania ponownie oferować swoją zawartość sieci – włączane na każdej stacji polem „Ponownie oferuj zawartość” (tam domyślnie wył.). Wył. tutaj = wyłączone na całej mapie.
utl-storage=Pozwala na typ stacji „Magazyn” (minimalny/maksymalny zapas na towar). Wył. = magazyny niczego nie oferują ani nie zamawiają, na całej mapie.
utl-load-timeout=Sekundy bez żadnej zmiany ładunku u dostawcy (0 = bez warunku). Przy "Ładunek lub bezczynność" (domyślnie) odjeżdża też przed pełnym załadunkiem, jeśli przez ten czas nic nie doszło – z tym, co ma; przy "Ładunek i bezczynność" odjeżdża tylko, gdy wszystko załadowano i nic się nie zmieniło przez ten czas. Jeśli nic nie załadował, dostawa zostaje anulowana. Domyślne dla wszystkich drużyn; każda drużyna może ustawić własne wartości w menedżerze UTL (karta "Ustawienia").
utl-unload-timeout=Sekundy bez żadnej zmiany ładunku u odbiorcy (0 = bez warunku). Przy "Ładunek i bezczynność" pociąg odjeżdża, gdy jest pusty i nic się nie zmieniło przez ten czas; przy "Ładunek lub bezczynność" także wcześniej, resztki jadą na stację oczyszczania. Domyślne dla wszystkich drużyn; każda drużyna może ustawić własne wartości w menedżerze UTL.
utl-item-group=Automatycznie: tory, tory estakadowe, sygnały, przystanki, lokomotywy i wagony – także z innych modów – dostają kartę „Pociągi”. Jeśli inny mod ma już własną kartę pociągów, przedmioty UTL trafiają tam, a UTL niczego nie przestawia. Zawsze UTL: UTL przenosi wszystkie przedmioty kolejowe do swojej karty. Wył.: nic nie jest przestawiane.
utl-signal-style=Klasyczny: pojazdy i skrzynie z gry z symbolem w rogu. Płaski: własne proste symbole w stylu sygnałów vanilla (jasnoszare z ciemnym konturem). Wymaga ponownego uruchomienia.
utl-station-lamps=Oprócz panelu wyświetlacza: dwie małe lampy na górze przystanków UTL świecą kolorem stanu (niebieski = pociąg w drodze, zielony = pociąg stoi, turkusowy = pociąg czeka w zajezdni, żółty = nic się nie dzieje, czerwony = wyłączony; kolory w ustawieniach mapy). Są małe – głównym wskazaniem jest panel wyświetlacza podłączony przewodem do stacji. Wymaga ponownego uruchomienia.
utl-heartbeat-interval=Ile tików między krokami pracy UTL. Każdy krok wykonuje tylko małą, stałą porcję pracy. Więcej = mniej procesora, ale wolniejsze reakcje.
utl-debug-log=Zapisuje dodatkowe komunikaty w factorio-current.log. Włączaj tylko przy szukaniu błędów.
utl-station-batch-size=Ile stacji jest odczytywanych na takt. Wszystkie stacje są obsługiwane po kolei.
utl-max-deliveries-per-cycle=Ile pociągów dyspozytor wysyła najwyżej na cykl (co 3 takty). Mniej = równiejsze obciążenie procesora.
utl-research-required=Wł.: kontrola załadunku (filtry wagonów, wyjście zleceń), stacje magazynowe i połączenia sieci trzeba najpierw zbadać. Wył.: wszystko dostępne od razu, do 3 partnerów na sieć.
utl-station-output=Obok każdej stacji stoi małe wyjście z bieżącymi zleceniami jako sygnałami: dodatnie u dostawcy (tyle trzeba załadować), ujemne u odbiorcy (tyle nadjeżdża). Używaj go do podajników z filtrem, pomp i wyświetlaczy. Nie podłączaj go do wejścia stacji – to wróciłoby do zapasu.
utl-wagon-filters=Podczas trwającej dostawy UTL ustawia gniazda wagonów towarowych na towary tego zlecenia i blokuje resztę. Dostawca może wtedy trzymać kilka towarów w jednej skrzyni, a zwykłe podajniki ładują tylko to, co zamówiono. Wagony, w których sam ustawiłeś filtry, pozostają nietknięte. Nie dotyczy płynów.
utl-chaining=Pociąg, który właśnie się rozładował lub opuszcza stację paliw/oczyszczania, od razu bierze pasującą dostawę (preferując pobliskiego dostawcę), zamiast najpierw wracać do zajezdni. Oszczędza puste kursy.
utl-fuel-threshold=Jeśli któraś lokomotywa pociągu ma paliwo poniżej tego poziomu, pociąg zajeżdża na pasującą stację paliw UTL przed następnym zleceniem lub z zajezdni (ta sama sieć, długość pociągu w zakresie stacji). 0 = wył.
utl-fuel-minimum=Poniżej tego poziomu paliwa (najniższa lokomotywa) pociąg nie przyjmuje już zleceń, chyba że po drodze może zatankować na osiągalnej, wolnej stacji paliw UTL. Zostaje w zajezdni, pojawia się alarm "brak paliwa", a wyjście zajezdni to zgłasza. Między tą wartością a "Tankuj poniżej" pociąg może jechać bez tankowania, jeśli żadna stacja nie jest wolna. 0 = wył.
utl-alert-no-train-minutes=Alarm „brak odpowiedniego pociągu” pojawia się dopiero, gdy zapotrzebowanie pozostaje nieobsłużone tak długo. Dopóki pociąg z towarem jedzie do stacji, liczy się jako obsłużone. 0 = natychmiast.
utl-stuck-minutes=Jeśli pociąg z dostawą stoi tak długo bez postępu – czeka na sygnale, nie znajduje drogi albo cel jest pełny –, pojawia się alarm „pociąg utknął”, a menedżer UTL pokazuje to przy pociągu. UTL niczego nie anuluje. Załadunek i rozładunek się nie liczą (od tego są limity czasu). 0 = wył. Domyślnie: 5.
utl-alerts-no-train=Alarm, gdy stacja czegoś potrzebuje i dostawca to ma, ale nie ma wolnego lub pasującego pociągu (sieć, długość pociągu).
utl-alerts-cargo=Alarm, gdy pociąg czeka w zajezdni z resztkami ładunku, nie opróżnił się u odbiorcy lub załadował u dostawcy mniej, niż zamówiono.
utl-alerts-trains=Alarm, gdy pociąg z dostawą nie znajduje drogi, nie znaleziono wolnej zajezdni, tankowanie się nie udało lub dostawa została anulowana.
utl-default-provide-threshold=Wartość początkowa dla nowych stacji.
utl-default-request-threshold=Wartość początkowa dla nowych stacji.
utl-news=Po aktualizacji UTL krótka linijka na czacie o nowościach – z odnośnikiem do strony „Nowości w UTL” w poradach i wskazówkach.
utl-stop-style=Vanilla: grafika zwykłego przystanku. UTL: własny model z kratownicowym masztem, szafą sterowniczą i kolorowymi kablami (próba), przy torach elementy zwykłego przystanku. Kolor stacji nadal można dowolnie wybrać. Wymaga ponownego uruchomienia.

