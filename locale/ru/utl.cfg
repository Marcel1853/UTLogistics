[tips-and-tricks-item-description]
utl-network-combinator=[item=utl-network-combinator] [font=default-bold]Сетевой комбинатор[/font] выдаёт состояние сети UTL сигналами. В его окне вы выбираете сеть (по желанию со связанными сетями) и что он выдаёт:\n• [font=default-bold]Запас[/font] – по каждому товару, что предлагают поставщики сети,\n• [font=default-bold]Запас складов[/font] – что хранится на станциях-складах,\n• [font=default-bold]Запрос[/font] – что запрашивают получатели,\n• [font=default-bold]Нехватка[/font] – что нужно получателям и чего никто не предлагает,\n• [font=default-bold]Поезда[/font] – всего, свободных, в пути, доставок, с малым запасом топлива, без пути; плюс помогают ли здесь поезда из связанных сетей или свои поезда работают в другом месте.\n\nВ сцене получатель хочет железо и медь. Поезд привозит железо, медь никто не предлагает – поэтому в режиме "Нехватка" комбинатор выдаёт только медь, и лампа горит.\n\nЧто делать с сигналами, решает ваша схема: лампа, как в сцене, панель – или в Space Age [font=default-bold]нехватка[/font] на посадочную площадку для грузов ("задать запросы"), чтобы она привозила недостающее с орбиты. Открывается исследованием "UTL: Сетевой комбинатор".
utl-overview=UTL отправляет поезда автоматически: из [font=default-bold]депо[/font] к [font=default-bold]поставщику[/font], у которого есть то, что нужно [font=default-bold]получателю[/font], а затем к получателю.\n\nБыстрый старт:\n1. Депо: [item=utl-train-stop] с ролью "Депо", поезд, у которого в расписании только депо (пустой, автоматический).\n2. Поставщик: остановка с ролью "Поставщик", сундуки подключены к остановке проводом.\n3. Получатель: роль "Получатель", заполните ячейку запроса в окне.\n\nВаше расписание сохраняется: UTL только вставляет временные остановки, группы поездов и прерывания остаются. После разгрузки поезд сразу берёт следующий заказ поблизости.
utl-train-stop=[item=utl-train-stop] – это остановка и станция UTL в одном. Подключайте сундуки и цистерны (красным или зелёным) прямо к остановке: положительные значения предлагаются, отрицательные запрашиваются. Роль, сеть и значения задаются на панели UTL слева от окна остановки.\n\nЕё можно строить прямо поверх обычной остановки.
utl-combinator=Для существующих станций: поставьте [item=utl-station-combinator] рядом с обычной остановкой.\n\nПодключите [font=default-bold]выход[/font] комбинатора (красным или зелёным) к остановке – так UTL узнаёт, какая остановка к нему относится.\n[font=default-bold]Вход[/font]: сундуки/цистерны.\n\nБез провода на выходе окно показывает "Нет остановки". Комбинатору не нужно питание.
utl-roles=Каждая станция получает роль в своём окне:\n\n[font=default-bold]Поставщик[/font] – товары с положительным значением забираются.\n[font=default-bold]Получатель[/font] – товары с отрицательным значением или из ячеек запросов привозятся.\nПоставщик + получатель – буфер.\n[font=default-bold]Депо[/font] – здесь ждут свободные поезда.\n[font=default-bold]Станция заправки[/font] – здесь поезда заправляются.\n[font=default-bold]Очистка[/font] – здесь опустошаются поезда с остатком груза.\n[font=default-bold]Склад[/font] – принимает и отдаёт, с минимальным и максимальным запасом по товару (для опытных, исследование "UTL: Склад").
utl-requests=Количество в ячейке запроса – это [font=default-bold]целевой запас[/font], а не заказ: UTL привозит "цель − на складе − уже в пути".\n\nЧтобы ехало несколько поездов сразу, задайте больший целевой запас. Если у поставщика есть ещё товары, нужные тому же получателю, поезд грузит и их, пока есть место. Жидкости едут в вагонах-цистернах (насосы у вагона, резервуар подключён к станции).\n\nНесколько товаров у поставщика: хватит одного смешанного сундука – во время доставки UTL фильтрует ячейки вагона на заказанные товары. С выходом заказов можно ещё и переключать манипуляторы и насосы по текущему заказу (исследование \"UTL: Управление погрузкой\").\n\n"В пути" в окне станции показывает, что сейчас привозится или забирается.
utl-values=На вкладке "Значения":\n• [font=default-bold]Мин./макс. длина поезда[/font] – только подходящие поезда (локомотивы считаются, 0 = любые).\n• [font=default-bold]Макс. поездов[/font] – не больше стольких одновременно (ограничение поездов на остановке тоже действует).\n• [font=default-bold]Пороги[/font] – товары предлагаются или привозятся только начиная с этого количества (также в стопках).\n• [font=default-bold]Приоритет[/font] – выше идёт первым.\n• [font=default-bold]Заблокированные ячейки[/font] на вагон.\n\nВ любом числовом поле можно считать, например "4000*2". ⟲ сбрасывает значение.\n\n[font=default-bold]Сеть[/font]: разделяет несколько транспортных сетей на одной карте. Вместе работают только станции с точно одинаковым именем, во всех ролях: поезд из депо "Руда" обслуживает только рудные станции, заправляется только на рудных заправках и опустошается только на рудных очистках.\n\nПусто = сеть "default". Поэтому каждой сети нужны своё депо, своя заправка и своя очистка. Депо не в той сети вызывает тревогу "нет свободного поезда в сети …", хотя поезда ждут.\n\nС исследованием "UTL: Связи сетей" сети можно связать, чтобы они помогали друг другу, – см. пункт "Сети".
utl-networks=[font=default-bold]Сеть[/font] разделяет несколько транспортных систем на одной карте – не разделяя рельсы. В сцене оба поезда ездят [font=default-bold]по одному кольцу[/font]: "Erze" (руда) и "Platten" (плиты), у каждой сети своё депо, поставщик и получатель.\n\nВместе работают только станции с [font=default-bold]точно одинаковым именем[/font]. Поэтому рудный поезд проезжает мимо станции плит.\n\nЭто касается всех ролей: поезд заправляется только на заправке своей сети и опустошается только на очистке своей сети. Поэтому каждой сети нужны своё депо, своя заправка и своя очистка – если только вы не свяжете сети.\n\nПусто = сеть "default". Оставьте поле везде пустым, если вам нужна одна большая сеть.\n\nСети также можно [font=default-bold]связать[/font], чтобы они помогали друг другу, – см. \"Связывание сетей\".
utl-depots=Свободные поезда ждут [font=default-bold]пустыми[/font] на остановках с ролью "Депо" – каждой остановке депо нужна эта роль, одного имени мало.\n\nЕсли поезд оказался на остановке с именем депо, но без роли, он сам переедет в настоящее депо.\n\nМин./макс. длина поезда у депо: неподходящий поезд переезжает в подходящее депо с тем же именем.
utl-fuel=Если у локомотива топлива ниже порога заправки (настройка карты, по умолчанию 40 %), поезд сначала заезжает на подходящую [font=default-bold]станцию заправки[/font], а потом едет по заказу.\n\nМанипуляторы на станции заправки заполняют локомотивы. Поезд ждёт, пока все локомотивы не заполнятся (макс. 30 с).\n\nЕсли в сети нет ни одной станции заправки, поезда с малым запасом топлива ездят как обычно – тогда заправляете вы сами (например, прерыванием).
utl-cleanup=Поезд с остатком груза едет на подходящую станцию [font=default-bold]очистки[/font], опустошается там (манипуляторами или насосами) и затем берёт следующий заказ.\n\nЧто принимает станция очистки, задаётся на вкладке "Значения": [virtual-signal=utl-cleanup-all-items] все предметы, [virtual-signal=utl-cleanup-all-fluids] все жидкости или отдельные товары. Товары, указанные по одному, идут первыми; если одной станции мало, поезд посещает несколько подряд.\n\nБез подходящей очистки поезд ждёт в депо, и появляется тревога.
utl-cleanup-return=То, что попало на очистку, не обязано там оставаться. Отметьте [font=default-bold]Снова предлагать содержимое[/font] у станции очистки, и она предлагает содержимое сундуков сети – как поставщик. Для этого сундуки должны быть подключены к остановке.\n\nРанг рядом решает, когда используется очистка: [font=default-bold]Только как резерв[/font] (сначала обычные поставщики), [font=default-bold]Как любой поставщик[/font] или [font=default-bold]Опустошать первой[/font].\n\nТовары, оставшиеся у получателя, 5 минут не привозятся ему обратно ни с одной очистки – иначе они ездили бы туда-сюда. Можно отключить для всей карты: настройка карты «Очистка может снова предлагать содержимое».\n\n[font=default-bold]Собрано как в сцене:[/font] разгрузочный манипулятор (вагон → сундук), перекладывающий манипулятор (сундук → сундук), погрузочный манипулятор (сундук → вагон). Выход заказов переключает их: погрузочный при [virtual-signal=utl-loading] > 0, разгрузочный при [virtual-signal=utl-loading] = 0 – у остатка груза нет заказа, и он так выгружается. У погрузочного манипулятора включено «Задать фильтры», и он берёт только заказанные товары: поезд привозит железо и медь, забирается только медь.
utl-storage=[font=default-bold]Склад[/font] принимает и отдаёт. По каждому товару вы задаёте минимальный и максимальный запас:\n• ниже минимума он запрашивает – до максимума,\n• всё, что выше минимума, он предлагает как обычный поставщик – если склад ближе к получателю, привозит он.\n\nТак склад держит запас рядом с потребителями. Два склада никогда не гоняют товары туда-сюда: предлагается только то, что выше минимума, и запрашивается только ниже минимума. С «Принимать остаток груза» он также берёт остатки груза.\n\nСкладу нужны манипуляторы в обе стороны: разгрузочные кладут товары в сундуки, перекладывающие переносят их в погрузочные сундуки, погрузочные кладут их в поезд. Выход заказов переключает их – грузить, пока [virtual-signal=utl-loading] > 0, иначе разгружать. Открывается исследованием «UTL: Склад», отключается настройкой карты «Разрешить станции-склады».
utl-copy=[font=default-bold]Shift + правый клик[/font] по станции копирует её настройки UTL, [font=default-bold]Shift + левый клик[/font] по другой вставляет их.\n\n[item=blueprint] Чертежи, копирование/вставка (Ctrl + C / Ctrl + V) и клонирование сохраняют настройки.
utl-manager=[font=default-bold]Менеджер UTL[/font] показывает всю вашу железнодорожную сеть с одного взгляда. Откройте его кнопкой с локомотивом на панели быстрого доступа или [font=default-bold]Ctrl + Shift + U[/font] (или [font=default-bold]Ctrl + Alt + U[/font]). Вверху справа: лупа = поиск (фильтр по имени), стрелки = обновить сейчас.\n\nВкладки:\n• [font=default-bold]Депо[/font] – слева каждое депо со свободными/всего поездами. Щёлкните депо, чтобы справа увидеть его поезда с составом, состоянием и грузом; кнопка поезда следует за поездом на карте.\n• [font=default-bold]Станции[/font] – роль, предложение (зелёный), запрос (красный), в пути (синий = прибывает, жёлтый = забирается) и число поездов. Сеть стоит после имени, со связями, например [Железо ↔ Медь]. Щёлкните имя, чтобы увидеть станцию на карте.\n• [font=default-bold]Сети[/font] – каждая сеть со своими связями, см. "Менеджер: Сети".\n• [font=default-bold]Инвентарь[/font] – всё, что предлагается, запрашивается и в пути, см. "Менеджер: Инвентарь".\n• [font=default-bold]История[/font] – последние 100 доставок с длительностью; отменённые красным с причиной.\n• [font=default-bold]Тревоги[/font] – нет свободного или подходящего поезда, остаток груза, недостача, нет пути, заправка не удалась. Каждую группу можно выключить в настройках игрока.\n\nВ сцене поезд с остатком груза приезжает в депо, а очистки нет – так выглядит тревога на вкладке \"Тревоги\". Кнопка рядом показывает место на карте.\n\nНесколько планет: рядом с лупой выбирается, какая планета показывается, – \"Автоматически\" следует за планетой, на которой вы находитесь или на которую смотрите; \"Все планеты\" показывает всё. Депо с одинаковым именем на разных планетах остаются раздельными.\n\nНа вкладке "Настройки" вы меняете значения погрузки (бездействие при погрузке/разгрузке, груз и/или бездействие) без главного меню – по командам, если команды есть (меняют лидеры), иначе для всех (только администраторы).
utl-network-links=Сетей можно [font=default-bold]создавать[/font] сколько угодно. Ограничено только [font=default-bold]связывание[/font] – исследование "UTL: Связи сетей I–III" разрешает 1, 2 или 3 партнёра на сеть.\n\nВ сцене поезд есть только у сети "Eisen" (железо), поставщик и получатель – в сети "Kupfer" (медь), – сначала ничего не движется. В окне станции депо, блок [font=default-bold]"Связана с"[/font]:\n1. Выберите "Kupfer" из списка – она сразу становится партнёром, и железный поезд уезжает.\n2. Нажмите [font=default-bold]Новая[/font], введите имя ("Kohle", уголь), ✓ – сеть создаётся и сразу связывается.\nКаждый партнёр затем показывается кнопкой; клик убирает связь. Счётчик (2 / 2) показывает занятых и разрешённых партнёров, подсказка называет исследование для большего числа.\n\nКак работает связь – [font=default-bold]звезда[/font]:\n• Центр и партнёр помогают друг другу поездами, депо, станциями заправки и очистки.\n• Партнёры [font=default-bold]не[/font] помогают друг другу: медный поезд никогда не едет для "Kohle".\n• Партнёр не входит ни в какую другую сеть и не получает своих партнёров.\n• Связь действует для всей сети на этой поверхности, а не только для станции. На Вулкане вы строите отдельные звёзды.
utl-manager-networks=Вкладка [font=default-bold]Сети[/font] в менеджере: слева каждая сеть (с поверхностью, если планет несколько) с числом станций, свободных поездов и текущих доставок.\n\nЩёлкните сеть, чтобы справа увидеть:\n• вверху блок [font=default-bold]"Связана с"[/font] – выберите партнёра из списка или введите новое имя и ✓; клик по кнопке партнёра убирает связь. Работает так же, как в окне станции.\n• ниже каждую станцию звезды с ролью и сетью; станции партнёров серые.\n\nЕсли выбранная сеть сама является партнёром, кнопка показывает её центр; клик выходит из звезды.\n\nВкладка [font=default-bold]Станции[/font] показывает связь после имени: [Железо ↔ Медь] для центра, [Медь → Железо] для партнёра.
utl-manager-inventory=Вкладка [font=default-bold]Инвентарь[/font] в менеджере показывает всё в сети значками слева: [font=default-bold]предложение[/font] (зелёный), [font=default-bold]запрос[/font] (красный) и [font=default-bold]в пути[/font] (синий).\n\n[font=default-bold]Щёлкните товар[/font] – справа появятся:\n• итоги по предложению, запросу и в пути,\n• каждая станция, у которой он есть или которой он нужен (щёлкните имя, чтобы увидеть её на карте),\n• каждый поезд, который сейчас его везёт, с началом и целью.\n\nЩёлкните тот же товар ещё раз, чтобы закрыть вид. Вкладка не обновляется сама, чтобы список не прыгал, пока вы читаете, – используйте стрелки вверху.
utl-news=Самое важное в [font=default-bold]0.0.27[/font]:\n\n• UTL Manager: новый фильтр по товару в заголовке – выберите предмет или жидкость, и вкладки покажут только то, что с ним связано. Правый клик сбрасывает фильтр.\n• Вагоны-цистерны более высокого качества теперь учитываются с реальной вместимостью (легендарная цистерна вмещает в 2,5 раза больше) – раньше UTL планировал только 50k на вагон.\n\nНовое в 0.0.26: окно станции в режиме «свободно» всегда можно снова пристыковать.\n\nНовое в 0.0.25: новые языки – русский, китайский (упрощённый), французский, испанский, польский и бразильский португальский.\n\nВсе изменения: портал модов, вкладка «Changelog».

