[entity-description]
utl-station-settings=Невидимое хранилище настроек станции (запросы, роль, значения), чтобы работали параметры чертежей. UTL строит его сам – роботы и предметы не нужны.
utl-port=Порт Cargo Ships со встроенной логикой UTL – как остановка UTL, только для кораблей. Подключайте сундуки/цистерны прямо к нему: положительные значения = предложение, отрицательные = запрос.
utl-network-combinator=Выдаёт состояние сети UTL сигналами: запас, запас складов, запрос, нехватку или число поездов. Сеть и режим задаются в его окне. Что делать с сигналами (лампа, панель, посадочная площадка для грузов …), вы подключаете сами.
utl-train-stop=Остановка со встроенной логикой UTL. Подключайте сундуки/цистерны прямо к остановке: положительные значения = предложение, отрицательные = запрос. Можно строить прямо поверх обычных остановок.
utl-station-combinator=Относится к обычной остановке: подключите его ВЫХОД (красный или зелёный) к остановке. Ко ВХОДУ подключите сундуки/цистерны или запрос: положительные значения = предложение, отрицательные = запрос. Роли и пороги задаются в окне.

