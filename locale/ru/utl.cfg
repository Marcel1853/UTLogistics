settings-team=Ваша команда
settings-loading=Погрузка и разгрузка
settings-solo-note=Действуют для всех игроков (команд нет). Как администратор вы можете менять их здесь; без изменений действует значение из настроек мода.
settings-solo-locked=Действуют для всех игроков (команд нет). Менять их может только администратор.
settings-map=Карта / сервер (видно только администраторам)
settings-map-note=Действуют для всех команд. Значение, изменённое здесь, действует вместо значения из настроек мода; если снова изменить его в меню настроек мода, побеждает меню.
settings-team-note=Эти значения действуют только для вашей команды; как лидер команды вы можете их менять. Без своего значения действует значение карты ниже.
settings-team-locked=Эти значения действуют только для вашей команды. Менять их могут лидеры команды (и администраторы).
settings-leaders=Лидеры команды:
settings-leaders-tooltip=Лидеры команды могут менять значения команды и назначать других лидеров. Кто первым входит в команду, тот её лидер; когда уходит последний лидер, лидером становится самый давний участник.
settings-leader-add=Сделать участника лидером команды
settings-leader-remove=Забрать права лидера у __1__
settings-leader-last=__1__ – единственный лидер; сначала назначьте другого, тогда права можно передать.
