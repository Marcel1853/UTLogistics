[mod-setting-description]
utl-status-color-incoming=Цвет этого состояния на панели отображения станции UTL (подключённой проводом) и на лампах остановки.
utl-status-color-stopped=Цвет этого состояния на панели отображения станции UTL (подключённой проводом) и на лампах остановки.
utl-status-color-depot=Цвет этого состояния на панели отображения станции UTL (подключённой проводом) и на лампах остановки.
utl-status-color-idle=Цвет этого состояния на панели отображения станции UTL (подключённой проводом) и на лампах остановки.
utl-status-color-off=Цвет этого состояния на панели отображения станции UTL (подключённой проводом) и на лампах остановки.
utl-leader-inactive-days=Лидер команды, не заходивший столько дней (игровое время, пока работает сервер), теряет права лидера. Если лидеров не осталось, их получает самый давний активный участник. 0 = никогда.
utl-timeout-mode="Груз или бездействие" (по умолчанию): поезд уезжает, как только он полон или пуст или ничего не менялось указанное время – с тем, что есть, даже если сундук пуст. "Груз и бездействие": уезжает, только когда он полон или пуст и ничего не менялось указанное время. Каждая команда может настроить это в менеджере UTL.
utl-top-up=Если запрос растёт, пока поезд ещё едет к поставщику или грузится там, количество добавляется к текущему списку погрузки вместо второго рейса. Нужно, чтобы у того же поставщика был товар, а в поезде – место. Экономит поезда, но поезд дольше стоит у поставщика. По умолчанию: выкл.
utl-multi-pickup=Если у одного поставщика не хватает на запрос, поезд забирает остаток у второго поставщика в той же сети – один рейс с двумя погрузками вместо двух рейсов. Только на одной поверхности, не больше двух поставщиков. По умолчанию: выкл.
utl-min-load-percent=Поезд уезжает, только если будет заполнено хотя бы столько процентов его грузового места – считаются все товары, которые тот же поставщик отдаёт этому получателю. Никаких рейсов ради мелких остатков (например, когда получателю не хватает всего 1000); запрос ждёт, пока наберётся достаточно. 0 = выкл. По умолчанию: 0.
utl-multi-pickup-detour=Второй поставщик посещается, только если крюк не больше этого процента от прямого расстояния от первого поставщика до получателя (по прямой). Если дальше – едет второй поезд. 0 = любой крюк разрешён. По умолчанию: 50.
utl-cleanup-offer=Разрешает станциям очистки снова предлагать содержимое сети – включается на каждой станции флажком «Снова предлагать содержимое» (там по умолчанию выкл.). Выкл. здесь = отключено на всей карте.
utl-storage=Разрешает тип станции «Склад» (минимальный/максимальный запас по товару). Выкл. = склады ничего не предлагают и не запрашивают, на всей карте.
utl-load-timeout=Секунды без изменения груза у поставщика (0 = без условия). С "Груз или бездействие" (по умолчанию) поезд уезжает и раньше полной погрузки, если столько времени ничего не добавлялось – с тем, что есть; с "Груз и бездействие" уезжает, только когда всё погружено и столько времени ничего не менялось. Если не погрузилось ничего, доставка отменяется. По умолчанию для всех команд, каждая команда может задать свои значения в менеджере UTL (вкладка "Настройки").
utl-unload-timeout=Секунды без изменения груза у получателя (0 = без условия). С "Груз и бездействие" поезд уезжает, когда пуст и столько времени ничего не менялось; с "Груз или бездействие" – и раньше, остатки идут на станцию очистки. По умолчанию для всех команд, каждая команда может задать свои значения в менеджере UTL.
utl-item-group=Автоматически: рельсы, эстакады, сигналы, остановки, локомотивы и вагоны – в том числе из других модов – получают вкладку «Поезда». Если у другого мода уже есть своя вкладка поездов, предметы UTL идут туда, и UTL ничего не пересортирует. Всегда UTL: UTL переносит все предметы поездов в свою вкладку. Выкл.: ничего не пересортируется.
utl-signal-style=Классический: машины и сундуки из игры со значком в углу. Плоский: собственные простые значки в стиле ванильных сигналов (светло-серые с тёмным контуром). Нужен перезапуск.
utl-station-lamps=В дополнение к панели отображения: две маленькие лампы наверху остановок UTL светятся цветом состояния (синий = поезд в пути, зелёный = поезд стоит, бирюзовый = поезд ждёт в депо, жёлтый = ничего не происходит, красный = выключена; цвета в настройках карты). Они маленькие – основное отображение – это панель, подключённая к станции проводом. Нужен перезапуск.
utl-heartbeat-interval=Сколько тиков между шагами работы UTL. Каждый шаг делает лишь небольшую фиксированную часть работы. Больше = меньше нагрузка на процессор, но медленнее реакция.
utl-debug-log=Пишет дополнительные сообщения в factorio-current.log. Включайте только для поиска ошибок.
utl-station-batch-size=Сколько станций считывается за такт. Все станции обходятся по очереди.
utl-max-deliveries-per-cycle=Сколько поездов диспетчер отправляет максимум за цикл (каждые 3 такта). Меньше = ровнее нагрузка на процессор.
utl-research-required=Вкл.: управление погрузкой (фильтры вагонов, выход заказов), станции-склады и связи сетей нужно сначала исследовать. Выкл.: всё доступно сразу, до 3 партнёров на сеть.
utl-station-output=Рядом с каждой станцией стоит маленький выход, на котором текущие заказы видны как сигналы: положительные у поставщика (столько нужно погрузить), отрицательные у получателя (столько приедет). Используйте его для манипуляторов с фильтром, насосов и панелей. Не подключайте его ко входу станции – это вернулось бы в запас.
utl-wagon-filters=Пока идёт доставка, UTL настраивает ячейки грузовых вагонов на товары этого заказа и блокирует остальные. Тогда поставщик может держать несколько товаров в одном сундуке, и обычные манипуляторы грузят только заказанное. Вагоны, где вы сами задали фильтры, не трогаются. Не действует для жидкостей.
utl-chaining=Поезд, который только что разгрузился или покидает станцию заправки/очистки, сразу берёт подходящую доставку (предпочитая ближнего поставщика), а не возвращается сначала в депо. Экономит пустые рейсы.
utl-fuel-threshold=Если у какого-либо локомотива поезда топливо ниже этого уровня, поезд заезжает на подходящую станцию заправки UTL перед следующим заказом или из депо (та же сеть, длина поезда в пределах станции). 0 = выкл.
utl-fuel-minimum=Ниже этого уровня топлива (самый пустой локомотив) поезд больше не берёт заказы, если только не может заправиться по пути на доступной свободной станции заправки UTL. Он остаётся в депо, появляется тревога "нет топлива", и выход депо сообщает об этом. Между этим значением и "Заправляться ниже" поезд может ехать без заправки, если ни одна станция не свободна. 0 = выкл.
utl-alert-no-train-minutes=Тревога «нет подходящего поезда» появляется, только если запрос не обслуживался столько времени. Пока поезд с товаром едет к станции, запрос считается обслуженным. 0 = сразу.
utl-stuck-minutes=Если поезд доставки столько времени стоит без продвижения – ждёт у сигнала, не находит путь или цель занята, – появляется тревога «поезд застрял», и менеджер UTL показывает это у поезда. UTL ничего не отменяет. Погрузка и разгрузка не считаются (для них есть ограничения по времени). 0 = выкл. По умолчанию: 5.
utl-alerts-no-train=Тревога, когда станции что-то нужно и у поставщика это есть, но нет свободного или подходящего поезда (сеть, длина поезда).
utl-alerts-cargo=Тревога, когда поезд ждёт в депо с остатком груза, не опустел у получателя или погрузил у поставщика меньше заказанного.
utl-alerts-trains=Тревога, когда поезд доставки не находит путь, не найдено свободное депо, заправка не удалась или доставка отменена.
utl-default-provide-threshold=Начальное значение для новых станций.
utl-default-request-threshold=Начальное значение для новых станций.
utl-news=После обновления UTL – короткая строка в чате о новом, со ссылкой на страницу «Новое в UTL» в подсказках.
utl-stop-style=Ванильный: графика обычной остановки. UTL: собственная модель с решётчатой мачтой, шкафом управления и цветными кабелями (проба), у рельсов – детали обычной остановки. Цвет станции по-прежнему можно выбирать свободно. Нужен перезапуск.

