confirm-tooltip=Применить количество (Enter)
cancel-tooltip=Отменить правку
requests=Запросы
requests-tooltip=Что хочет эта станция – без проводов. Работает как постоянный комбинатор с отрицательными значениями на входе.
request-slot-tooltip=Левый клик: выбрать товар или изменить количество\nПравый клик: очистить ячейку
request-slot-fuel-tooltip=Выберите топливо, которое запрашивает эта станция заправки (только то, что сжигают локомотивы). Правый клик очищает ячейку.
