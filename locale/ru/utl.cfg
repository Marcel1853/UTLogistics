[technology-description]
utl-network-combinator=Открывает сетевой комбинатор UTL: он выдаёт сигналами запас, запас складов, запрос, нехватку или число поездов сети.
utl-loading-control=Фильтры вагонов при погрузке и выход заказов у каждой остановки: поезда берут только заказанное, а манипуляторы и насосы можно переключать по текущему заказу.
utl-networks-1=Сеть может получить одного партнёра. Тогда обе помогают друг другу поездами, депо, станциями заправки и очистки.
utl-networks-2=Сеть может получить двух партнёров.
utl-networks-3=Сеть может получить трёх партнёров.
utl-train-logistics=Открывает остановку UTL и станционный комбинатор UTL: автоматическое движение поездов между поставщиками и получателями. Порт UTL (Cargo Ships) приходит с "Автоматизированным водным транспортом".
utl-storage=Станции-склады – для станций, которые принимают и отдают.
utl-storage-2=Больше разных товаров на станцию-склад.
utl-storage-3=Больше разных товаров на станцию-склад.
utl-storage-4=Больше разных товаров на станцию-склад.

[utl-gui]
window-position=Положение:
window-position-left=Панель слева от окна остановки (по умолчанию)
window-position-right=Панель справа от окна остановки
window-position-free=Отдельное окно, свободно перемещается (место запоминается)
expression-tooltip=Можно считать, например 4000*2 или 10*s – s это размер стопки товара.
readout-network=Сеть
readout-network-tooltip=Какую сеть UTL считывает этот комбинатор (на его поверхности и для его команды).
readout-star=Учитывать связанные сети
readout-star-tooltip=Учитывать и связанные сети (звезда) – те же, что помогают друг другу поездами.
readout-mode=Выход
readout-mode-stock=Запас
readout-mode-stock-tooltip=По каждому товару – что поставщики сети предлагают сейчас (склады: то, что выше минимума).
readout-mode-storage=Запас складов
readout-mode-storage-tooltip=По каждому товару – что хранится на станциях-складах сети.
readout-mode-demand=Запрос
readout-mode-demand-tooltip=По каждому товару – что получатели сети запрашивают сейчас, предлагается это или нет.
readout-mode-shortage=Нехватка
readout-mode-shortage-tooltip=По каждому товару – что нужно получателям и чего никто в сети не предлагает. Например, подключите к посадочной площадке для грузов (задать запросы), чтобы привезти это с орбиты.
readout-mode-trains=Поезда
readout-mode-trains-tooltip=Поездов всего, свободных в депо, в пути, текущих доставок, с малым запасом топлива, без пути, а также поезда из связанных сетей, помогающие здесь, и свои поезда, работающие в других сетях – как сигналы UTL. Считаются поезда, чьё родное депо в этой сети.
readout-transit=Учитывать товары в пути
readout-transit-tooltip=Добавить товары, которые сейчас едут в поездах к получателям.
readout-output=Сейчас выдаёт
readout-hint=Сигналы находятся на комбинаторе. Что они делают (лампа, панель, посадочная площадка для грузов …), решает ваша собственная схема.
readout-status-ok=__1__ сигналов – сеть "__2__"
readout-status-empty=Выдавать нечего – у сети "__1__" сейчас нет значений для этого.
tab-station=Станция
tab-values=Значения
station-title=Станция UTL
status-ok=Готово · Остановка: __1__
status-idle=Нет задачи · Остановка: __1__
status-no-stop=Нет остановки: подключите выход к обычной остановке
network=Сеть
network-tooltip=Раздельные транспортные сети на одной карте. Вместе работают только станции с точно одинаковым именем – это касается и депо, заправки и очистки.\nПусто = сеть "default". Регистр букв важен.
network-pick-tooltip=Выберите родную сеть – здесь перечислены все сети, которые уже есть на этой карте.
networks-add-tooltip=Выберите сеть, которая уже есть на карте и ещё свободна, – она станет партнёром этой сети.
networks-new=Новая
links=Связана с
links-count=Связана с (__1__ / __2__)
links-tooltip=Связанные сети помогают друг другу: поезда, депо, станции заправки и очистки одной обслуживают и другую. Сеть здесь – центр, связанные – партнёры. Партнёры не помогают друг другу и не входят в другую группу связей. Действует для всей сети на этой поверхности.
link-center-chip=__1__ (центр)  ×
link-leave-tooltip=Выйти из группы связей "__1__".
link-own-partner=Эта сеть – партнёр "__1__"; у партнёров не может быть своих партнёров.
link-self=Сеть нельзя связать с самой собой.
link-center-is-partner=Эта сеть уже партнёр другой сети и не может иметь своих партнёров.
link-partner-taken="__1__" уже связана с другой сетью.
link-partner-is-center=У "__1__" уже есть свои партнёры, она не может стать партнёром.
link-limit=Исследования пока не позволяют больше партнёров.
networks-limit=Возможно не больше __1__ партнёров.
networks-limit-research=Достигнуто __1__ партнёров – больше с исследованием "__2__".
research-needed=Требуется исследование "__1__".
networks-new-tooltip=Создать сеть с новым именем и сразу связать её как партнёра.
elevator-network=Доставлять через космический лифт
elevator-network-tooltip=Сеть "__1__" может доставлять товары через готовые космические лифты с питанием между планетой и орбитой. Действует для сети с тем же именем с обеих сторон. По умолчанию: выкл.
elevator-none-here=На этой поверхности пока нет космического лифта.
networks-add-none=Нет свободной сети – создайте её кнопкой "Новая".
networks-chip-tooltip=Убрать связь с "__1__".
network-rename-tooltip=Переименовать родную сеть или ввести новую.
network-name-tooltip=Введите имя и нажмите Enter. Пусто = сеть "default".
cancel=Отмена
role-provider=Поставщик
role-provider-tooltip=Предлагает товары, которые на входе положительные.
role-active_provider=Активный поставщик
role-active_provider-tooltip=Как активный сундук снабжения: станцию нужно опустошить, даже без запроса. Её товары идут сначала получателям (раньше всех других поставщиков), потом на склады до их максимума и наконец на станции очистки, которые принимают эти товары. Пороги и минимальная загрузка продолжают действовать.
role-requester=Получатель
role-requester-tooltip=Запрашивает товары: отрицательные значения на входе или ячейки запросов ниже.
role-depot=Депо
role-depot-tooltip=Здесь свободные поезда ждут заказов.
role-fuel=Станция заправки
role-fuel-tooltip=Сюда едут поезда с малым запасом топлива.
role-cleanup=Очистка
role-cleanup-tooltip=Здесь разгружаются поезда с остатком груза.
section-common=Общее
section-provider=Поставщик
section-requester=Получатель
section-depot=Депо
section-fuel=Станция заправки
section-cleanup=Очистка: что может сюда приезжать
section-cleanup-tooltip=Сюда приезжают только поезда, чей остаток груза здесь принимается. Товары, указанные по одному, важнее "Все …"; если одной станции мало, поезд посещает несколько очисток подряд.
cleanup-all_items-tooltip=Принимать все предметы (__1__)
cleanup-all_fluids-tooltip=Принимать все жидкости (__1__)\nЗамечание: цистерна держит только одну жидкость – лучше одна очистка на жидкость, у каждой свой резервуар.
cleanup-or-single=или по одному:
cleanup-offer=Снова предлагать содержимое
cleanup-offer-tooltip=UTL снова предлагает сети то, что хранится на этой очистке, – как поставщик. Сундуки должны быть подключены к остановке или комбинатору, как у любого поставщика.
cleanup-offer-disabled=Отключено на этой карте (настройка карты «Очистка может снова предлагать содержимое»).
cleanup-offer-reserve=Только как резерв
cleanup-offer-normal=Как любой поставщик
cleanup-offer-first=Опустошать первой
cleanup-offer-tier-tooltip=Только как резерв: сначала обычные поставщики.\nКак любой поставщик: решают приоритет, количество и расстояние.\nОпустошать первой: эту очистку забирают раньше любого обычного поставщика.\nТовары, оставшиеся у получателя, 5 минут не привозятся ему обратно с очистки.
role-storage=Склад
role-storage-tooltip=Принимает и отдаёт: минимальный и максимальный запас по товару. Ниже минимума пополняется до максимума; всё, что выше минимума, предлагается – как у обычного поставщика, побеждает ближний. Для опытных игроков.
role-storage-locked=Склад требует исследования «UTL: Склад» (и настройки карты «Разрешить станции-склады»).
role-addon-tooltip=Роль из мода «__1__». UTL ездит сюда только так, как скажет этот мод.
section-storage=Склад
section-storage-tooltip=Ниже минимума склад запрашивает – до максимума. Всё, что выше минимума, он предлагает как обычный поставщик; если он ближе к получателю, он побеждает. Товары без границ (например, остаток груза) предлагаются полностью, как резерв.
storage-good=Товар
storage-good-tooltip=Товар, для которого у склада есть границы. Правый клик очищает ячейку.
storage-min=Минимум
storage-min-tooltip=Если запас опустится ниже, склад запрашивает – до максимума.
storage-max=Максимум
storage-max-tooltip=До этого значения склад пополняется, когда падает ниже минимума.
storage-leftover=Принимать остаток груза
storage-leftover-tooltip=Поезда с остатком груза могут оставлять его здесь, как на очистке. Какие товары – задаётся в разделе очистки.
cleanup-slot-tooltip=Этот товар можно здесь выгружать. Правый клик очищает ячейку.
on=вкл.
off=выкл.
reset-tooltip=Сбросить по умолчанию
value-min_train_length=Мин. длина поезда
value-min_train_length-tooltip=Только поезда хотя бы с таким числом единиц (включая локомотивы). 0 = любые.\nДепо: более короткий поезд переезжает в подходящее депо с тем же именем.
value-max_train_length=Макс. длина поезда
value-max_train_length-tooltip=Только поезда не больше чем с таким числом единиц (включая локомотивы). 0 = любые.\nДепо: более длинный поезд переезжает в подходящее депо с тем же именем.
value-max_trains=Макс. поездов
value-max_trains-tooltip=Не больше стольких поездов здесь или в пути одновременно – у поставщиков, получателей, складов, заправок, очисток и депо. Ограничение поездов на остановке тоже действует. 0 = без ограничения (депо: один поезд).
value-provide_threshold=Порог предложения
value-provide_threshold-tooltip=Товар предлагается только начиная с этого количества.
value-provide_stack_threshold=Порог предложения в стопках
value-provide_stack_threshold-tooltip=Порог в стопках (только предметы). Действует, если выше порога предложения. 0 = выкл.
value-provide_priority=Приоритет предложения
value-provide_priority-tooltip=Поставщики с более высоким приоритетом используются первыми.
value-locked_slots=Заблокированных ячеек на вагон
value-locked_slots-tooltip=Столько ячеек в каждом грузовом вагоне остаётся пустыми при погрузке.
value-output=Выход заказов
value-output-tooltip=Маленький выход рядом с остановкой несёт текущие заказы как сигналы: товары для погрузки здесь – положительные, приезжающие сюда – отрицательные, плюс число поездов доставки, которые сейчас едут сюда. Пока здесь стоит поезд доставки, добавляются номер поезда, длина поезда и число вагонов. Выкл.: выход исчезает.
value-depot-output=Выход депо
value-depot-output-tooltip=Маленький зелёный выход рядом с депо: пока здесь стоит поезд, на нём номер поезда, длина, локомотивы, вагоны и "мало топлива" (1 = пора заправиться). Всегда: свободные поезда в депо с этим именем и поезда, едущие сюда. Выкл.: выход исчезает.
value-filter_load=Грузить только текущий заказ
value-filter_load-tooltip=UTL настраивает ячейки вагонов на товары текущей доставки и блокирует остальные – тогда хватит одного сундука с несколькими товарами и обычного манипулятора. Выкл.: вагоны остаются свободными, как раньше. Не действует для жидкостей.
value-request_threshold=Порог запроса
value-request_threshold-tooltip=Товар запрашивается только начиная с такой потребности.
value-request_stack_threshold=Порог запроса в стопках
value-request_stack_threshold-tooltip=Порог в стопках (только предметы). Действует, если выше порога запроса. 0 = выкл.
value-request_priority=Приоритет запроса
value-request_priority-tooltip=Получатели с более высоким приоритетом обслуживаются первыми.
value-depot_priority=Приоритет депо
value-depot_priority-tooltip=Поезда из депо с более высоким приоритетом используются первыми.
value-fuel_request=Запрашивать топливо
value-fuel_request-tooltip=Станция заправки сама заказывает топливо: укажите в ячейках запросов, какое топливо и сколько, – UTL привезёт его как получателю (действуют порог и приоритет запроса). Разгрузочные манипуляторы ставьте в сундук, из которого берут заправочные манипуляторы. По умолчанию: выкл.
label-stacks=Стопки
