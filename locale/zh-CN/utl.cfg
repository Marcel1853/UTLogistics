[entity-description]
utl-station-settings=车站设置（需求、角色、数值）的隐形存储，让蓝图参数能够生效。由 UTL 自动建造 – 不需要机器人或物品。
utl-port=内置 UTL 逻辑的 Cargo Ships 港口 – 和 UTL 火车站一样，只是用于船。把箱子/储液罐直接连到它上面：正值 = 供应，负值 = 需求。
utl-network-combinator=以信号输出 UTL 网络的状态：库存、仓库库存、需求、短缺或列车数量。在它的窗口中设置网络和模式。用这些信号做什么（灯、显示器、货物着陆台 …）由你自己接线。
utl-train-stop=内置 UTL 逻辑的火车站。把箱子/储液罐直接连到车站：正值 = 供应，负值 = 需求。可以直接建在普通火车站上。
utl-station-combinator=配合普通火车站使用：把它的输出端（红线或绿线）连到车站。把箱子/储液罐或需求连到输入端：正值 = 供应，负值 = 需求。在窗口中设置角色和阈值。

