lager-provider=供应站：铁和铜，离仓库很远
lager-workshop=车间：供应站比仓库更近 – 由它配送（如果它忙，仓库帮忙）
lager-cleanup=清理站：接收剩余货物并再次供应（“优先清空”）
lager-depot=车库：列车在这里等待
lager-storage=仓库：铁最低 400，最高 1200 – 卸货和装货机械臂接在订单输出上
lager-factory=工厂：仓库比供应站更近 – 由它配送
lager-copper-a=铜车间 A：小箱子 – 这里车厢中会剩下一部分
lager-copper-b=铜车间 B：从清理站获得铜
lager-ex-two=示例“两个仓库”：过满的给过空的一次，之后就平稳了
lager-ex-rest=示例“剩余货物”：没有清理站时，仓库接收剩余部分并作为后备供应
lager-ex-tiers=示例“清理站等级”：仅作后备、与普通供应站相同、优先清空 – 谁来配送？
lager-ex-multi=示例“两种货物”：一个仓库，每种货物各有限额，一趟运完两种
cleanup-return=清理站回供：卸货机械臂清空剩余货物，装货机械臂只发出所订的铜
demo-requester=需求站 – 铁箱子显示到货情况；列车在途时它的需求会增加
demo-fuel=加油站 – 燃料不足时，列车在前往下一单的途中在这里加油
demo-cleanup=清理站 – 卸货后列车中剩下的东西在这里卸下
verbund-depot-stein=石头车库：只为石头跑车
bsp-mixed=三个箱子，三个机械臂：订单输出（红线）只启用所订货物的那个
bsp-workshop=需要铁和铜 – 一趟同时得到两种
bsp-copper=需求站：目标库存 400 – 箱子足够满后就不再来车
bsp-depot=车库：角色"车库"，时刻表中只有该车库的列车
bsp-depot2=同名的第二个车库 – 流体列车在这里等待
bsp-tanks=两个储液罐：订单输出只打开所订流体的泵
bsp-oil=石油到达时泵打开（信号低于 0）
bsp-water=水到达时泵打开（信号低于 0）
bsp-readout=网络运算器，模式“列车”：有列车在配送时灯亮
last-yard=编组场：12 条股道各一列车，全部为"车库"角色
last-siding=侧线上的车站：站台 + 2 个等待位，道岔前设连锁信号
last-combinator=普通火车站 + UTL 运算器：输出连到车站
last-fluid=流体：泵在车厢旁，储液罐连到车站

