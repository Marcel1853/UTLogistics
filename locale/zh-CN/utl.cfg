copy=Shift + 右键复制，Shift + 左键粘贴
manager-open=Ctrl + Shift + U（或 Ctrl + Alt + U）打开 UTL 管理器
links-iron=网络 Eisen（铁）：唯一的列车在这里
links-copper=网络 Kupfer（铜） – 没有自己的列车
links-copper-wait=网络 Kupfer：铁和铜连接后才会得到服务
ring-network=网络 "__1__"：自己的车库，自己的列车
verbund-eisen=网络 Eisen（铁） – 中心：支援铜和煤
verbund-kupfer=网络 Kupfer（铜） – 铁的伙伴，没有自己的列车
verbund-kohle=网络 Kohle（煤） – 铁的伙伴
