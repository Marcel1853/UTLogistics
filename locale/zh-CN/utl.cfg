[technology-description]
utl-network-combinator=解锁 UTL 网络运算器：它以信号输出一个网络的库存、仓库库存、需求、短缺或列车数量。
utl-loading-control=装货时的车厢过滤以及每个车站的订单输出：列车只拿所订的货，机械臂和泵可以根据当前订单开关。
utl-networks-1=一个网络可以有一个伙伴。两者随后互相支援列车、车库、加油站和清理站。
utl-networks-2=一个网络可以有两个伙伴。
utl-networks-3=一个网络可以有三个伙伴。
utl-train-logistics=解锁 UTL 火车站和 UTL 车站运算器：供应站和需求站之间的自动列车运输。UTL 港口（Cargo Ships）随"自动化水路运输"解锁。
utl-storage=仓库站 – 用于既收货又发货的车站。
utl-storage-2=每个仓库站可存放更多种货物。
utl-storage-3=每个仓库站可存放更多种货物。
utl-storage-4=每个仓库站可存放更多种货物。

