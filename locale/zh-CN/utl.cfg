utl-network-combinator=[item=utl-network-combinator] [font=default-bold]网络运算器[/font]以信号输出一个 UTL 网络的状态。在它的窗口中选择网络（可选包含已连接的网络）以及输出内容：\n• [font=default-bold]库存[/font] – 每种货物，网络中供应站提供的数量，\n• [font=default-bold]仓库库存[/font] – 仓库站中存放的数量，\n• [font=default-bold]需求[/font] – 需求站请求的数量，\n• [font=default-bold]短缺[/font] – 需求站需要但无人供应的数量，\n• [font=default-bold]列车[/font] – 总数、空闲、在途、配送、燃料不足、没有路径；以及已连接网络的列车是否在此支援、本网络列车是否在别处工作。\n\n场景中需求站想要铁和铜。列车送来铁，没人供应铜 – 所以在"短缺"模式下运算器只输出铜，灯亮了。\n\n信号用来做什么取决于你的接线：像场景中那样接一盏灯、一个显示器 – 或者在 Space Age 中把[font=default-bold]短缺[/font]连到货物着陆台（"设置需求"），让它从轨道取来缺少的货物。由"UTL：网络运算器"解锁。
utl-overview=UTL 自动调度列车：从[font=default-bold]车库[/font]前往拥有[font=default-bold]需求站[/font]所需货物的[font=default-bold]供应站[/font]，然后前往需求站。\n\n快速开始：\n1. 车库：[item=utl-train-stop] 设为"车库"角色，一列时刻表中只有该车库的列车（空车，自动）。\n2. 供应站：车站设为"供应站"角色，箱子用电线连到车站。\n3. 需求站：角色"需求站"，在窗口中填写一个需求格子。\n\n你的时刻表会保留：UTL 只插入临时站点，列车组和中断都保留。卸货后列车会立即接附近的下一单。
utl-train-stop=[item=utl-train-stop] 既是火车站又是 UTL 车站。把箱子和储液罐（红线或绿线）直接连到车站：正值被供应，负值被请求。在火车站窗口左侧的 UTL 面板中设置角色、网络和数值。\n\n它可以直接建在普通火车站上。
utl-combinator=用于已有车站：在普通火车站旁放一个 [item=utl-station-combinator]。\n\n把运算器的[font=default-bold]输出端[/font]（红线或绿线）连到车站 – 这样 UTL 就知道哪个车站属于它。\n[font=default-bold]输入端[/font]：箱子/储液罐。\n\n输出端没有连线时，窗口显示"没有火车站"。运算器不需要电。
utl-roles=每个车站在窗口中获得一个角色：\n\n[font=default-bold]供应站[/font] – 取走数值为正的货物。\n[font=default-bold]需求站[/font] – 送来数值为负或来自需求格子的货物。\n供应站 + 需求站 – 缓冲站。\n[font=default-bold]车库[/font] – 空闲列车在这里等待。\n[font=default-bold]加油站[/font] – 列车在这里加油。\n[font=default-bold]清理站[/font] – 带剩余货物的列车在这里清空。\n[font=default-bold]仓库[/font] – 既收货也发货，每种货物有最低和最高库存（进阶，研究"UTL：仓库"）。
utl-requests=需求格子中的数量是[font=default-bold]目标库存[/font]，不是订单：UTL 配送"目标 − 现有库存 − 已在途"。\n\n要同时跑多列车，就设一个更高的目标库存。如果供应站还有同一需求站需要的其他货物，只要还有空间列车也会一起装。流体用液罐车厢运输（泵在车厢旁，储液罐连到车站）。\n\n一个供应站有多种货物：一个混装箱子就够了 – 配送期间 UTL 会把车厢格子过滤为所订的货物。借助订单输出，你还可以按当前订单开关机械臂和泵（研究\"UTL：装货控制\"）。\n\n车站窗口中的"在途"显示当前正在送来或取走的货物。
utl-values=在"数值"分页中：\n• [font=default-bold]最短/最长列车长度[/font] – 只用合适的列车（机车也算，0 = 不限）。\n• [font=default-bold]最多列车数[/font] – 同时最多这么多（车站的列车限制也有效）。\n• [font=default-bold]阈值[/font] – 货物达到这个数量才会被供应或配送（也可按堆叠）。\n• [font=default-bold]优先级[/font] – 更高的先。\n• 每节车厢的[font=default-bold]锁定格数[/font]。\n\n每个数字输入框都可以计算，例如"4000*2"。⟲ 恢复默认值。\n\n[font=default-bold]网络[/font]：在一张地图上分开多个运输网络。只有名称完全相同的车站才会协同工作，所有角色都是如此：来自车库"矿石"的列车只服务矿石车站，只在矿石加油站加油，也只在矿石清理站清空。\n\n留空 = 网络"default"。因此每个网络都需要自己的车库、加油站和清理站。车库放错网络会导致出现"网络 … 中没有空闲列车"的警报，尽管有列车在等待。\n\n研究"UTL：网络连接"后，网络可以连接起来互相支援 – 见"网络"条目。
utl-networks=[font=default-bold]网络[/font]在一张地图上分开多个运输系统 – 而不必分开铁轨。场景中两列车跑在[font=default-bold]同一个环线[/font]上："Erze"（矿石）和"Platten"（板材），每个网络有自己的车库、供应站和需求站。\n\n只有[font=default-bold]名称完全相同[/font]的车站才会协同工作。所以矿石列车会直接驶过板材车站。\n\n这适用于所有角色：列车只在本网络的加油站加油，也只在本网络的清理站清空。因此每个网络都需要自己的车库、加油站和清理站 – 除非你把网络连接起来。\n\n留空 = 网络"default"。如果只想要一个大网络，就到处都留空。\n\n网络也可以[font=default-bold]连接[/font]起来互相支援 – 见\"连接网络\"。
utl-depots=空闲列车[font=default-bold]空着[/font]在设有"车库"角色的车站等待 – 每个车库车站都需要这个角色，只有名称不够。\n\n如果列车停在一个有车库名称但没有该角色的车站，它会自己转到真正的车库。\n\n车库的最短/最长列车长度：不合适的列车会转到同名的合适车库。
utl-fuel=如果某台机车低于加油阈值（地图设置，默认 40 %），列车会先去一个合适的[font=default-bold]加油站[/font]，然后继续执行订单。\n\n加油站的机械臂给机车加满燃料。列车等到所有机车都加满（最长 30 秒）。\n\n如果网络中没有任何加油站，燃料不足的列车照常运行 – 这时你需要自己加油（例如用中断）。
utl-cleanup=带剩余货物的列车会前往一个合适的[font=default-bold]清理站[/font]，在那里被清空（机械臂或泵），然后接下一单。\n\n清理站接收什么在"数值"分页中设置：[virtual-signal=utl-cleanup-all-items] 所有物品、[virtual-signal=utl-cleanup-all-fluids] 所有流体或单个货物。逐个填写的货物优先；如果一个车站不够，列车会依次前往多个。\n\n没有合适的清理站时，列车在车库等待并显示警报。
utl-cleanup-return=进入清理站的东西不必一直留在那里。在清理站勾选[font=default-bold]再次供应内容[/font]，它就会把箱子里的内容供应给网络 – 就像供应站一样。为此箱子必须连到车站。\n\n旁边的等级决定清理站何时被使用：[font=default-bold]仅作后备[/font]（普通供应站优先）、[font=default-bold]与普通供应站相同[/font]或[font=default-bold]优先清空[/font]。\n\n在需求站剩下的货物 5 分钟内不会被任何清理站送回给它 – 否则会来回折返。可以为整张地图关闭：地图设置“清理站可再次供应其内容”。\n\n[font=default-bold]按场景搭建：[/font]卸货机械臂（车厢 → 箱子）、转运机械臂（箱子 → 箱子）、装货机械臂（箱子 → 车厢）。订单输出控制它们：装货机械臂在 [virtual-signal=utl-loading] > 0 时工作，卸货机械臂在 [virtual-signal=utl-loading] = 0 时工作 – 剩余货物没有订单，因此会这样卸下。装货机械臂开启了“设置过滤”，只抓取所订的货物：列车送来铁和铜，只有铜被取走。
utl-storage=[font=default-bold]仓库[/font]既收货也发货。每种货物你都设定最低和最高库存：\n• 低于最低值时它请求 – 直到最高值，\n• 高于最低值的部分它像普通供应站一样供应 – 如果仓库离需求站更近，就由它配送。\n\n这样仓库能在消费者附近保有库存。两个仓库绝不会来回倒货：只供应高于最低值的部分，只在低于最低值时请求。开启“接收剩余货物”后它也接收剩余货物。\n\n仓库需要双向的机械臂：卸货机械臂把货物放进箱子，转运机械臂把它们移到装货箱子，装货机械臂把它们装上列车。订单输出控制它们 – [virtual-signal=utl-loading] > 0 时装货，否则卸货。由“UTL：仓库”解锁，可用地图设置“允许仓库站”关闭。
utl-copy=在车站上[font=default-bold]Shift + 右键[/font]复制其 UTL 设置，在另一个车站上[font=default-bold]Shift + 左键[/font]粘贴。\n\n[item=blueprint] 蓝图、复制/粘贴（Ctrl + C / Ctrl + V）和克隆都会保留设置。
utl-manager=[font=default-bold]UTL 管理器[/font]让你一眼看清整个铁路网络。用快捷栏中的机车按钮或 [font=default-bold]Ctrl + Shift + U[/font]（或 [font=default-bold]Ctrl + Alt + U[/font]）打开。右上角：放大镜 = 搜索（按名称筛选），箭头 = 立即刷新。\n\n分页：\n• [font=default-bold]车库[/font] – 左侧是每个车库及其空闲/总列车数。点击车库，右侧显示它的列车及编组、状态和货物；列车按钮可在地图上跟随列车。\n• [font=default-bold]车站[/font] – 角色、供应（绿）、需求（红）、在途（蓝 = 送来，黄 = 被取走）和列车数。网络显示在名称后面，带连接，例如 [铁 ↔ 铜]。点击名称可在地图上查看车站。\n• [font=default-bold]网络[/font] – 每个网络及其连接，见"管理器：网络"。\n• [font=default-bold]库存[/font] – 所有被供应、被需求和在运输中的东西，见"管理器：库存"。\n• [font=default-bold]历史[/font] – 最近 100 次配送及用时；取消的以红色显示并附原因。\n• [font=default-bold]警报[/font] – 没有空闲或合适的列车、剩余货物、缺少货物、没有路径、加油失败。每一组都可以在玩家设置中关闭。\n\n场景中一列带剩余货物的列车到达车库，而没有清理站 – 这就是警报在\"警报\"分页中的样子。旁边的按钮在地图上显示位置。\n\n多个行星：放大镜旁边可以选择显示哪个行星 – \"自动\"跟随你所在或正在观看的行星；\"所有行星\"显示全部。不同行星上同名的车库保持独立。\n\n在"设置"分页中，你无需主菜单就能修改装货数值（装货/卸货无变化、货物和/或无变化） – 有队伍时按队伍设置（由队长修改），否则对所有人生效（仅管理员）。
utl-network-links=你可以随意[font=default-bold]创建[/font]任意多个网络。只有[font=default-bold]连接[/font]受限 – 研究"UTL：网络连接 I–III"允许每个网络有 1、2 或 3 个伙伴。\n\n场景中只有网络"Eisen"（铁）有列车，供应站和需求站在网络"Kupfer"（铜）中 – 起初什么都不动。在车库的车站窗口中，[font=default-bold]"已连接"[/font]框：\n1. 从列表中选择"Kupfer" – 它立即成为伙伴，铁路列车出发了。\n2. 点击[font=default-bold]新建[/font]，输入名称（"Kohle"，煤），✓ – 网络被创建并立即连接。\n之后每个伙伴都显示为一个按钮；点击即可移除连接。计数器（2 / 2）显示已用和允许的伙伴数，提示中写明需要哪项研究才能更多。\n\n连接如何运作 – 一个[font=default-bold]星形[/font]：\n• 中心和伙伴互相支援列车、车库、加油站和清理站。\n• 伙伴之间[font=default-bold]不[/font]互相支援：铜列车绝不会为"Kohle"跑车。\n• 伙伴不属于任何其他网络，也不能有自己的伙伴。\n• 连接适用于该地表上的整个网络，而不仅是这个车站。在 Vulcanus 上你要另建星形。
utl-manager-networks=管理器中的[font=default-bold]网络[/font]分页：左侧是每个网络（有多个行星时带地表）及其车站数、空闲列车数和进行中的配送数。\n\n点击一个网络，右侧显示：\n• 上方是[font=default-bold]"已连接"[/font]框 – 从列表中选择伙伴，或输入新名称并 ✓；点击伙伴按钮即可移除连接。用法和车站窗口中完全一样。\n• 下方是星形中的每个车站及其角色和网络；伙伴的车站显示为灰色。\n\n如果所选网络本身是伙伴，按钮会显示它的中心；点击即可离开星形。\n\n[font=default-bold]车站[/font]分页在名称后显示连接：中心为 [铁 ↔ 铜]，伙伴为 [铜 → 铁]。
utl-manager-inventory=管理器中的[font=default-bold]库存[/font]分页在左侧以图标显示网络中的一切：[font=default-bold]供应[/font]（绿）、[font=default-bold]需求[/font]（红）和[font=default-bold]在途[/font]（蓝）。\n\n[font=default-bold]点击一种货物[/font] – 右侧会显示：\n• 供应、需求和在途的总量，\n• 拥有或需要它的每个车站（点击名称可在地图上查看），\n• 当前运载它的每列列车，及其起点和目的地。\n\n再次点击同一种货物可关闭该视图。该分页不会自动刷新，以免你阅读时列表跳动 – 请使用上方的箭头。
utl-news=[font=default-bold]0.0.28[/font] 最重要的内容：\n\n• UTL 管理器：窗口稍大一些，大小可以自己设置 – 设置 → 模组设置 → 玩家，“UTL 管理器：宽度”和“高度”。\n• 标题栏的筛选按钮更大，并带有“筛选”字样。\n• 设置和库存分页改为分框显示；列标题不再被截断。\n\n0.0.27 的新内容：UTL 管理器中的货物筛选；更高品质的液罐车厢会被装满。\n\n全部更改：模组门户，“Changelog”分页。

