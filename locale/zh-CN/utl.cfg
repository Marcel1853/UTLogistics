elevator-none-here=该地表上还没有太空电梯。
networks-add-none=没有空闲网络 – 用"新建"创建一个。
networks-chip-tooltip=移除与 "__1__" 的连接。
network-rename-tooltip=重命名所属网络或输入新网络。
