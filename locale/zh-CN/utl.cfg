section-provider=供应站
section-requester=需求站
section-depot=车库
section-fuel=加油站
section-cleanup=清理站：哪些货物可以来这里
section-cleanup-tooltip=只有剩余货物被此处接收的列车才会来这个车站。逐个填写的货物优先于"全部 …"；如果一个车站不够，列车会依次前往多个清理站。
cleanup-all_items-tooltip=接收所有物品（__1__）
cleanup-all_fluids-tooltip=接收所有流体（__1__）\n注意：一个储液罐只能装一种流体 – 最好每种流体一个清理站，各有自己的储液罐。
cleanup-or-single=或逐个：
cleanup-offer=再次供应内容
cleanup-offer-tooltip=UTL 把该清理站中存放的东西重新供应给网络 – 就像供应站一样。箱子必须像任何供应站一样连到车站或运算器。
cleanup-offer-disabled=在本地图上已禁用（地图设置“清理站可再次供应其内容”）。
cleanup-offer-reserve=仅作后备
cleanup-offer-normal=与普通供应站相同
cleanup-offer-first=优先清空
cleanup-offer-tier-tooltip=仅作后备：普通供应站优先。\n与普通供应站相同：由优先级、数量和距离决定。\n优先清空：该清理站在任何普通供应站之前被取货。\n在需求站剩下的货物 5 分钟内不会被清理站送回给它。
role-storage=仓库
role-storage-tooltip=既收货也发货：每种货物有最低和最高库存。低于最低值时补到最高值；高于最低值的部分会被供应 – 和普通供应站一样，较近者优先。适合进阶玩家。
role-storage-locked=仓库需要研究“UTL：仓库”（以及地图设置“允许仓库站”）。
role-addon-tooltip=来自模组“__1__”的角色。UTL 只按该模组的指示在这里行驶。
section-storage=仓库
section-storage-tooltip=低于最低值时仓库会请求 – 直到最高值。高于最低值的部分它像普通供应站一样供应；如果离需求站更近，它优先。没有设限的货物（例如剩余货物）全部作为后备供应。
storage-good=货物
storage-good-tooltip=该仓库设有限额的货物。右键清空格子。
storage-min=最低
storage-min-tooltip=库存低于此值时，仓库会请求 – 直到最高值。
storage-max=最高
storage-max-tooltip=仓库低于最低值时补货到这里。
storage-leftover=接收剩余货物
storage-leftover-tooltip=带剩余货物的列车可以在这里卸下，就像在清理站一样。接收哪些货物在清理站部分设置。
cleanup-slot-tooltip=这种货物可以在这里卸空。右键清空格子。
on=开
off=关
reset-tooltip=恢复默认
value-min_train_length=最短列车长度
value-min_train_length-tooltip=只允许至少有这么多节车的列车（含机车）。0 = 不限。\n车库：较短的列车会转到同名的合适车库。
value-max_train_length=最长列车长度
value-max_train_length-tooltip=只允许最多这么多节车的列车（含机车）。0 = 不限。\n车库：较长的列车会转到同名的合适车库。
value-max_trains=最多列车数
value-max_trains-tooltip=同时在此或驶向此处的列车最多这么多 – 适用于供应站、需求站、仓库、加油站、清理站和车库。车站本身的列车限制也有效。0 = 不限（车库：一列）。
value-provide_threshold=供应阈值
value-provide_threshold-tooltip=货物达到此数量才会被供应。
value-provide_stack_threshold=供应堆叠阈值
value-provide_stack_threshold-tooltip=以堆叠计的阈值（仅物品）。高于供应阈值时生效。0 = 关。
value-provide_priority=供应优先级
value-provide_priority-tooltip=优先级更高的供应站先被使用。
value-locked_slots=每节车厢锁定格数
value-locked_slots-tooltip=装货时每节货运车厢留空这么多格。
value-output=订单输出
value-output-tooltip=车站旁的小输出把正在进行的订单作为信号输出：在此装车的货物为正，送到此处的货物为负，另外还有正驶向此处的配送列车数。配送列车停在这里时，还会加上列车编号、列车长度和车厢数。关：输出消失。
value-depot-output=车库输出
value-depot-output-tooltip=车库旁的绿色小输出：列车停在这里时，输出列车编号、列车长度、机车数、车厢数和"燃料不足"（1 = 应该加油）。始终输出：同名车库中的空闲列车和驶向此处的列车。关：输出消失。
value-filter_load=只装当前订单
value-filter_load-tooltip=UTL 把车厢格子设为当前配送的货物并锁住其余格子 – 一个装有多种货物的箱子加一个普通机械臂就够了。关：车厢像以前一样保持自由。对流体无效。
value-request_threshold=需求阈值
value-request_threshold-tooltip=需求达到此数量才会请求货物。
value-request_stack_threshold=需求堆叠阈值
value-request_stack_threshold-tooltip=以堆叠计的阈值（仅物品）。高于需求阈值时生效。0 = 关。
value-request_priority=需求优先级
value-request_priority-tooltip=优先级更高的需求站先被满足。
value-depot_priority=车库优先级
value-depot_priority-tooltip=来自优先级更高的车库的列车先被使用。
value-fuel_request=请求燃料
value-fuel_request-tooltip=加油站自行订购燃料：在需求格子里填写哪种燃料和多少 – UTL 会像给需求站一样送来（需求阈值和优先级有效）。把卸货机械臂放进一个箱子，加油机械臂从这个箱子取。默认：关。
