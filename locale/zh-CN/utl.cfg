window-position-right=面板在火车站窗口右侧
window-position-free=独立窗口，可自由移动（会记住位置）
expression-tooltip=可以计算，例如 4000*2 或 10*s – s 是该货物的堆叠数量。
readout-network=网络
readout-network-tooltip=该运算器读取哪个 UTL 网络（在它所在的地表、为它所属的队伍）。
readout-star=包含已连接的网络
readout-star-tooltip=同时统计已连接的网络（星形） – 就是那些互相支援列车的网络。
readout-mode=输出
readout-mode-stock=库存
readout-mode-stock-tooltip=每种货物，网络中供应站当前提供的数量（仓库：高于最低值的部分）。
readout-mode-storage=仓库库存
readout-mode-storage-tooltip=每种货物，网络中仓库站存放的数量。
readout-mode-demand=需求
readout-mode-demand-tooltip=每种货物，网络中需求站当前请求的数量 – 不论是否有人供应。
readout-mode-shortage=短缺
readout-mode-shortage-tooltip=每种货物，需求站需要但网络中无人供应的数量 – 例如连到货物着陆台（设置需求），从轨道上取货。
readout-mode-trains=列车
readout-mode-trains-tooltip=列车总数、车库中空闲、在途、进行中的配送、燃料不足、没有路径，以及在此支援的已连接网络的列车和在其他网络工作的本网络列车 – 作为 UTL 信号。统计的是归属车库在本网络的列车。
readout-transit=计入在途货物
readout-transit-tooltip=加上当前正在列车中送往需求站的货物。
readout-output=当前输出
readout-hint=信号在运算器上。它们做什么（灯、显示器、货物着陆台 …）取决于你自己的接线。
readout-status-ok=__1__ 个信号 – 网络 "__2__"
readout-status-empty=没有可输出的 – 网络 "__1__" 目前没有这方面的数值。
tab-station=车站
tab-values=数值
