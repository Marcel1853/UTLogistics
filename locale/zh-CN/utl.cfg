[mod-setting-description]
utl-status-color-incoming=该状态在 UTL 车站的显示面板（用电线连接）和车站灯上的颜色。
utl-status-color-stopped=该状态在 UTL 车站的显示面板（用电线连接）和车站灯上的颜色。
utl-status-color-depot=该状态在 UTL 车站的显示面板（用电线连接）和车站灯上的颜色。
utl-status-color-idle=该状态在 UTL 车站的显示面板（用电线连接）和车站灯上的颜色。
utl-status-color-off=该状态在 UTL 车站的显示面板（用电线连接）和车站灯上的颜色。
utl-leader-inactive-days=队长连续这么多天未上线（游戏时间，服务器运行期间）将失去队长权限。如果没有队长了，由资历最久的活跃成员接任。0 = 从不。
utl-timeout-mode="货物或无变化"（默认）：列车装满或卸空，或在这段时间内没有任何变化时就出发 – 带着现有的货物，即使箱子是空的。"货物和无变化"：只有在装满或卸空且这段时间内没有变化时才出发。每个队伍都可以在 UTL 管理器中自行设置。
utl-top-up=如果列车还在前往供应站的路上或正在那里装货时需求增加，数量会加到当前装货清单中，而不是再开一趟。前提是同一个供应站有货且列车还有空间。节省列车，但列车在供应站停留更久。默认：关。
utl-multi-pickup=如果一个供应站不够满足需求，列车会在同一网络中的第二个供应站取剩下的 – 一趟两个装货站，而不是两趟。仅限同一地表，最多两个供应站。默认：关。
utl-min-load-percent=只有当列车至少能装满这么多百分比的货舱时才出发 – 同一供应站交给该需求站的所有货物都算在内。不再为少量剩余跑车（例如需求站只缺 1000）；需求会等到攒够为止。0 = 关。默认：0。
utl-multi-pickup-detour=只有当绕路不超过从第一个供应站到需求站直线距离的这个百分比时，才去第二个供应站。更远的话就改派第二列车。0 = 允许任意绕路。默认：50。
utl-cleanup-offer=允许清理站把内容重新供应给网络 – 在每个车站用“再次供应内容”复选框开启（那里默认关）。此处关闭 = 整张地图禁用。
utl-storage=允许“仓库”车站类型（每种货物的最低/最高库存）。关 = 仓库在整张地图上既不供应也不需求。
utl-load-timeout=在供应站货物没有任何变化的秒数（0 = 无此条件）。"货物或无变化"（默认）时，如果这段时间内没有新增，列车也会在装完前出发 – 带着现有的货物；"货物和无变化"时，只有全部装完且这段时间内没有变化才出发。如果什么都没装上，配送会被取消。这是所有队伍的默认值，每个队伍可在 UTL 管理器（"设置"分页）中设定自己的值。
utl-unload-timeout=在需求站货物没有任何变化的秒数（0 = 无此条件）。"货物和无变化"时，列车卸空且这段时间内没有变化就出发；"货物或无变化"时也会更早出发，剩余货物去清理站。这是所有队伍的默认值，每个队伍可在 UTL 管理器中设定自己的值。
utl-item-group=自动：铁轨、高架铁轨、信号、车站、机车和车厢 – 包括其他模组的 – 归入“火车”分页。如果另一个模组已经有自己的火车分页，UTL 的物品会放到那里，UTL 不再重新排序。总是 UTL：UTL 把所有火车物品放进自己的分页。关：不重新排序。
utl-signal-style=经典：游戏中的载具和箱子，角上带一个符号。扁平：自有的简洁符号，风格同原版信号（浅灰色带深色轮廓）。需要重启。
utl-station-lamps=作为显示面板的补充：UTL 车站顶部的两个小灯按状态颜色亮起（蓝 = 列车在途，绿 = 列车停靠，青 = 列车在车库等待，黄 = 无事发生，红 = 已关闭；颜色在地图设置中）。它们很小 – 主要的显示是用电线连到车站的显示面板。需要重启。
utl-heartbeat-interval=UTL 两个工作步骤之间相隔多少 tick。每一步只做少量、固定的工作。越大 = CPU 越省，但反应越慢。
utl-debug-log=向 factorio-current.log 写入额外信息。仅在排查问题时开启。
utl-station-batch-size=每次心跳读取多少个车站。所有车站轮流处理。
utl-max-deliveries-per-cycle=调度器每轮（每 3 次心跳）最多派出多少列车。越小 = CPU 负载越平稳。
utl-research-required=开：装货控制（车厢过滤、订单输出）、仓库站和网络连接需要先研究。关：一切立即可用，每个网络最多 3 个伙伴。
utl-station-output=每个车站旁都有一个小输出，把正在进行的订单作为信号输出：供应站为正（这么多要装车），需求站为负（这么多正在送来）。可用于过滤机械臂、泵和显示器。不要连到车站输入 – 那样会反馈进库存。
utl-wagon-filters=配送进行期间，UTL 把货运车厢的格子设为该订单的货物并锁住其余格子。这样供应站可以在一个箱子里放多种货物，普通机械臂也只装所订的货。你自己设置过过滤的车厢不受影响。对流体无效。
utl-chaining=刚卸完货或离开加油站/清理站的列车会立即接一个合适的配送（优先附近的供应站），而不是先回车库。节省空跑。
utl-fuel-threshold=如果列车的任意一台机车燃料低于此值，列车会在下一单之前或从车库出发时先去一个合适的 UTL 加油站（同一网络，列车长度在该站范围内）。0 = 关。
utl-fuel-minimum=低于此燃料值（最低的那台机车）时，列车不再接单，除非途中能在一个可到达、空闲的 UTL 加油站加油。它会留在车库，出现“缺少燃料”警报，车库输出也会报告。在此值和“低于此值加油”之间，如果没有空闲的加油站，列车可以不加油继续跑。0 = 关。
utl-alert-no-train-minutes=只有当某个需求未被满足达到这么久时，才出现“没有合适的列车”警报。当一列载着该货物的列车正驶向车站时，视为已满足。0 = 立即。
utl-stuck-minutes=如果配送列车这么久没有进展 – 在信号前等待、找不到路径或目的地已满 –，就会出现“列车卡住”警报，UTL 管理器会在该列车处显示。UTL 不会取消任何东西。装货和卸货不算（那些有时间限制）。0 = 关。默认：5。
utl-alerts-no-train=当车站需要某物且有供应站有货，但没有空闲或合适的列车（网络、列车长度）时发出警报。
utl-alerts-cargo=当列车带着剩余货物在车库等待、在需求站没有卸空，或在供应站装得比订单少时发出警报。
utl-alerts-trains=当配送列车找不到路径、找不到空闲车库、加油失败或配送被取消时发出警报。
utl-default-provide-threshold=新车站的初始值。
utl-default-request-threshold=新车站的初始值。
utl-news=UTL 更新后，在聊天中显示一行简短的新内容说明 – 附带指向提示与技巧中“UTL 新内容”页面的链接。
utl-manager-width=UTL 管理器的宽度（像素，界面缩放 100 % 时）。默认 1040。窗口放不下屏幕时会自动缩小。
utl-manager-height=UTL 管理器的高度（像素，界面缩放 100 % 时）。默认 620。窗口放不下屏幕时会自动缩小。
utl-stop-style=原版：普通车站的图形。UTL：自有模型，带格构桅杆、控制柜和彩色电缆（试用），铁轨旁是普通车站的部件。车站颜色仍可自由选择。需要重启。

