status-no-stop=没有火车站：把输出连到一个普通火车站
network=网络
network-tooltip=同一张地图上的独立运输网络。只有名称完全相同的车站才会协同工作 – 车库、加油站和清理站也是如此。\n留空 = 网络 "default"。区分大小写。
network-pick-tooltip=选择所属网络 – 这里列出本地图上已存在的所有网络。
networks-add-tooltip=选择一个地图上已存在且仍空闲的网络 – 它会成为本网络的伙伴。
networks-new=新建
links=已连接
