role-active_provider=主动供应站
role-active_provider-tooltip=像主动供货箱一样：该车站要被清空，即使没有需求。它的货物先送往需求站（优先于所有其他供应站），然后送往仓库直到其最高值，最后送往接收这些货物的清理站。阈值和最低装载仍然有效。
role-requester=需求站
role-requester-tooltip=请求货物：输入端的负值或下方的需求格子。
role-depot=车库
