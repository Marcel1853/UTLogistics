utl-station-combinator=Gehört zu einer normalen Haltestelle: den AUSGANG per Kabel (rot oder grün) mit der Haltestelle verbinden. Am EINGANG Kisten/Tanks bzw. Bedarf anschließen: positive Werte = Angebot, negative Werte = Bedarf. Rollen und Schwellen im Fenster einstellen.

