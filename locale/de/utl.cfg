[tips-and-tricks-item-description]
utl-overview=UTL schickt Züge automatisch: vom [font=default-bold]Depot[/font] zum [font=default-bold]Anbieter[/font], der hat, was ein [font=default-bold]Abnehmer[/font] braucht, und dann zum Abnehmer.\n\nSchnellstart:\n1. Depot: [item=utl-train-stop] mit Rolle „Depot“, Zug mit nur dem Depot im Fahrplan (leer, Automatik).\n2. Anbieter: Haltestelle mit Rolle „Anbieter“, Kisten per Kabel an die Haltestelle.\n3. Abnehmer: Rolle „Abnehmer“, im Fenster einen Anforderungs-Slot setzen.\n\nDein Fahrplan bleibt erhalten: UTL fügt nur temporäre Halte ein, Zuggruppen und Interrupts bleiben. Nach dem Entladen übernimmt der Zug direkt den nächsten Auftrag in der Nähe.
utl-train-stop=Die [item=utl-train-stop] ist Haltestelle und UTL-Station in einem. Kisten und Tanks per Kabel (rot oder grün) direkt an die Haltestelle anschließen: positive Werte werden angeboten, negative gebraucht. Rolle, Netzwerk und Werte stellst du im UTL-Panel links neben dem Haltestellenfenster ein.\n\nSie lässt sich direkt über eine normale Haltestelle bauen.
utl-combinator=Für vorhandene Bahnhöfe: [item=utl-station-combinator] neben eine normale Haltestelle stellen.\n\n[font=default-bold]Ausgang[/font] des Combinators per Kabel (rot oder grün) mit der Haltestelle verbinden – so weiß UTL, welche Haltestelle dazugehört.\n[font=default-bold]Eingang[/font]: die Kisten/Tanks.\n\nOhne Kabel am Ausgang meldet das Fenster „Keine Haltestelle“. Strom braucht der Combinator nicht.
utl-roles=Jede Station bekommt im Fenster eine Rolle:\n\n[font=default-bold]Anbieter[/font] – Waren mit positivem Wert werden abgeholt.\n[font=default-bold]Abnehmer[/font] – Waren mit negativem Wert oder aus den Anforderungs-Slots werden geliefert.\nAnbieter + Abnehmer – Puffer.\n[font=default-bold]Depot[/font] – hier warten freie Züge.\n[font=default-bold]Tankstelle[/font] – hier tanken Züge.\n[font=default-bold]Cleanup[/font] – hier werden Züge mit Restladung geleert.
utl-requests=Die Menge in einem Anforderungs-Slot ist ein [font=default-bold]Zielbestand[/font], keine Bestellung: geliefert wird „Ziel − vorhanden − schon unterwegs“.\n\nWillst du mehrere Züge gleichzeitig, stell einen höheren Zielbestand ein. Hat der Anbieter weitere Waren, die derselbe Abnehmer braucht, lädt der Zug sie mit, solange Platz ist. Flüssigkeiten fahren in Flüssigkeitswagen (Pumpen am Wagen, Tank per Kabel an die Station).\n\nMehrere Waren beim Anbieter: Eine gemischte Kiste reicht – während einer Lieferung stellt UTL die Wagen-Slots auf die bestellten Waren. Mit der Auftrags-Ausgabe lassen sich Greifarme und Pumpen zusätzlich nach dem laufenden Auftrag schalten (Forschung „UTL: Ladesteuerung“).\n\nIm Stationsfenster zeigt „Unterwegs“, was gerade geliefert oder abgeholt wird.
utl-values=Im Reiter „Werte“:\n• [font=default-bold]Min./max. Zuglänge[/font] – nur passende Züge (Loks mitgezählt, 0 = egal).\n• [font=default-bold]Max. Züge[/font] – höchstens so viele gleichzeitig (das Zuglimit der Haltestelle gilt auch).\n• [font=default-bold]Schwellen[/font] – angeboten bzw. geliefert wird erst ab dieser Menge (auch in Stacks).\n• [font=default-bold]Priorität[/font] – höher kommt zuerst dran.\n• [font=default-bold]Gesperrte Slots[/font] je Wagen.\n\nIn allen Zahlenfeldern kannst du rechnen, z. B. „4000*2“. ⟲ setzt einen Wert zurück.\n\n[font=default-bold]Netzwerk[/font]: Damit trennst du mehrere Transportnetze auf einer Karte. Nur Stationen mit genau demselben Namen arbeiten zusammen, und zwar in allen Rollen: ein Zug aus dem Depot „Erze“ beliefert nur Erz-Stationen, tankt nur an Erz-Tankstellen und wird nur an Erz-Cleanups geleert.\n\nLeer = Netzwerk „default“. Jedes Netz braucht also eigenes Depot, eigene Tankstelle und eigenes Cleanup. Steht ein Depot im falschen Netz, kommt die Warnung „kein freier Zug im Netzwerk …“, obwohl Züge dastehen.\n\nMit der Forschung „UTL: Netzverbund“ lassen sich Netze verbinden, damit sie sich helfen – mehr dazu im Eintrag „Netzwerke“.
utl-networks=Mit dem [font=default-bold]Netzwerk[/font] trennst du mehrere Transportnetze auf einer Karte – ohne die Gleise zu trennen. In der Szene fahren beide Züge auf [font=default-bold]demselben Rundkurs[/font]: „Erze“ und „Platten“, jedes Netz mit eigenem Depot, Anbieter und Abnehmer.\n\nZusammen arbeiten nur Stationen mit [font=default-bold]genau demselben Namen[/font]. Der Erz-Zug fährt deshalb an der Platten-Station vorbei, obwohl er direkt daran vorbeikommt.\n\nDas gilt in allen Rollen: Ein Zug tankt nur an einer Tankstelle seines Netzes und wird nur an einem Cleanup seines Netzes geleert. Jedes Netz braucht also eigenes Depot, eigene Tankstelle und eigenes Cleanup – es sei denn, du verbindest Netze.\n\nLeer = Netzwerk „default“. Wer nur ein großes Netz will, lässt das Feld überall leer.\n\nNetze lassen sich auch [font=default-bold]verbinden[/font], damit sie sich helfen – siehe „Netze verbinden“.
utl-depots=Freie Züge warten [font=default-bold]leer[/font] an Haltestellen mit der Rolle „Depot“ – jede Depot-Haltestelle braucht die Rolle, der Name allein reicht nicht.\n\nLandet ein Zug an einer gleichnamigen Haltestelle ohne Depot-Rolle, zieht er selbst in ein echtes Depot um.\n\nMin./max. Zuglänge am Depot: ein unpassender Zug zieht zu einem passenden Depot gleichen Namens um.
utl-fuel=Liegt eine Lok unter der Tank-Grenze (Map-Einstellung, Standard 40 %), fährt der Zug zuerst zur passenden [font=default-bold]Tankstelle[/font] und dann weiter zum Auftrag.\n\nGreifarme an der Tankstelle füllen die Loks. Der Zug wartet, bis alle Loks voll sind (höchstens 30 s).\n\nGibt es im Netzwerk keine Tankstelle, fahren knappe Züge normal – dann tankst du selbst (z. B. per Interrupt).
utl-cleanup=Ein Zug mit Restladung fährt zur passenden [font=default-bold]Cleanup[/font]-Station, wird dort geleert (Greifarme oder Pumpen) und nimmt danach den nächsten Auftrag an.\n\nWas eine Cleanup-Station annimmt, stellst du im Reiter „Werte“ ein: [virtual-signal=utl-cleanup-all-items] Alle Items, [virtual-signal=utl-cleanup-all-fluids] Alle Flüssigkeiten oder einzelne Waren. Einzeln eingetragene haben Vorrang; reicht eine Station nicht, fährt der Zug mehrere nacheinander an.\n\nOhne passendes Cleanup wartet der Zug im Depot, und es kommt eine Warnung.
utl-copy=[font=default-bold]Umschalt + Rechtsklick[/font] auf eine Station kopiert ihre UTL-Einstellungen, [font=default-bold]Umschalt + Linksklick[/font] auf eine andere fügt sie ein.\n\n[item=blueprint] Blaupausen, Kopieren/Einfügen (Strg + C / Strg + V) und Klonen nehmen die Einstellungen mit.
utl-manager=Der [font=default-bold]UTL-Manager[/font] zeigt dein ganzes Zugnetz auf einen Blick. Öffnen: Lok-Knopf in der Shortcut-Leiste oder [font=default-bold]Strg + Umschalt + U[/font] (oder [font=default-bold]Strg + Alt + U[/font]). Oben rechts: Lupe = Suche (filtert nach Namen), Pfeile = sofort auffrischen.\n\nDie Reiter:\n• [font=default-bold]Depots[/font] – links alle Depots mit freien/gesamten Zügen. Klick auf ein Depot zeigt rechts seine Züge mit Zusammensetzung, Zustand und Ladung; der Zug-Knopf folgt dem Zug auf der Karte.\n• [font=default-bold]Stationen[/font] – Rolle, Angebot (grün), Bedarf (rot), Unterwegs (blau = kommt, gelb = wird abgeholt) und Zahl der Züge. Hinter dem Namen steht das Netz, bei Verbindungen z. B. [Eisen ↔ Kupfer]. Klick auf den Namen zeigt die Station auf der Karte.\n• [font=default-bold]Netzwerke[/font] – alle Netze mit Verbindungen, siehe „Manager: Netzwerke“.\n• [font=default-bold]Inventar[/font] – alles, was angeboten, gebraucht und gefahren wird, siehe „Manager: Inventar“.\n• [font=default-bold]Verlauf[/font] – die letzten 100 Lieferungen mit Laufzeit; abgebrochene rot mit Grund.\n• [font=default-bold]Alarme[/font] – kein freier oder passender Zug, Restladung, Fehlmenge, kein Weg, Tanken fehlgeschlagen. Jede Gruppe lässt sich in den Spieler-Einstellungen abschalten.\n\nIn der Szene kommt ein Zug mit Restladung ins Depot, und es gibt kein Cleanup – so sieht die Warnung im Reiter „Alarme“ aus. Der Knopf daneben zeigt die Stelle auf der Karte.\n\nMehrere Planeten: Neben der Lupe wählst du, welcher Planet gezeigt wird – „Automatisch“ folgt dem Planeten, auf dem du bist oder den du dir ansiehst; „Alle Planeten“ zeigt alles. Gleichnamige Depots auf verschiedenen Planeten bleiben getrennt.\n\nIm Reiter „Einstellungen“ änderst du die Lade-Werte (Inaktivität beim Laden/Entladen, Fracht und/oder Inaktivität) ohne Hauptmenü – mit Teams für dein Team (ändern dürfen die Team-Leiter), sonst für alle (nur Admins).
utl-network-links=Netze [font=default-bold]anlegen[/font] kannst du so viele, wie du willst. Begrenzt ist nur das [font=default-bold]Verbinden[/font] – Forschung „UTL: Netzverbund I–III“ erlaubt 1, 2 oder 3 Partner je Netz.\n\nIn der Szene hat nur das Netz „Eisen“ einen Zug, Anbieter und Abnehmer stehen im Netz „Kupfer“ – erst fährt nichts. Im Stationsfenster des Depots, Kasten [font=default-bold]„Verbunden mit“[/font]:\n1. „Kupfer“ aus der Liste wählen – schon ist es Partner, und der Eisen-Zug fährt los.\n2. [font=default-bold]Neu[/font] klicken, einen Namen tippen („Kohle“), ✓ – das Netz ist angelegt und gleich verbunden.\nJeder Partner steht dann als Knopf da; ein Klick löst die Verbindung. Die Zahl (2 / 2) zeigt belegte und erlaubte Partner, der Tooltip nennt die Forschung für mehr.\n\nSo funktioniert ein Verbund – ein [font=default-bold]Stern[/font]:\n• Zentrum und Partner helfen sich gegenseitig mit Zügen, Depots, Tankstellen und Cleanups.\n• Partner helfen sich [font=default-bold]nicht[/font] untereinander: Ein Kupfer-Zug fährt nie für „Kohle“.\n• Ein Partner gehört zu keinem weiteren Netz und bekommt keine eigenen Partner.\n• Die Verbindung gilt für das ganze Netz auf dieser Oberfläche, nicht nur für die Station. Auf Vulcanus bildest du eigene Sterne.
utl-manager-networks=Der Reiter [font=default-bold]Netzwerke[/font] im Manager: links alle Netze (bei mehreren Planeten mit Oberfläche) mit Zahl der Stationen, freien Züge und laufenden Lieferungen.\n\nKlick auf ein Netz zeigt rechts:\n• oben den Kasten [font=default-bold]„Verbunden mit“[/font] – Partner aus der Liste wählen oder einen neuen Namen eintragen und ✓; ein Klick auf einen Partner-Knopf löst die Verbindung. Das geht genauso wie im Stationsfenster.\n• darunter alle Stationen des Sterns mit Rolle und Netz; Stationen der Partner stehen grau.\n\nIst das gewählte Netz selbst Partner, zeigt der Knopf sein Zentrum; ein Klick tritt aus dem Stern aus.\n\nIm Reiter [font=default-bold]Stationen[/font] siehst du die Verbindung hinter dem Namen: [Eisen ↔ Kupfer] beim Zentrum, [Kupfer → Eisen] beim Partner.
utl-manager-inventory=Der Reiter [font=default-bold]Inventar[/font] im Manager zeigt links alles im Netz als Symbole: [font=default-bold]Angebot[/font] (grün), [font=default-bold]Bedarf[/font] (rot) und [font=default-bold]Unterwegs[/font] (blau).\n\n[font=default-bold]Klick auf eine Ware[/font] – rechts erscheint:\n• die Summen für Angebot, Bedarf und Unterwegs,\n• alle Stationen, die diese Ware haben oder brauchen (Klick auf den Namen zeigt sie auf der Karte),\n• alle Züge, die sie gerade fahren, mit Start und Ziel.\n\nNoch ein Klick auf dieselbe Ware schließt die Ansicht wieder. Der Reiter frischt sich nicht von selbst auf, damit die Liste beim Lesen nicht springt – dafür oben die Pfeile.

