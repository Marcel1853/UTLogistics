[mod-setting-description]
utl-own-item-group=Schienen, Hochbahn, Signale, Haltestellen, Loks und Wagen – auch aus anderen Mods – bekommen eine eigene Registerkarte im Crafting-Menü.
utl-heartbeat-interval=Alle wie viele Ticks UTL arbeitet. Pro Takt wird nur ein kleiner, fester Teil der Arbeit erledigt. Höher = weniger CPU, aber langsamere Reaktion.
utl-debug-log=Schreibt zusätzliche Meldungen in factorio-current.log. Nur zur Fehlersuche einschalten.
utl-station-batch-size=Wie viele Stationen pro Takt gelesen werden. Alle Stationen kommen reihum dran.
utl-max-deliveries-per-cycle=Wie viele Züge der Dispatcher pro Durchlauf (alle 3 Takte) höchstens losschickt. Kleiner = gleichmäßigere CPU-Last.
utl-station-output=Neben jeder Station steht ein kleiner Ausgang, an dem die laufenden Aufträge als Signale anliegen: beim Anbieter positiv (so viel soll geladen werden), beim Abnehmer negativ (so viel kommt an). Damit schaltest du Filter-Greifarme, Pumpen und Anzeigen. Nicht an den Eingang der Station kabeln – das liefe in den Bestand zurück.
utl-wagon-filters=Während einer Lieferung stellt UTL die Slots der Güterwagen auf die Waren des Auftrags und sperrt den Rest. So kann ein Anbieter mehrere Waren in einer Kiste haben; gewöhnliche Greifarme laden trotzdem nur das Bestellte. Wagen, an denen du selbst Filter gesetzt hast, bleiben unberührt. Für Flüssigkeiten wirkt das nicht.
utl-chaining=Ein Zug, der gerade entladen hat oder von einer Tank-/Cleanup-Station kommt, übernimmt sofort eine passende Lieferung (bevorzugt mit einem Anbieter in seiner Nähe), statt erst ins Depot zu fahren. Spart Leerfahrten.
utl-fuel-threshold=Fällt eine Lok eines Zugs unter diesen Füllstand, fährt der Zug vor dem nächsten Auftrag bzw. aus dem Depot zur passenden UTL-Tankstelle (gleiches Netzwerk, Zuglänge im Bereich der Tankstelle). 0 = aus.
utl-alert-no-train-minutes=Die Warnung „kein passender Zug“ kommt erst, wenn eine Anfrage so lange unbedient ist. Solange ein Zug mit der Ware zur Station unterwegs ist, gilt sie als bedient. 0 = sofort.
utl-alerts-no-train=Warnen, wenn eine Station etwas braucht und ein Anbieter da ist, aber kein freier oder kein passender Zug (Netzwerk, Zuglänge).
utl-alerts-cargo=Warnen, wenn ein Zug mit Restladung im Depot steht, beim Abnehmer nicht leer wurde oder beim Anbieter weniger geladen hat als bestellt.
utl-alerts-trains=Warnen, wenn ein Lieferzug keinen Weg findet, kein freies Depot gefunden wird, das Tanken nicht geklappt hat oder eine Lieferung abgebrochen wurde.
utl-default-provide-threshold=Startwert für neue Stationen.
utl-default-request-threshold=Startwert für neue Stationen.

[utl-command]
status-help=Zeigt den Zustand von Unified Train Logistics.
status=UTL __1__ · Takt: __2__ · Heartbeats: __3__ · Stationen: __4__ · Züge im Depot: __5__ · Lieferungen: __6__
status-sleeping=schläft (keine Arbeit)

