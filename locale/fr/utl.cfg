status-ok=Prête · Arrêt : __1__
status-idle=Aucune tâche · Arrêt : __1__
status-no-stop=Aucun arrêt : reliez la sortie à un arrêt de train normal
network=Réseau
network-tooltip=Réseaux de transport séparés sur une même carte. Seules les stations portant exactement le même nom travaillent ensemble – y compris dépôt, ravitaillement et nettoyage.\nVide = réseau "default". Les majuscules comptent.
network-pick-tooltip=Choisissez le réseau d'origine – la liste contient tous les réseaux qui existent déjà sur cette carte.
networks-add-tooltip=Choisissez un réseau qui existe déjà sur la carte et qui est encore libre – il devient partenaire de ce réseau.
networks-new=Nouveau
links=Lié avec
links-count=Lié avec (__1__ / __2__)
links-tooltip=Les réseaux liés s'entraident : trains, dépôts, stations de ravitaillement et de nettoyage de l'un servent aussi l'autre. Le réseau d'ici est le centre, les réseaux liés sont des partenaires. Les partenaires ne s'entraident pas entre eux et n'appartiennent à aucun autre groupe de liaison. S'applique à tout le réseau sur cette surface.
link-center-chip=__1__ (centre)  ×
link-leave-tooltip=Quitter le groupe de liaison de "__1__".
link-own-partner=Ce réseau est partenaire de "__1__" – les partenaires ne peuvent pas avoir leurs propres partenaires.
link-self=Un réseau ne peut pas être lié à lui-même.
link-center-is-partner=Ce réseau est déjà partenaire d'un autre réseau et ne peut pas avoir ses propres partenaires.
link-partner-taken="__1__" est déjà lié à un autre réseau.
link-partner-is-center="__1__" a déjà ses propres partenaires et ne peut pas devenir partenaire.
link-limit=La recherche ne permet pas encore plus de partenaires.
networks-limit=Pas plus de __1__ partenaires possibles.
networks-limit-research=__1__ partenaires atteints – davantage avec la recherche "__2__".
research-needed=Nécessite la recherche "__1__".
networks-new-tooltip=Créer un réseau avec un nouveau nom et le lier tout de suite comme partenaire.
elevator-network=Livrer par l'ascenseur spatial
elevator-network-tooltip=Le réseau "__1__" peut livrer des marchandises par des ascenseurs spatiaux terminés et alimentés entre planète et orbite. S'applique au réseau du même nom des deux côtés. Par défaut : désactivé.
elevator-none-here=Il n'y a pas encore d'ascenseur spatial sur cette surface.
networks-add-none=Aucun réseau libre – créez-en un avec "Nouveau".
networks-chip-tooltip=Supprimer la liaison avec "__1__".
network-rename-tooltip=Renommer le réseau d'origine ou en saisir un nouveau.
network-name-tooltip=Saisissez un nom et appuyez sur Entrée. Vide = réseau "default".
cancel=Annuler
role-provider=Fournisseur
role-provider-tooltip=Propose les marchandises positives à l'entrée.
role-active_provider=Fournisseur actif
role-active_provider-tooltip=Comme le coffre fournisseur actif : la station doit être vidée, même sans demande. Ses marchandises vont d'abord aux demandeurs (avant tous les autres fournisseurs), puis aux entrepôts jusqu'à leur maximum, enfin aux stations de nettoyage qui acceptent ces marchandises. Seuils et chargement minimal restent valables.
