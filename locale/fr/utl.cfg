readout-mode-shortage=Manque
readout-mode-shortage-tooltip=Par marchandise, ce dont les demandeurs ont besoin et que personne ne propose dans le réseau – par exemple à relier à une plateforme d'atterrissage de cargaison (définir les demandes) pour le faire venir de l'orbite.
readout-mode-trains=Trains
readout-mode-trains-tooltip=Trains au total, libres au dépôt, en route, livraisons en cours, peu de carburant, sans chemin, ainsi que les trains de réseaux liés qui aident ici et les trains propres qui travaillent dans d'autres réseaux – sous forme de signaux UTL. Sont comptés les trains dont le dépôt d'origine est dans ce réseau.
readout-transit=Compter les marchandises en route
readout-transit-tooltip=Ajouter les marchandises qui sont actuellement dans des trains en route vers les demandeurs.
readout-output=Émet actuellement
readout-hint=Les signaux sont sur le combinateur. Ce qu'ils font (lampe, affichage, plateforme d'atterrissage de cargaison …) dépend de votre propre câblage.
readout-status-ok=__1__ signaux – réseau "__2__"
readout-status-empty=Rien à émettre – le réseau "__1__" n'a aucune valeur pour cela en ce moment.
