value-min_train_length-tooltip=Seulement les trains d'au moins autant de véhicules (locomotives comprises). 0 = tous.\nDépôt : un train plus court va dans un dépôt adapté du même nom.
value-max_train_length=Longueur max. du train
value-max_train_length-tooltip=Seulement les trains d'au plus autant de véhicules (locomotives comprises). 0 = tous.\nDépôt : un train plus long va dans un dépôt adapté du même nom.
value-max_trains=Trains max.
value-max_trains-tooltip=Au plus autant de trains ici ou en route en même temps – chez fournisseurs, demandeurs, entrepôts, ravitaillements, nettoyages et dépôts. Une limite de trains sur l'arrêt s'applique aussi. 0 = illimité (dépôt : un train).
