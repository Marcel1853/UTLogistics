[technology-description]
utl-network-combinator=Débloque le combinateur de réseau UTL : il émet sous forme de signaux le stock, le stock des entrepôts, la demande, le manque ou le nombre de trains d'un réseau.
utl-loading-control=Filtres des wagons au chargement et sortie des commandes à chaque arrêt : les trains ne prennent que ce qui a été commandé, et bras robotisés et pompes peuvent être commandés par la commande en cours.
utl-networks-1=Un réseau peut avoir un partenaire. Les deux s'entraident alors avec trains, dépôts, stations de ravitaillement et de nettoyage.
utl-networks-2=Un réseau peut avoir deux partenaires.
utl-networks-3=Un réseau peut avoir trois partenaires.
utl-train-logistics=Débloque l'arrêt de train UTL et le combinateur de station UTL : trafic ferroviaire automatique entre fournisseurs et demandeurs. Le port UTL (Cargo Ships) vient avec "Transport fluvial automatisé".
utl-storage=Stations d'entrepôt – pour les stations qui reçoivent et livrent.
utl-storage-2=Plus de marchandises différentes par station d'entrepôt.
utl-storage-3=Plus de marchandises différentes par station d'entrepôt.
utl-storage-4=Plus de marchandises différentes par station d'entrepôt.

