value-output-tooltip=La petite sortie à côté de l'arrêt porte les commandes en cours sous forme de signaux : marchandises à charger ici en positif, marchandises arrivant ici en négatif, plus le nombre de trains de livraison en route vers ici. Pendant qu'un train de livraison est ici, s'ajoutent numéro du train, longueur du train et nombre de wagons. Désactivé : la sortie disparaît.
value-depot-output=Sortie du dépôt
value-depot-output-tooltip=La petite sortie verte à côté du dépôt : pendant qu'un train est ici, elle porte numéro du train, longueur, locomotives, wagons et "peu de carburant" (1 = devrait se ravitailler). Toujours : trains libres dans les dépôts de ce nom et trains en route vers ici. Désactivé : la sortie disparaît.
value-filter_load=Ne charger que la commande en cours
value-filter_load-tooltip=UTL règle les emplacements des wagons sur les marchandises de la livraison en cours et verrouille le reste – un coffre avec plusieurs marchandises et un bras robotisé ordinaire suffisent alors. Désactivé : les wagons restent libres comme avant. Ne s'applique pas aux fluides.
value-request_threshold=Seuil de demande
