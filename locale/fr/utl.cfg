[tips-and-tricks-item-description]
utl-network-combinator=Le [item=utl-network-combinator] [font=default-bold]combinateur de réseau[/font] émet l'état d'un réseau UTL sous forme de signaux. Dans sa fenêtre, vous choisissez le réseau (avec ses réseaux liés si vous le souhaitez) et ce qu'il émet :\n• [font=default-bold]Stock[/font] – par marchandise, ce que proposent les fournisseurs du réseau,\n• [font=default-bold]Stock des entrepôts[/font] – ce qui est stocké dans les stations d'entrepôt,\n• [font=default-bold]Demande[/font] – ce que demandent les demandeurs,\n• [font=default-bold]Manque[/font] – ce dont les demandeurs ont besoin et que personne ne propose,\n• [font=default-bold]Trains[/font] – total, libres, en route, livraisons, peu de carburant, sans chemin ; et si des trains de réseaux liés aident ici ou si des trains propres travaillent ailleurs.\n\nDans la scène, le demandeur veut du fer et du cuivre. Le train apporte du fer, personne ne propose de cuivre – donc en mode "Manque", le combinateur n'émet que du cuivre, et la lampe s'allume.\n\nCe que font les signaux dépend de votre câblage : une lampe comme dans la scène, un affichage – ou dans Space Age le [font=default-bold]manque[/font] vers une plateforme d'atterrissage de cargaison ("définir les demandes") pour qu'elle fasse venir de l'orbite ce qui manque. Débloqué par "UTL : Combinateur de réseau".
utl-overview=UTL répartit les trains automatiquement : du [font=default-bold]dépôt[/font] vers un [font=default-bold]fournisseur[/font] qui a ce dont un [font=default-bold]demandeur[/font] a besoin, puis vers le demandeur.\n\nDémarrage rapide :\n1. Dépôt : [item=utl-train-stop] avec le rôle "Dépôt", un train avec seulement le dépôt dans son horaire (vide, automatique).\n2. Fournisseur : arrêt avec le rôle "Fournisseur", coffres reliés à l'arrêt par fil.\n3. Demandeur : rôle "Demandeur", remplissez un emplacement de demande dans la fenêtre.\n\nVotre horaire est conservé : UTL n'insère que des arrêts temporaires, les groupes de trains et les interruptions restent. Après le déchargement, le train prend tout de suite la commande suivante à proximité.
utl-train-stop=Le [item=utl-train-stop] est à la fois un arrêt de train et une station UTL. Reliez coffres et réservoirs (rouge ou vert) directement à l'arrêt : les valeurs positives sont proposées, les négatives demandées. Réglez rôle, réseau et valeurs dans le panneau UTL à gauche de la fenêtre de l'arrêt.\n\nIl peut être construit directement sur un arrêt de train normal.
utl-combinator=Pour des stations existantes : placez un [item=utl-station-combinator] à côté d'un arrêt de train normal.\n\nReliez la [font=default-bold]sortie[/font] du combinateur (rouge ou vert) à l'arrêt – ainsi UTL sait quel arrêt lui appartient.\n[font=default-bold]Entrée[/font] : les coffres/réservoirs.\n\nSans fil sur la sortie, la fenêtre affiche "Aucun arrêt". Le combinateur n'a pas besoin d'électricité.
utl-roles=Chaque station reçoit un rôle dans sa fenêtre :\n\n[font=default-bold]Fournisseur[/font] – les marchandises à valeur positive sont enlevées.\n[font=default-bold]Demandeur[/font] – les marchandises à valeur négative ou issues des emplacements de demande sont livrées.\nFournisseur + demandeur – tampon.\n[font=default-bold]Dépôt[/font] – les trains libres attendent ici.\n[font=default-bold]Station de ravitaillement[/font] – les trains font le plein ici.\n[font=default-bold]Nettoyage[/font] – les trains avec une cargaison restante sont vidés ici.\n[font=default-bold]Entrepôt[/font] – reçoit et livre, avec un stock minimal et maximal par marchandise (avancé, recherche "UTL : Entrepôt").
utl-requests=La quantité d'un emplacement de demande est un [font=default-bold]stock cible[/font], pas une commande : UTL livre "cible − en stock − déjà en route".\n\nPour plusieurs trains à la fois, fixez un stock cible plus élevé. Si le fournisseur a d'autres marchandises dont le même demandeur a besoin, le train les charge aussi tant qu'il reste de la place. Les fluides voyagent dans des wagons-citernes (pompes au wagon, réservoir relié à la station).\n\nPlusieurs marchandises chez un fournisseur : un coffre mixte suffit – pendant une livraison, UTL filtre les emplacements du wagon sur les marchandises commandées. Avec la sortie des commandes, vous pouvez aussi commander bras robotisés et pompes selon la commande en cours (recherche \"UTL : Contrôle du chargement\").\n\n"En route" dans la fenêtre de la station montre ce qui est livré ou enlevé en ce moment.
utl-values=Dans l'onglet "Valeurs" :\n• [font=default-bold]Longueur min./max. du train[/font] – seulement les trains adaptés (les locomotives comptent, 0 = tous).\n• [font=default-bold]Trains max.[/font] – au plus autant à la fois (la limite de trains de l'arrêt s'applique aussi).\n• [font=default-bold]Seuils[/font] – les marchandises ne sont proposées ou livrées qu'à partir de cette quantité (aussi en piles).\n• [font=default-bold]Priorité[/font] – la plus haute passe d'abord.\n• [font=default-bold]Emplacements verrouillés[/font] par wagon.\n\nVous pouvez calculer dans chaque champ numérique, par exemple "4000*2". ⟲ rétablit une valeur.\n\n[font=default-bold]Réseau[/font] : sépare plusieurs réseaux de transport sur une même carte. Seules les stations portant exactement le même nom travaillent ensemble, dans tous les rôles : un train du dépôt "Minerai" ne sert que les stations de minerai, ne fait le plein qu'aux stations de ravitaillement de minerai et n'est vidé qu'aux nettoyages de minerai.\n\nVide = réseau "default". Chaque réseau a donc besoin de son propre dépôt, de sa station de ravitaillement et de son nettoyage. Un dépôt dans le mauvais réseau provoque l'alerte "aucun train libre dans le réseau …" alors que des trains attendent.\n\nAvec la recherche "UTL : Liaisons de réseaux", les réseaux peuvent être liés pour s'entraider – voir l'entrée "Réseaux".
utl-networks=Le [font=default-bold]réseau[/font] sépare plusieurs systèmes de transport sur une même carte – sans séparer les rails. Dans la scène, les deux trains roulent sur [font=default-bold]la même boucle[/font] : "Erze" (minerai) et "Platten" (plaques), chaque réseau avec son propre dépôt, fournisseur et demandeur.\n\nSeules les stations portant [font=default-bold]exactement le même nom[/font] travaillent ensemble. C'est pourquoi le train de minerai passe tout droit devant la station de plaques.\n\nCela vaut pour tous les rôles : un train ne fait le plein qu'à une station de ravitaillement de son propre réseau et n'est vidé qu'à un nettoyage de son propre réseau. Chaque réseau a donc besoin de son propre dépôt, de sa station de ravitaillement et de son nettoyage – à moins que vous ne liiez des réseaux.\n\nVide = réseau "default". Laissez le champ vide partout si vous ne voulez qu'un seul grand réseau.\n\nLes réseaux peuvent aussi être [font=default-bold]liés[/font] pour s'entraider – voir \"Lier des réseaux\".
utl-depots=Les trains libres attendent [font=default-bold]vides[/font] aux arrêts ayant le rôle "Dépôt" – chaque arrêt de dépôt a besoin du rôle, le nom seul ne suffit pas.\n\nSi un train se retrouve à un arrêt portant le nom d'un dépôt mais sans le rôle, il rejoint de lui-même un vrai dépôt.\n\nLongueur min./max. du train à un dépôt : un train qui ne convient pas rejoint un dépôt adapté du même nom.
utl-fuel=Si une locomotive est sous la limite de ravitaillement (paramètre de carte, 40 % par défaut), le train passe d'abord par une [font=default-bold]station de ravitaillement[/font] adaptée, puis poursuit sa commande.\n\nDes bras robotisés à la station de ravitaillement remplissent les locomotives. Le train attend que toutes les locomotives soient pleines (30 s max.).\n\nSans aucune station de ravitaillement dans le réseau, les trains à court de carburant roulent normalement – c'est alors à vous de faire le plein (par exemple avec une interruption).
utl-cleanup=Un train avec une cargaison restante va à une station de [font=default-bold]nettoyage[/font] adaptée, y est vidé (bras robotisés ou pompes), puis prend la commande suivante.\n\nCe qu'accepte une station de nettoyage se règle dans l'onglet "Valeurs" : [virtual-signal=utl-cleanup-all-items] tous les objets, [virtual-signal=utl-cleanup-all-fluids] tous les fluides ou des marchandises individuelles. Les marchandises indiquées une par une passent d'abord ; si une station ne suffit pas, le train en visite plusieurs à la suite.\n\nSans nettoyage adapté, le train attend au dépôt et une alerte s'affiche.
utl-cleanup-return=Ce qui finit dans un nettoyage n'a pas à y rester. Cochez [font=default-bold]Proposer à nouveau le contenu[/font] sur une station de nettoyage et elle propose le contenu de ses coffres au réseau – comme un fournisseur. Les coffres doivent pour cela être reliés à l'arrêt.\n\nLe rang à côté décide quand le nettoyage est utilisé : [font=default-bold]Seulement en réserve[/font] (les fournisseurs normaux d'abord), [font=default-bold]Comme tout fournisseur[/font] ou [font=default-bold]Vider en premier[/font].\n\nLes marchandises restées chez un demandeur ne lui sont ramenées par aucun nettoyage pendant 5 minutes – sinon elles feraient des allers-retours. Désactivable pour toute la carte : paramètre de carte « Le nettoyage peut proposer à nouveau son contenu ».\n\n[font=default-bold]Monté comme dans la scène :[/font] bras de déchargement (wagon → coffre), bras de transfert (coffre → coffre), bras de chargement (coffre → wagon). La sortie des commandes les pilote : bras de chargement à [virtual-signal=utl-loading] > 0, bras de déchargement à [virtual-signal=utl-loading] = 0 – une cargaison restante n'a pas de commande et est ainsi déchargée. Le bras de chargement a « Définir les filtres » activé et ne prend que les marchandises commandées : le train apporte du fer et du cuivre, seul le cuivre est enlevé.
utl-storage=Un [font=default-bold]entrepôt[/font] reçoit et livre. Par marchandise, vous fixez un stock minimal et un stock maximal :\n• sous le minimum, il demande – jusqu'au maximum,\n• ce qui dépasse le minimum, il le propose comme un fournisseur normal – si l'entrepôt est plus proche du demandeur, c'est lui qui livre.\n\nAinsi un entrepôt garde du stock près des consommateurs. Deux entrepôts ne se renvoient jamais les marchandises : seul ce qui dépasse le minimum est proposé, et on ne demande que sous le minimum. Avec « Accepter la cargaison restante », il prend aussi les restes de cargaison.\n\nUn entrepôt a besoin de bras robotisés dans les deux sens : les bras de déchargement mettent les marchandises dans des coffres, les bras de transfert les passent dans les coffres de chargement, les bras de chargement les mettent dans le train. La sortie des commandes les pilote – charger tant que [virtual-signal=utl-loading] > 0, sinon décharger. Débloqué par « UTL : Entrepôt », désactivable avec le paramètre de carte « Autoriser les stations d'entrepôt ».
utl-copy=[font=default-bold]Maj + clic droit[/font] sur une station copie ses paramètres UTL, [font=default-bold]Maj + clic gauche[/font] sur une autre les colle.\n\n[item=blueprint] Les plans, le copier/coller (Ctrl + C / Ctrl + V) et le clonage conservent les paramètres.
utl-manager=Le [font=default-bold]gestionnaire UTL[/font] montre tout votre réseau ferroviaire d'un coup d'œil. Ouvrez-le avec le bouton locomotive de la barre de raccourcis ou [font=default-bold]Ctrl + Maj + U[/font] (ou [font=default-bold]Ctrl + Alt + U[/font]). En haut à droite : loupe = recherche (filtre par nom), flèches = actualiser maintenant.\n\nLes onglets :\n• [font=default-bold]Dépôts[/font] – à gauche chaque dépôt avec ses trains libres/total. Cliquez sur un dépôt pour voir ses trains à droite avec composition, état et cargaison ; le bouton du train suit le train sur la carte.\n• [font=default-bold]Stations[/font] – rôle, offre (vert), demande (rouge), en route (bleu = arrive, jaune = en cours d'enlèvement) et nombre de trains. Le réseau figure après le nom, avec les liaisons, par exemple [Fer ↔ Cuivre]. Cliquez sur le nom pour voir la station sur la carte.\n• [font=default-bold]Réseaux[/font] – chaque réseau avec ses liaisons, voir "Gestionnaire : Réseaux".\n• [font=default-bold]Inventaire[/font] – tout ce qui est proposé, demandé et en mouvement, voir "Gestionnaire : Inventaire".\n• [font=default-bold]Historique[/font] – les 100 dernières livraisons avec leur durée ; les annulées en rouge avec la raison.\n• [font=default-bold]Alertes[/font] – aucun train libre ou adapté, cargaison restante, cargaison manquante, aucun chemin, ravitaillement échoué. Chaque groupe peut être désactivé dans les paramètres par joueur.\n\nDans la scène, un train avec une cargaison restante arrive au dépôt et il n'y a pas de nettoyage – voici à quoi ressemble l'alerte dans l'onglet \"Alertes\". Le bouton à côté montre l'endroit sur la carte.\n\nPlusieurs planètes : à côté de la loupe, vous choisissez quelle planète est affichée – \"Automatique\" suit la planète où vous êtes ou que vous regardez ; \"Toutes les planètes\" montre tout. Les dépôts du même nom sur des planètes différentes restent séparés.\n\nDans l'onglet "Paramètres", vous modifiez les valeurs de chargement (inactivité au chargement/déchargement, cargaison et/ou inactivité) sans passer par le menu principal – par équipe s'il y a des équipes (les chefs les modifient), sinon pour tous (administrateurs uniquement).
utl-network-links=Vous pouvez [font=default-bold]créer[/font] autant de réseaux que vous voulez. Seule la [font=default-bold]liaison[/font] est limitée – la recherche "UTL : Liaisons de réseaux I–III" permet 1, 2 ou 3 partenaires par réseau.\n\nDans la scène, seul le réseau "Eisen" (fer) a un train ; fournisseur et demandeur sont dans le réseau "Kupfer" (cuivre) – au début rien ne bouge. Dans la fenêtre de la station du dépôt, cadre [font=default-bold]"Lié avec"[/font] :\n1. Choisissez "Kupfer" dans la liste – il devient tout de suite partenaire, et le train de fer part.\n2. Cliquez sur [font=default-bold]Nouveau[/font], saisissez un nom ("Kohle", charbon), ✓ – le réseau est créé et lié d'un coup.\nChaque partenaire s'affiche ensuite comme un bouton ; un clic supprime la liaison. Le compteur (2 / 2) montre les partenaires utilisés et autorisés, l'info-bulle cite la recherche pour en avoir plus.\n\nComment fonctionne une liaison – une [font=default-bold]étoile[/font] :\n• Centre et partenaire s'entraident avec trains, dépôts, stations de ravitaillement et de nettoyage.\n• Les partenaires ne s'entraident [font=default-bold]pas[/font] entre eux : un train de cuivre ne roule jamais pour "Kohle".\n• Un partenaire n'appartient à aucun autre réseau et n'a pas de partenaires propres.\n• La liaison vaut pour tout le réseau sur cette surface, pas seulement pour la station. Sur Vulcanus, vous construisez des étoiles séparées.
utl-manager-networks=L'onglet [font=default-bold]Réseaux[/font] du gestionnaire : à gauche chaque réseau (avec la surface quand il y a plusieurs planètes) avec son nombre de stations, de trains libres et de livraisons en cours.\n\nCliquez sur un réseau pour voir à droite :\n• en haut le cadre [font=default-bold]"Lié avec"[/font] – choisissez un partenaire dans la liste ou saisissez un nouveau nom et ✓ ; un clic sur un bouton de partenaire supprime la liaison. Cela fonctionne comme dans la fenêtre de la station.\n• en dessous chaque station de l'étoile avec son rôle et son réseau ; les stations partenaires sont grises.\n\nSi le réseau choisi est lui-même un partenaire, le bouton montre son centre ; un clic quitte l'étoile.\n\nL'onglet [font=default-bold]Stations[/font] montre la liaison après le nom : [Fer ↔ Cuivre] pour le centre, [Cuivre → Fer] pour un partenaire.
utl-manager-inventory=L'onglet [font=default-bold]Inventaire[/font] du gestionnaire montre tout le réseau sous forme d'icônes à gauche : [font=default-bold]offre[/font] (vert), [font=default-bold]demande[/font] (rouge) et [font=default-bold]en route[/font] (bleu).\n\n[font=default-bold]Cliquez sur une marchandise[/font] – à droite apparaissent :\n• les totaux pour l'offre, la demande et en route,\n• chaque station qui l'a ou en a besoin (cliquez sur le nom pour la voir sur la carte),\n• chaque train qui la transporte en ce moment, avec départ et destination.\n\nCliquez à nouveau sur la même marchandise pour fermer la vue. L'onglet ne s'actualise pas tout seul pour que la liste ne saute pas pendant votre lecture – utilisez les flèches en haut.
utl-news=Le plus important de la [font=default-bold]0.0.28[/font] :\n\n• UTL Manager : un peu plus grand, et vous réglez sa taille vous-même – Paramètres → Paramètres des mods → Par joueur, « Gestionnaire UTL : largeur » et « hauteur ».\n• Le bouton de filtre dans la barre de titre est plus grand et porte l'étiquette « Filtre ».\n• Paramètres et Inventaire sont organisés en cadres ; les titres de colonnes ne sont plus coupés.\n\nNouveau dans 0.0.27 : filtre de marchandise dans l'UTL Manager ; les wagons-citernes de meilleure qualité sont remplis entièrement.\n\nToutes les modifications : portail des mods, onglet « Changelog ».

