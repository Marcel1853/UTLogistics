[entity-description]
utl-station-settings=Stockage invisible des paramètres de la station (demandes, rôle, valeurs) pour que les paramètres de plan fonctionnent. UTL le construit lui-même – aucun robot ni objet nécessaire.
utl-port=Port de Cargo Ships avec logique UTL intégrée – comme l'arrêt de train UTL, mais pour les navires. Reliez coffres/réservoirs directement au port : valeurs positives = offre, négatives = demande.
utl-network-combinator=Émet l'état d'un réseau UTL sous forme de signaux : stock, stock des entrepôts, demande, manque ou nombre de trains. Réglez le réseau et le mode dans sa fenêtre. Ce que vous faites des signaux (lampe, affichage, plateforme d'atterrissage de cargaison …), vous le câblez vous-même.
utl-train-stop=Arrêt de train avec logique UTL intégrée. Reliez coffres/réservoirs directement à l'arrêt : valeurs positives = offre, négatives = demande. Peut être posé directement sur des arrêts normaux.
utl-station-combinator=Accompagne un arrêt de train normal : reliez sa SORTIE (rouge ou vert) à l'arrêt. Reliez coffres/réservoirs ou la demande à l'ENTRÉE : valeurs positives = offre, valeurs négatives = demande. Rôles et seuils se règlent dans la fenêtre.

