storage-min-tooltip=Si le stock passe en dessous, l'entrepôt demande – jusqu'au maximum.
storage-max=Maximum
storage-max-tooltip=Il se remplit jusqu'ici quand l'entrepôt passe sous le minimum.
storage-leftover=Accepter la cargaison restante
storage-leftover-tooltip=Les trains avec une cargaison restante peuvent la déposer ici, comme à un nettoyage. Les marchandises se règlent dans la section nettoyage.
