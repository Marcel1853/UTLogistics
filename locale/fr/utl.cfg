[mod-setting-description]
utl-status-color-incoming=Couleur de cet état sur le panneau d'affichage de la station UTL (relié par fil) et sur les lampes de l'arrêt.
utl-status-color-stopped=Couleur de cet état sur le panneau d'affichage de la station UTL (relié par fil) et sur les lampes de l'arrêt.
utl-status-color-depot=Couleur de cet état sur le panneau d'affichage de la station UTL (relié par fil) et sur les lampes de l'arrêt.
utl-status-color-idle=Couleur de cet état sur le panneau d'affichage de la station UTL (relié par fil) et sur les lampes de l'arrêt.
utl-status-color-off=Couleur de cet état sur le panneau d'affichage de la station UTL (relié par fil) et sur les lampes de l'arrêt.
utl-leader-inactive-days=Un chef d'équipe qui ne s'est pas connecté depuis autant de jours (temps de jeu, serveur en marche) perd ses droits de chef. S'il ne reste aucun chef, le membre actif le plus ancien prend le relais. 0 = jamais.
utl-timeout-mode="Cargaison ou inactivité" (par défaut) : le train part dès qu'il est plein ou vide, ou que rien n'a changé pendant ce temps – avec ce qu'il a, même si le coffre est vide. "Cargaison et inactivité" : il ne part que lorsqu'il est plein ou vide et que rien n'a changé pendant ce temps. Chaque équipe peut le régler elle-même dans le gestionnaire UTL.
utl-top-up=Si la demande augmente pendant qu'un train est encore en route vers le fournisseur ou y charge, la quantité est ajoutée à la liste de chargement en cours au lieu de lancer un deuxième trajet. Il faut que le même fournisseur ait la marchandise et que le train ait de la place. Économise des trains, mais le train reste plus longtemps au fournisseur. Par défaut : désactivé.
utl-multi-pickup=Si un fournisseur n'a pas assez pour la demande, le train prend le reste chez un deuxième fournisseur du même réseau – un trajet avec deux arrêts de chargement au lieu de deux trajets. Même surface uniquement, au plus deux fournisseurs. Par défaut : désactivé.
utl-min-load-percent=Un train ne part que si au moins ce pourcentage de sa capacité est rempli – toutes les marchandises que le même fournisseur remet à ce demandeur comptent. Plus de trajets pour de petits restes (par exemple quand il ne manque que 1000 à un demandeur) ; la demande attend d'avoir assez. 0 = désactivé. Par défaut : 0.
utl-multi-pickup-detour=Le deuxième fournisseur n'est visité que si le détour représente au plus ce pourcentage de la distance directe du premier fournisseur au demandeur (à vol d'oiseau). S'il est plus loin, un deuxième train part. 0 = tout détour est permis. Par défaut : 50.
utl-cleanup-offer=Permet aux stations de nettoyage de proposer à nouveau leur contenu au réseau – activé par station avec la case « Proposer à nouveau le contenu » (désactivée par défaut). Désactivé ici = désactivé sur toute la carte.
utl-storage=Autorise le type de station « Entrepôt » (stock minimal/maximal par marchandise). Désactivé = les entrepôts ne proposent ni ne demandent rien, sur toute la carte.
utl-load-timeout=Secondes sans aucun changement de la cargaison chez le fournisseur (0 = pas de condition). Avec "Cargaison ou inactivité" (par défaut), il part aussi avant d'avoir tout chargé si rien n'a été ajouté pendant ce temps – avec ce qu'il a ; avec "Cargaison et inactivité", il ne part que lorsque tout est chargé et que rien n'a changé pendant ce temps. S'il n'a rien chargé du tout, la livraison est annulée. Valeur par défaut pour toutes les équipes ; chaque équipe peut définir ses propres valeurs dans le gestionnaire UTL (onglet "Paramètres").
utl-unload-timeout=Secondes sans aucun changement de la cargaison chez le demandeur (0 = pas de condition). Avec "Cargaison et inactivité", le train part quand il est vide et que rien n'a changé pendant ce temps ; avec "Cargaison ou inactivité", aussi plus tôt, les restes vont à une station de nettoyage. Valeur par défaut pour toutes les équipes ; chaque équipe peut définir ses propres valeurs dans le gestionnaire UTL.
utl-item-group=Automatique : rails, rails surélevés, signaux, arrêts, locomotives et wagons – y compris ceux d'autres mods – obtiennent l'onglet « Trains ». Si un autre mod a déjà son propre onglet de trains, les objets UTL y vont et UTL ne trie rien. Toujours UTL : UTL range tous les objets de train dans son onglet. Désactivé : rien n'est retrié.
utl-signal-style=Classique : véhicules et coffres du jeu avec un symbole dans le coin. Plat : symboles simples propres dans le style des signaux vanilla (gris clair avec un contour foncé). Nécessite un redémarrage.
utl-station-lamps=En plus du panneau d'affichage : les deux petites lampes en haut des arrêts UTL s'allument dans la couleur de l'état (bleu = train en route, vert = train à l'arrêt, cyan = train en attente au dépôt, jaune = rien ne se passe, rouge = désactivé ; couleurs dans les paramètres de carte). Elles sont petites – l'affichage principal est un panneau d'affichage relié à la station par fil. Nécessite un redémarrage.
utl-heartbeat-interval=Nombre de ticks entre les étapes de travail d'UTL. Chaque étape ne fait qu'une petite quantité fixe de travail. Plus haut = moins de CPU, mais réactions plus lentes.
utl-debug-log=Écrit des messages supplémentaires dans factorio-current.log. À n'activer que pour chercher une erreur.
utl-station-batch-size=Combien de stations sont lues par pulsation. Toutes les stations sont parcourues à tour de rôle.
utl-max-deliveries-per-cycle=Combien de trains le répartiteur envoie au plus par cycle (toutes les 3 pulsations). Plus bas = charge CPU plus régulière.
utl-research-required=Activé : le contrôle du chargement (filtres des wagons, sortie des commandes), les stations d'entrepôt et les liaisons de réseaux doivent d'abord être recherchés. Désactivé : tout est disponible tout de suite, jusqu'à 3 partenaires par réseau.
utl-station-output=À côté de chaque station se trouve une petite sortie qui porte les commandes en cours sous forme de signaux : positif chez le fournisseur (autant à charger), négatif chez le demandeur (autant arrive). Utilisez-la pour des bras robotisés filtrants, des pompes et des affichages. Ne la reliez pas à l'entrée de la station – cela reviendrait dans le stock.
utl-wagon-filters=Pendant une livraison, UTL règle les emplacements des wagons sur les marchandises de cette commande et verrouille le reste. Un fournisseur peut alors garder plusieurs marchandises dans un coffre, et des bras robotisés ordinaires ne chargent que ce qui a été commandé. Les wagons dont vous avez réglé les filtres vous-même ne sont pas touchés. Ne s'applique pas aux fluides.
utl-chaining=Un train qui vient de décharger ou quitte une station de ravitaillement/nettoyage prend tout de suite une livraison adaptée (en préférant un fournisseur proche) au lieu de retourner d'abord au dépôt. Économise des trajets à vide.
utl-fuel-threshold=Si une locomotive d'un train est sous ce niveau de carburant, le train passe par une station de ravitaillement UTL adaptée avant sa prochaine commande ou depuis le dépôt (même réseau, longueur du train dans la plage de la station). 0 = désactivé.
utl-fuel-minimum=Sous ce niveau de carburant (locomotive la plus basse), un train ne prend plus de commandes, sauf s'il peut se ravitailler en route dans une station de ravitaillement UTL accessible et libre. Il reste au dépôt, l'alerte "carburant manquant" apparaît et la sortie du dépôt le signale. Entre cette valeur et "Ravitailler en dessous de", un train peut rouler sans arrêt de ravitaillement si aucune station n'est libre. 0 = désactivé.
utl-alert-no-train-minutes=L'alerte « aucun train adapté » n'apparaît qu'après qu'une demande est restée sans réponse aussi longtemps. Tant qu'un train portant la marchandise est en route vers la station, elle compte comme servie. 0 = immédiatement.
utl-stuck-minutes=Si un train de livraison reste aussi longtemps sans progresser – en attente à un signal, sans chemin, ou destination pleine –, l'alerte « train bloqué » apparaît et le gestionnaire UTL l'affiche pour ce train. UTL n'annule rien. Le chargement et le déchargement ne comptent pas (les délais s'en chargent). 0 = désactivé. Par défaut : 5.
utl-alerts-no-train=Alerte lorsqu'une station a besoin de quelque chose et qu'un fournisseur l'a, mais qu'il n'y a aucun train libre ou adapté (réseau, longueur du train).
utl-alerts-cargo=Alerte lorsqu'un train attend au dépôt avec une cargaison restante, ne s'est pas vidé chez le demandeur ou a chargé moins que commandé chez le fournisseur.
utl-alerts-trains=Alerte lorsqu'un train de livraison ne trouve pas de chemin, qu'aucun dépôt libre n'est trouvé, que le ravitaillement a échoué ou qu'une livraison a été annulée.
utl-default-provide-threshold=Valeur initiale pour les nouvelles stations.
utl-default-request-threshold=Valeur initiale pour les nouvelles stations.
utl-news=Après une mise à jour d'UTL, une courte ligne dans le chat sur les nouveautés – avec un lien vers la page « Nouveau dans UTL » des astuces.
utl-manager-width=Largeur du gestionnaire UTL en pixels avec une échelle d'interface de 100 %. Par défaut 1040. Si la fenêtre ne tient pas à l'écran, elle est réduite.
utl-manager-height=Hauteur du gestionnaire UTL en pixels avec une échelle d'interface de 100 %. Par défaut 620. Si la fenêtre ne tient pas à l'écran, elle est réduite.
utl-stop-style=Vanilla : les graphismes de l'arrêt normal. UTL : modèle propre avec mât en treillis, armoire de commande et câbles colorés (essai), avec les éléments de l'arrêt normal le long de la voie. La couleur de la station reste libre. Nécessite un redémarrage.

