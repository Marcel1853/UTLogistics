section-requester=Demandeur
section-depot=Dépôt
section-fuel=Station de ravitaillement
section-cleanup=Nettoyage : ce qui peut venir ici
section-cleanup-tooltip=Seuls viennent ici les trains dont la cargaison restante est acceptée. Les marchandises indiquées une par une passent avant "Tous …" ; si une station ne suffit pas, le train visite plusieurs nettoyages à la suite.
cleanup-all_items-tooltip=Accepter tous les objets (__1__)
cleanup-all_fluids-tooltip=Accepter tous les fluides (__1__)\nRemarque : un réservoir ne contient qu'un seul fluide – mieux vaut un nettoyage par fluide, chacun avec son propre réservoir.
cleanup-or-single=ou un par un :
cleanup-offer=Proposer à nouveau le contenu
cleanup-offer-tooltip=UTL propose à nouveau au réseau ce qui est stocké dans ce nettoyage – comme un fournisseur. Les coffres doivent être reliés à l'arrêt ou au combinateur, comme pour tout fournisseur.
cleanup-offer-disabled=Désactivé sur cette carte (paramètre de carte « Le nettoyage peut proposer à nouveau son contenu »).
cleanup-offer-reserve=Seulement en réserve
cleanup-offer-normal=Comme tout fournisseur
cleanup-offer-first=Vider en premier
cleanup-offer-tier-tooltip=Seulement en réserve : les fournisseurs normaux passent d'abord.\nComme tout fournisseur : priorité, quantité et distance décident.\nVider en premier : ce nettoyage est desservi avant tout fournisseur normal.\nLes marchandises restées chez un demandeur ne lui sont pas ramenées par un nettoyage pendant 5 minutes.
role-storage=Entrepôt
role-storage-tooltip=Reçoit et livre : un stock minimal et maximal par marchandise. Sous le minimum, il se remplit jusqu'au maximum ; ce qui dépasse le minimum est proposé – comme un fournisseur normal, le plus proche gagne. Pour joueurs avancés.
role-storage-locked=L'entrepôt nécessite la recherche « UTL : Entrepôt » (et le paramètre de carte « Autoriser les stations d'entrepôt »).
role-addon-tooltip=Rôle du mod « __1__ ». UTL ne roule ici que comme ce mod le dit.
section-storage=Entrepôt
section-storage-tooltip=Sous le minimum, l'entrepôt demande – jusqu'au maximum. Ce qui dépasse le minimum, il le propose comme un fournisseur normal ; s'il est plus proche du demandeur, il gagne. Les marchandises sans limites (par exemple une cargaison restante) sont proposées entièrement, en réserve.
storage-good=Marchandise
storage-good-tooltip=Marchandise pour laquelle cet entrepôt a des limites. Clic droit vide l'emplacement.
