readout-star=Inclure les réseaux liés
readout-star-tooltip=Compter aussi les réseaux liés (étoile) – les mêmes qui s'entraident avec des trains.
readout-mode=Sortie
readout-mode-stock=Stock
readout-mode-stock-tooltip=Par marchandise, ce que les fournisseurs du réseau proposent actuellement (entrepôts : ce qui dépasse le minimum).
readout-mode-storage=Stock des entrepôts
readout-mode-storage-tooltip=Par marchandise, ce qui est stocké dans les stations d'entrepôt du réseau.
