scenario-name=UTL examples (mixed provider)
description=A small practice network for Unified Train Logistics: a straight line with a depot, a provider that keeps three goods in ONE chest and needs only a plain inserter, a workshop that needs iron and copper at once (both arrive in one trip), another requester, and a fluid provider with two tanks whose pumps are switched by the job output. Made for trying things out, not for measuring performance.

[utl-beispiele]
welcome=[font=default-bold]UTL examples[/font]: At "Mischlager" iron plates, copper plates and gears sit in [font=default-bold]one[/font] chest and a plain inserter loads the train – yet only the ordered item is loaded (UTL sets the wagon filters). The "Werkstatt" needs iron [font=default-bold]and[/font] copper: both come in [font=default-bold]one[/font] trip as long as the wagon has room. At "Tanklager" the pumps are switched by the [font=default-bold]job output[/font] next to the stop: only the ordered fluid flows. UTL Manager: locomotive button in the shortcut bar or Ctrl + Shift + U.
