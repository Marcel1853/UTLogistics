scenario-name=UTL examples (mixed provider)
description=A small practice network for Unified Train Logistics: a ring with sidings, two depots in a row, a fuel station and a cleanup, a provider with three chests and three inserters where only the right one ever runs, a workshop that needs iron and copper at once (both arrive in one trip), another requester, and a fluid provider with two tanks: oil and water each have their own requester, and the pumps are switched by the job output – only the ordered fluid ever flows. Made for trying things out, not for measuring performance.

[utl-beispiele]
welcome=[font=default-bold]UTL examples[/font]: At "Mischlager" iron plates, copper plates and gears each sit in their own chest with their own inserter. The [font=default-bold]job output[/font] next to the stop enables only the inserter whose good is currently ordered – and UTL's wagon filters only let the ordered item in anyway. The "Werkstatt" needs iron [font=default-bold]and[/font] copper: both come in [font=default-bold]one[/font] trip as long as the wagon has room. At "Tanklager" the pumps are switched by the [font=default-bold]job output[/font] next to the stop: only the ordered fluid flows. UTL Manager: locomotive button in the shortcut bar or Ctrl + Shift + U.
