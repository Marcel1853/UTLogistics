scenario-name=UTL-Beispiele (gemischter Anbieter)
description=Kleines Übungsnetz für Unified Train Logistics: eine gerade Strecke mit Depot, einem Anbieter, der drei Waren in EINER Kiste hat und nur einen gewöhnlichen Greifarm braucht, einer Werkstatt, die Eisen und Kupfer zugleich braucht (beides kommt in einer Fahrt), einem weiteren Abnehmer und einem Flüssigkeits-Anbieter mit zwei Tanks, dessen Pumpen über die Auftrags-Ausgabe geschaltet werden. Zum Anschauen und Nachbauen, nicht zum Messen der Leistung.

[utl-beispiele]
welcome=[font=default-bold]UTL-Beispiele[/font]: Am „Mischlager“ liegen Eisenplatten, Kupferplatten und Zahnräder in [font=default-bold]einer[/font] Kiste, und ein gewöhnlicher Greifarm belädt den Zug – geladen wird trotzdem nur, was der Auftrag verlangt (UTL setzt die Wagenfilter). Die „Werkstatt“ braucht Eisen [font=default-bold]und[/font] Kupfer: Beides kommt in [font=default-bold]einer[/font] Fahrt, solange im Wagen Platz ist. Beim „Tanklager“ schalten die Pumpen über die [font=default-bold]Auftrags-Ausgabe[/font] neben der Haltestelle: nur die bestellte Flüssigkeit fließt. UTL-Manager: Lok-Knopf in der Shortcut-Leiste oder Strg + Umschalt + U.
