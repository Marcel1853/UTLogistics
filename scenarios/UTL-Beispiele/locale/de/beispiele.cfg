scenario-name=UTL-Beispiele (gemischter Anbieter)
description=Kleines Übungsnetz für Unified Train Logistics: ein Rundkurs mit Ausbuchtungen, zwei Depots hintereinander, Tankstelle und Cleanup, einem Anbieter mit drei Kisten und drei Greifarmen, von denen immer nur der richtige läuft, einer Werkstatt, die Eisen und Kupfer zugleich braucht (beides kommt in einer Fahrt), einem weiteren Abnehmer und einem Flüssigkeits-Anbieter mit zwei Tanks: Öl und Wasser haben je einen eigenen Abnehmer, und die Pumpen werden über die Auftrags-Ausgabe geschaltet – es fließt immer nur das Bestellte. Zum Anschauen und Nachbauen, nicht zum Messen der Leistung.

[utl-beispiele]
welcome=[font=default-bold]UTL-Beispiele[/font]: Am „Mischlager“ stehen Eisenplatten, Kupferplatten und Zahnräder in je einer Kiste mit eigenem Greifarm. Die [font=default-bold]Auftrags-Ausgabe[/font] neben der Haltestelle schaltet nur den Greifarm frei, dessen Ware gerade bestellt ist – und die Wagenfilter von UTL lassen ohnehin nur das Bestellte hinein. Die „Werkstatt“ braucht Eisen [font=default-bold]und[/font] Kupfer: Beides kommt in [font=default-bold]einer[/font] Fahrt, solange im Wagen Platz ist. Beim „Tanklager“ schalten die Pumpen über die [font=default-bold]Auftrags-Ausgabe[/font] neben der Haltestelle: nur die bestellte Flüssigkeit fließt. UTL-Manager: Lok-Knopf in der Shortcut-Leiste oder Strg + Umschalt + U / Strg + Alt + U.

[utl-beispiele-panel]
title=Was der Zug gerade tut
intro=Zwei Züge fahren hier echte Aufträge: einer mit Güterwagen, einer mit Flüssigkeitswagen. Das Fenster folgt einem davon und erklärt jeden Schritt. Achte beim Laden auf die [font=default-bold]Auftrags-Ausgabe[/font] neben der Haltestelle: Sie gibt nur den Greifarm bzw. die Pumpe frei, deren Ware gerade bestellt ist.
