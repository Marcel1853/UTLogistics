scenario-name=UTL-Aufbau-Beispiele
description=Sammlung von Aufbauten zum Anschauen und Nachbauen: Wie baut man mit Unified Train Logistics eine bestimmte Aufgabe? Jedes Beispiel steht in einem eigenen Bereich, ein Fenster springt per Knopf hin. Erstes Beispiel: Fässer-Recycling – recycelte Fässer zuerst, neue nur bei Bedarf.

[utl-aufbau]
welcome=[font=default-bold]UTL-Aufbau-Beispiele[/font]: Jedes Beispiel zeigt, wie man eine Aufgabe mit UTL löst. Das Fenster links springt zu den Beispielen. UTL-Manager: Lok-Knopf in der Shortcut-Leiste oder Strg + Umschalt + U.
window-title=Aufbau-Beispiele
window-intro=Zum Beispiel springen:
faesser-title=Fässer-Recycling
faesser-text=Recycelte Fässer zuerst, neue nur bei Bedarf – ohne eigenes Netz.\n• Leergut ist ein aktiver Anbieter mit Anbieter-Priorität 1, die Station für neue Fässer hat Priorität 0: UTL holt zuerst das Leergut.\n• Neue Fässer baut die Maschine nur, solange das SR-Latch am Netz-Kombinator (Modus „Bestand“) ✓ ausgibt: an unter 200, aus über 400 Fässern im Netz.\n• Die Fabrik verbraucht 4 Fässer je Sekunde, 3 kommen als Leergut zurück – das Leergut wird also knapp, und erst dann entstehen neue.
faesser-fabrik=Fabrik: verbraucht __1__ Fässer je Sekunde
faesser-leergut=Leergut: __1__ Fässer je Sekunde zurück – aktiver Anbieter, Priorität 1
faesser-neu=Fässer neu – Priorität 0: baut nur unter 200 Fässern im Netz (bis 400)
