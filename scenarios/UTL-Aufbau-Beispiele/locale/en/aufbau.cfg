window-title=Build examples
window-intro=Jump to an example:
faesser-title=Barrel recycling
faesser-text=Recycled barrels first, new ones only when needed – without a separate network.\n• Empty barrels come from an active provider with provider priority 1, the station for new barrels has priority 0: UTL takes the recycled ones first.\n• The machine only makes new barrels while the SR latch at the network combinator (mode “Stock”) outputs ✓: on below 200, off above 400 barrels in the network.\n• The factory uses 4 barrels per second, 3 come back – so recycled barrels run short, and only then new ones are made.
faesser-fabrik=Factory: uses __1__ barrels per second
faesser-leergut=Empty barrels: __1__ per second come back – active provider, priority 1
faesser-neu=New barrels – priority 0: only made below 200 barrels in the network (up to 400)
