scenario-name=UTL-Netzverbund (2 × 2 City Blocks)
description=Übungsnetz für verbundene Netze aus 2 × 2 City Blocks (4 Gleise je Korridor, Kreuzungen mit Kettensignalen). Vier Netze, jedes in seinem Teil der Karte: „Eisen“ in der Mitte ist das Zentrum eines Sterns mit Depot (4 Züge), Tankstelle und Cleanup. Seine Partner: „Kupfer“ ohne eigenes Depot – die Eisen-Züge fahren seine Aufträge – und „Kohle“ mit eigenem Depot (2 Züge), dessen Züge auch Eisen helfen, aber nie Kupfer, denn Partner helfen sich nicht untereinander. „Stein“ ist mit niemandem verbunden und fährt nur mit seinen eigenen Zügen. Alles erforscht, Cheat-Modus an. Zum Anschauen: UTL-Manager, Reiter „Netzwerke“ und „Verlauf“.

[utl-netzverbund]
welcome=[font=default-bold]UTL-Netzverbund[/font]: vier Netze auf 2 × 2 City Blocks. [font=default-bold]Eisen[/font] (Mitte) ist das Zentrum, [font=default-bold]Kupfer[/font] (oben links) und [font=default-bold]Kohle[/font] (oben rechts) sind seine Partner, [font=default-bold]Stein[/font] (unten) ist allein. Kupfer hat keine eigenen Züge – die Eisen-Züge fahren für Kupfer. Die Kohle-Züge helfen Eisen, aber nie Kupfer. Ausprobieren: im UTL-Manager (Strg + Umschalt + U / Strg + Alt + U), Reiter „Netzwerke“, eine Verbindung lösen oder Stein dazunehmen und im „Verlauf“ zusehen, wer wohin fährt.

