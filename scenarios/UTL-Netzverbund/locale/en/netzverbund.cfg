scenario-name=UTL network links (2 × 2 city blocks)
description=Practice network for linked networks built from 2 × 2 city blocks (4 tracks per corridor, chain-signalled crossings). Four networks, each in its own part of the map: "Eisen" (iron) in the middle is the center of a star with a depot (4 trains), fuel station and cleanup. Its partners: "Kupfer" (copper) without a depot of its own – the iron trains run its jobs – and "Kohle" (coal) with its own depot (2 trains), whose trains also help iron but never copper, because partners do not help each other. "Stein" (stone) is linked to nobody and only runs its own trains. Everything researched, cheat mode on. Things to look at: UTL Manager, tabs "Networks" and "History".

[utl-netzverbund]
welcome=[font=default-bold]UTL network links[/font]: four networks on 2 × 2 city blocks. [font=default-bold]Eisen[/font] (iron, middle) is the center, [font=default-bold]Kupfer[/font] (copper, top left) and [font=default-bold]Kohle[/font] (coal, top right) are its partners, [font=default-bold]Stein[/font] (stone, bottom) is on its own. Copper has no trains of its own – the iron trains run for copper. The coal trains help iron but never copper. Try it: in the UTL Manager (Ctrl + Shift + U / Ctrl + Alt + U), tab "Networks", remove a link or add stone, and watch in "History" who goes where.

[utl-verbund-panel]
title=Who drives for whom?
intro=Four networks share their trains by fixed rules. [font=default-bold]Eisen[/font] (iron) is the center, [font=default-bold]Kupfer[/font] (copper) and [font=default-bold]Kohle[/font] (coal) are its partners, [font=default-bold]Stein[/font] (stone) is on its own. The camera prefers a trip where a train drives for [font=default-bold]another[/font] network. What you see right now is highlighted.
following=Trip: "__1__" → "__2__"
waiting=No trip right now – more in a moment.
next=Next trip
next-tooltip=Switch the camera to the next running trip.
legend-own=A train serves its own network.
legend-iron-copper=An iron train drives for a partner: for copper (no trains of its own) or for coal – the center helps all its partners.
legend-coal-iron=A coal train helps iron out.
legend-coal-copper=Coal never drives for copper: partners do not help each other.
legend-stone=Stone is linked to nobody and only drives for itself.
big=Train from [font=default-bold]__1__[/font] drives for [font=default-bold]__2__[/font]
no-trip=Waiting for the next trip …
count=So far – iron drove for copper: __1__ · for coal: __2__ · coal helped iron: __3__ · coal drove for copper: __4__ (must stay 0)
