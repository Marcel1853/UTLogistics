scenario-name=UTL active provider (to watch)
description=Shows the role "Active provider": the station is emptied, even without a request – like an active provider chest. Its goods go to the requester first, then to the storage up to its maximum, the rest to the cleanup. A window explains every step, and above the stations you see what is in their chests right now.

[utl-aktiv]
title=Active provider – how it works
intro=The provider has the role [font=default-bold]Active provider[/font]: it is meant to be emptied, even if nobody requests anything.\nThe goods go to [font=default-bold]requesters[/font] first, then to [font=default-bold]storage stations[/font] up to their maximum, finally to the [font=default-bold]cleanup[/font].
round=Round __1__
step-1=The active provider gets 6000 iron.
step-2=First the requester gets what it needs (1000).
step-3=Then the storage fills up to its maximum – although it is already above its minimum.
step-4=The rest goes to the cleanup.
step-5=The station is empty. The next round starts in 20 seconds.
left=At the active provider: __1__ iron
sent=This round so far – requester: __1__ · storage: __2__ · cleanup: __3__
label-provider=Active provider: __1__
label-requester=Requester: __1__ / __2__
label-storage=Storage: __1__ (min __2__, max __3__)
label-cleanup=Cleanup: __1__ accepted
