scenario-name=UTL-Aktiver-Anbieter (zum Anschauen)
description=Zeigt die Rolle „Aktiver Anbieter“: Die Station wird geleert, auch ohne Anforderung – wie eine aktive Anbieterkiste. Ihre Ware geht zuerst an den Abnehmer, dann ins Lager bis zum Höchstbestand, der Rest ins Cleanup. Ein Fenster erklärt jeden Schritt, über den Bahnhöfen steht, was gerade in den Kisten liegt.

[utl-aktiv]
title=Aktiver Anbieter – so funktioniert’s
intro=Der Anbieter hat die Rolle [font=default-bold]Aktiver Anbieter[/font]: Er soll leer werden, auch wenn niemand etwas anfordert.\nDie Ware geht der Reihe nach an [font=default-bold]Abnehmer[/font], dann an [font=default-bold]Lager[/font] bis zu deren Höchstbestand, zuletzt ins [font=default-bold]Cleanup[/font].
round=Runde __1__
step-1=Der aktive Anbieter bekommt 6000 Eisen.
step-2=Zuerst bekommt der Abnehmer, was er braucht (1000).
step-3=Dann füllt sich das Lager bis zum Höchstbestand – obwohl es schon über dem Mindest liegt.
step-4=Der Rest geht ins Cleanup.
step-5=Der Bahnhof ist leer. In 20 Sekunden beginnt die nächste Runde.
