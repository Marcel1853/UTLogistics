scenario-name=UTL-Lager (zum Anschauen)
description=Zeigt die Neuerungen aus 0.0.8 auf einem Rundkurs mit zwei Zügen: ein Lager mit Mindest- und Höchstbestand, das den nahen Abnehmer beliefert und sich unter Mindest wieder auffüllt; Wende-Greifarme, die sich über die Schaltung umdrehen; und einen Cleanup, der Restladung wieder anbietet. Ein Fenster erklärt jeden Teil, eine Kamera folgt dem beteiligten Zug.

[utl-lager]
title=Lager, Wende-Greifarm, Cleanup gibt zurück
intro=Alles läuft gleichzeitig auf einem Rundkurs mit zwei Zügen.\nDas Fenster schaut auf einen Teil – der Knopf wechselt zum nächsten.\nHervorgehoben ist, was gerade zu sehen ist.
headline=Teil __1__ von 3: __2__
chapter-storage=Lager
chapter-reversible=Wende-Greifarm
chapter-cleanup=Cleanup gibt zurück
next=Weiter: __1__
next-tooltip=Zum nächsten Teil wechseln.
storage-1=Das Lager ist unter Mindest (400) gefallen und fordert bis Höchst (1200) an – ein Zug holt Eisen beim Anbieter.
storage-2=Der Zug bringt das Eisen ins Lager.
storage-3=Das Lager gibt an die Fabrik ab: Sie liegt näher am Lager als am Anbieter.
storage-4=Die Werkstatt oben bekommt ihr Eisen vom Anbieter – der liegt näher an ihr.
storage-5=Ist der Anbieter gerade belegt, hilft das Lager auch der Werkstatt aus.
storage-6=Gerade nichts zu tun. Die kleine Fabrik hinter dem Lager verbraucht stetig Eisen.
storage-big=Im Lager: __1__ Eisen  (Mindest 400 · Höchst 1200)
storage-note=Fahrten ins Lager: __1__ · aus dem Lager: __2__ · Werkstatt vom Anbieter: __3__
reversible-1=Die Wende-Greifarme am Lager sind in Laderichtung gebaut: Kiste → Wagen.
reversible-2=Ein Zug entlädt am Lager: Die Auftrags-Ausgabe meldet [virtual-signal=utl-unloading] – die Greifarme drehen sich um.
reversible-3=Ein Zug holt am Lager ab: Das Signal ist 0 – sie laden wie gebaut.
reversible-4=Am Cleanup andersherum: gebaut zum Entladen – ein Zug mit Rest wird geleert.
reversible-5=Holt ein Zug am Cleanup ab, meldet die Ausgabe [virtual-signal=utl-loading]. Seine Bedingung „utl-loading > 0“ dreht ihn zum Laden.
rev-normal=Wende-Greifarme am Lager: wie gebaut (laden)
rev-flipped=Wende-Greifarme am Lager: [color=green]umgedreht (entladen)[/color]
rev-note=Drehungen bisher: __1__ · Signal und Bedingung stellst du im Fenster des Greifarms ein.
cleanup-1=Kupfer-Werkstatt A bestellt Kupfer beim Anbieter.
cleanup-2=Unterwegs füllt sich ihre Kiste anderweitig (hier spielt das Szenario nach) – es passt nicht alles hinein, ein Rest bleibt im Wagen.
cleanup-3=Der Zug bringt den Rest zum Cleanup und lädt ihn dort ab.
cleanup-4=Der Cleanup bietet sein Kupfer wieder an. Stufe „zuerst leeren“: Er geht normalen Anbietern vor.
cleanup-5=Kupfer-Werkstatt B bekommt das Kupfer vom Cleanup. A nicht: 5 Minuten Rückweg-Sperre, damit kein Kupfer im Kreis fährt.
cleanup-big=Im Cleanup: __1__ Kupfer
cleanup-note=Reste zum Cleanup: __1__ · vom Cleanup zurückgegeben: __2__
