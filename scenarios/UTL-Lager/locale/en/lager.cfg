scenario-name=UTL storage (to watch)
description=Shows what is new in 0.0.8 on a loop with two trains: a storage with minimum and maximum stock that supplies the nearby requester and fills up again below the minimum; loading and unloading inserters switched by the job output; and a cleanup that offers leftover cargo again. A window explains each part, a camera follows the train involved.

[utl-lager]
title=Storage, loading and unloading, cleanup gives back
intro=Everything runs at the same time on a loop with two trains.\nThe window looks at one part – the button switches to the next.\nHighlighted is what you can see right now.
headline=Part __1__ of 3: __2__
chapter-storage=Storage
chapter-switch=Loading and unloading
chapter-cleanup=Cleanup gives back
next=Next: __1__
next-tooltip=Switch to the next part.
storage-1=The storage has fallen below its minimum (400) and requests up to its maximum (1200) – a train fetches iron at the provider.
storage-2=The train brings the iron into the storage.
storage-3=The storage supplies the factory: it is nearer to the storage than to the provider.
storage-4=The workshop at the top gets its iron from the provider – that one is nearer to it.
storage-5=If the provider is busy right now, the storage helps the workshop out, too.
storage-6=Nothing to do right now. The small factory behind the storage keeps using iron.
storage-big=In storage: __1__ iron  (minimum 400 · maximum 1200)
storage-note=Trips into the storage: __1__ · out of it: __2__ · workshop from the provider: __3__
switch-1=The storage has two sets of inserters: unloading inserters (wagon → chest), transfer inserters (chest → chest) and loading inserters (chest → wagon).
switch-2=A train delivers to the storage: [virtual-signal=utl-loading] is 0 – the unloading inserters work, the loading inserters are off.
switch-3=A train picks up at the storage: the job output sends [virtual-signal=utl-loading] – now the loading inserters load, the unloading inserters are off.
switch-4=The cleanup is built the same way: a train with leftovers has no job, so utl-loading is 0 – it gets unloaded.
switch-5=When a train picks up at the cleanup, the output sends [virtual-signal=utl-loading] – there the loading inserters load now.
switch-idle=At the storage right now: no train
switch-unloading=Right now: [color=yellow]unloading[/color]
switch-loading=Right now: [color=green]loading[/color]
switch-note=Trains unloaded at the storage: __1__ · loaded: __2__ · Conditions: loading inserters “utl-loading > 0”, unloading inserters “utl-loading = 0”
cleanup-1=Copper workshop A orders copper from the provider.
cleanup-2=On the way its chest fills up from elsewhere (the scenario plays this part) – not everything fits, a rest stays in the wagon.
cleanup-3=The train takes the rest to the cleanup and unloads it there.
cleanup-4=The cleanup offers its copper again. Level “empty first”: it goes before normal providers.
cleanup-5=Copper workshop B gets the copper from the cleanup. A does not: a 5-minute return block, so no copper goes round in circles.
cleanup-big=In the cleanup: __1__ copper
cleanup-note=Leftovers to the cleanup: __1__ · given back by the cleanup: __2__
