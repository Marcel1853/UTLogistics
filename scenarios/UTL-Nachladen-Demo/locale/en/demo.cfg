scenario-name=UTL top up (to watch)
description=Shows what "Top up while loading" does. A train sets off to fetch 1000 iron – on its way the demand rises to 3000. With topping up, the extra amount is added to the load list of the same train; without it, the rest needs a second trip. The rounds alternate so you see both. A window explains every step, a camera follows the train, and its load list floats above it.

[utl-demo]
title=Topping up – how it works
intro=A train is already on its way to the provider when the requester suddenly needs more.\n[font=default-bold]With topping up[/font] the extra amount goes onto the load list of [font=default-bold]the same train[/font].\n[font=default-bold]Without it[/font] the train leaves with the old amount, and the rest needs a second trip.\nThe rounds alternate so you see both.
round=Round __1__: topping up __2__
on=[color=green]ON[/color]
off=[color=yellow]OFF[/color]
mode-alternate=Mode: alternating
mode-on=Mode: always on
mode-off=Mode: always off
mode-tooltip=Click to switch. Applies from the next round.
step-1=The requester needs 1000 iron.
step-2=The train sets off with a load list of 1000.
step-3=On its way the demand rises to 3000.
step-4-on=Topped up: the same train now fetches 3000.
step-4-off=Not topped up: the train stays at 1000.
step-5-on=Delivered – done in [font=default-bold]one[/font] trip.
step-5-off=Delivered – the rest (__1__) needs [font=default-bold]a second trip[/font].
step-6=Done. 20 seconds later the circuit empties the chests, then the next round starts.
cargo=Load list of the train: __1__ iron
cargo-none=The train has no job right now.
