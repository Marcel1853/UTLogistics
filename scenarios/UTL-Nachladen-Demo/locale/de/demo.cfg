scenario-name=UTL-Nachladen (zum Anschauen)
description=Zeigt, was „Nachladen, während der Zug lädt“ bringt. Ein Zug fährt los, um 1000 Eisen zu holen – unterwegs steigt der Bedarf auf 3000. Mit Nachladen kommt die zusätzliche Menge auf die Ladeliste desselben Zugs, ohne braucht der Rest eine zweite Fahrt. Die Runden wechseln sich ab, damit du beides siehst. Ein Fenster erklärt jeden Schritt, eine Kamera folgt dem Zug, und über dem Zug steht seine Ladeliste.

[utl-demo]
title=Nachladen – so funktioniert’s
intro=Ein Zug ist schon unterwegs zum Anbieter, da braucht der Abnehmer plötzlich mehr.\n[font=default-bold]Mit Nachladen[/font] kommt die zusätzliche Menge auf die Ladeliste [font=default-bold]desselben Zugs[/font].\n[font=default-bold]Ohne[/font] fährt er mit der alten Menge, und für den Rest braucht es eine zweite Fahrt.\nDie Runden wechseln sich ab – so siehst du beides.
