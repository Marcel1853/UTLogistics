scenario-name=UTL-Planeten-Test (Space Age)
description=Testnetz für die Planeten-Auswahl im UTL-Manager (braucht Space Age): das Netz aus „UTL-Netzverbund“ (2 × 2 City Blocks, 8 Züge, Stern Eisen + Kupfer + Kohle, Stein allein) auf Nauvis, Vulcanus und Gleba. Alle Stationen und Depots heißen überall gleich. Alles erforscht, Cheat-Modus an.

[utl-planeten-test]
welcome=[font=default-bold]UTL-Planeten-Test[/font]: dasselbe Netz auf __1__, überall mit gleichen Namen. UTL-Manager (Strg + Umschalt + U / Strg + Alt + U): oben neben der Lupe den Planeten wählen oder „Automatisch“ lassen und in der Fernsicht (Karte) den Planeten wechseln. Hinreisen: /c game.player.teleport({224, 224}, "vulcanus")
