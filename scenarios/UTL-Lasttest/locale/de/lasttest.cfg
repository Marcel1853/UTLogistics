scenario-name=UTL-Lasttest (384 Züge)
description=Beispiel- und Lastnetz für Unified Train Logistics aus einem City-Block-Gitter (12 × 12 Blöcke, 4 Gleise je Korridor, Kreuzungen mit Kettensignalen, Großmasten und Radare). 5 Depots mit je 72 Zügen (1 Lok + 1 bis 4 Wagen) in reinen Depot-Blöcken ohne Bahnhöfe (6 Abstellbahnhöfe mit je 12 Gleisen), dazu „Depot Flüssig“ mit 24 Flüssigkeitszügen. 496 Bahnhöfe an den Korridoren: Anbieter und Abnehmer gemischt, Rohöl und Petroleumgas mit Pumpen und Tanks, 8 Lager (Mindest 1000, Höchst 4000), 16 Tankstellen und 9 Cleanup gleichmäßig über die Karte verteilt – jeder auf einem Nebengleis mit Platz für 3 Züge (Bahnsteig + 2 Warteplätze). Jede vierte Station ist eine normale Haltestelle mit UTL-Stations-Combinator (Symbol im Namen), die übrigen UTL-Haltestellen. Be- und Entladen mit echten Greifarmen und Pumpen an Unendlich-Kisten und -Rohren; Lager und Item-Cleanups nehmen an und geben ab (Stahlkisten, Greifarme an der Auftrags-Ausgabe), die Cleanups bieten ihren Inhalt wieder an. Drei Netze nach Spalten – West, Mitte, Ost –, Mitte ist mit beiden verbunden. Nachladen ist an. Je Ware zwei Abnehmer mit Stahlkisten und Abfluss über ein SR-Latch (Entscheider mit Rückkopplung: ab 2000 abfließen bis 200) – sie bleiben eine Weile voll und fordern erst unter 1000 wieder an. Einzelne Abnehmer nehmen nur Züge einer festen Länge (2, 3, 4 oder 5 Teile, steht im Namen) und haben nur so viele Wagenplätze. Karten-Markierungen (M) zeigen Lager, Cleanups, SR-Latch-Abnehmer und Bahnhöfe mit fester Zuglänge. Signale: in jeden Knoten ein Kettensignal, hinaus ein normales, dazwischen Blöcke für mindestens einen Zug aus Lok und 4 Wagen. UPS: F4 → show-fps / show-time-usage.

[utl-lasttest]
welcome=[font=default-bold]UTL-Lasttest[/font]: City-Block-Gitter 12 × 12, 5 Depots mit je 72 Zügen in reinen Depot-Blöcken, „Depot Flüssig“ mit 24 Flüssigkeitszügen, 496 Bahnhöfe mit je 3 Plätzen (auch Rohöl und Petroleumgas), jede vierte Station mit UTL-Combinator an einer normalen Haltestelle, 8 Lager, Cleanups geben ihren Inhalt zurück, drei Netze (West und Ost mit Mitte verbunden), Nachladen an. So sieht ein Netz aus, das mit UTL gut läuft: Bahnhöfe auf Nebengleisen mit Warteplätzen, Kettensignal vor jedem Abzweig, Depots gebündelt. UTL-Manager: Lok-Knopf in der Shortcut-Leiste oder Strg + Umschalt + U / Strg + Alt + U.
