scenario-name=UTL-Lasttest (297 Züge)
description=Beispiel- und Lastnetz für Unified Train Logistics aus einem City-Block-Gitter (12 × 12 Blöcke, 4 Gleise je Korridor, Kreuzungen mit Kettensignalen, Großmasten und Radare). 5 Depots mit je 54 Zügen (1 Lok + 1 bis 4 Wagen) in reinen Depot-Blöcken ohne Bahnhöfe (je Block ein Abstellbahnhof mit 27 Haltestellen, an jeder stehen zwei Züge hintereinander), dazu „Depot Flüssig“ mit 27 Flüssigkeitszügen. 516 Bahnhöfe an den Korridoren: Anbieter und Abnehmer gemischt, Rohöl und Petroleumgas mit Pumpen und Tanks, 16 Tankstellen und 6 Cleanup gleichmäßig über die Karte verteilt – jeder auf einem Nebengleis mit Platz für 3 Züge (Bahnsteig + 2 Warteplätze). Jede vierte Station ist eine normale Haltestelle mit UTL-Stations-Combinator (Symbol im Namen), die übrigen UTL-Haltestellen. Be- und Entladen mit echten Greifarmen und Pumpen an Unendlich-Kisten und -Rohren. UPS: F4 → show-fps / show-time-usage.

[utl-lasttest]
welcome=[font=default-bold]UTL-Lasttest[/font]: City-Block-Gitter 12 × 12, 5 Depots mit je 54 Zügen in reinen Depot-Blöcken (27 Haltestellen, zwei Züge je Haltestelle), „Depot Flüssig“ mit 27 Flüssigkeitszügen, 516 Bahnhöfe mit je 3 Plätzen (auch Rohöl und Petroleumgas), jede vierte Station mit UTL-Combinator an einer normalen Haltestelle. So sieht ein Netz aus, das mit UTL gut läuft: Bahnhöfe auf Nebengleisen mit Warteplätzen, Kettensignal vor jedem Abzweig, Depots gebündelt. UTL-Manager: Lok-Knopf in der Shortcut-Leiste oder Strg + Umschalt + U.
