scenario-name=UTL load test (384 trains)
description=Example and load network for Unified Train Logistics built from a city-block grid (12 × 12 blocks, 4 tracks per corridor, chain-signalled crossings, big poles and radars). 5 depots with 72 trains each (1 locomotive + 1 to 4 wagons) in depot-only blocks without stations (6 yards with 12 tracks each), plus "Depot Flüssig" with 24 fluid trains. 496 stations along the corridors: providers and requesters mixed, crude oil and petroleum gas with pumps and tanks, 8 storage stations (minimum 1000, maximum 4000), 16 fuel and 9 cleanup stations spread evenly over the map – each on a siding with room for 3 trains (platform + 2 waiting spots). Every fourth station is a normal train stop with a UTL station combinator (icon in the name), the others are UTL train stops. Real inserters and pumps at infinity chests and pipes; storage stations and item cleanups take goods in and hand them out (steel chests, inserters on the job output), and the cleanups offer their contents again. Three networks by column – West, Mitte, Ost – with Mitte linked to both. Top-up is on. Per item two requesters with steel chests and a drain switched by an SR latch (decider combinator with feedback: drain from 2000 down to 200) – they stay full for a while and only request again below 1000. Some requesters only take trains of one fixed length (2, 3, 4 or 5 parts, see the name) and have just as many wagon bays. Map tags (M) mark storage stations, cleanups, SR latch requesters and stations with a fixed train length. Signals: a chain signal into every junction, a normal one out, and blocks in between that fit a locomotive with 4 wagons. UPS: F4 → show-fps / show-time-usage.

[utl-lasttest]
welcome=[font=default-bold]UTL load test[/font]: city-block grid 12 × 12, 5 depots with 72 trains each in depot-only blocks, "Depot Flüssig" with 24 fluid trains, 496 stations with 3 spots each (including crude oil and petroleum gas), every fourth station a normal stop with a UTL combinator, 8 storage stations, cleanups hand their contents back, three networks (West and Ost linked with Mitte), top-up on. This is a network that works well with UTL: stations on sidings with waiting spots, a chain signal before every switch, bundled depots. UTL Manager: locomotive button in the shortcut bar or Ctrl + Shift + U / Ctrl + Alt + U.
