scenario-name=UTL load test (297 trains)
description=Example and load network for Unified Train Logistics built from a city-block grid (12 × 12 blocks, 4 tracks per corridor, chain-signalled crossings, big poles and radars). 5 depots with 54 trains each (1 locomotive + 1 to 4 wagons) in depot-only blocks without stations (one yard with 27 stops per block, two trains behind each other per stop), plus "Depot Flüssig" with 27 fluid trains. 516 stations along the corridors: providers and requesters mixed, crude oil and petroleum gas with pumps and tanks, 16 fuel and 6 cleanup stations spread evenly over the map – each on a siding with room for 3 trains (platform + 2 waiting spots). Every fourth station is a normal train stop with a UTL station combinator (icon in the name), the others are UTL train stops. Real inserters and pumps at infinity chests and pipes. UPS: F4 → show-fps / show-time-usage.

[utl-lasttest]
welcome=[font=default-bold]UTL load test[/font]: city-block grid 12 × 12, 5 depots with 54 trains each in depot-only blocks (27 stops, two trains per stop), "Depot Flüssig" with 27 fluid trains, 516 stations with 3 spots each (including crude oil and petroleum gas), every fourth station a normal stop with a UTL combinator. This is a network that works well with UTL: stations on sidings with waiting spots, a chain signal before every switch, bundled depots. UTL Manager: locomotive button in the shortcut bar or Ctrl + Shift + U.
