scenario-name=UTL teams (four teams, 2 × 2 city blocks each)
description=Test map for team separation: four teams – Standard, Rot, Blau and Grün – each with its own 2 × 2 grid (depots, provider, requesters, fuel station, cleanup). The four grids stand apart, no track connects them. All four deliberately use the same station names and the same network "Eisen" – a train must still only serve stops of its own team. Switch teams with /utl-team standard|rot|blau|grün, single player too. Everything researched, cheat mode on, teams at peace with each other.

[utl-teams]
welcome=[font=default-bold]UTL teams[/font]: four teams, each with its own 2 × 2 quarter – [font=default-bold]Standard[/font] (top left), [font=default-bold]Rot[/font] (top right), [font=default-bold]Blau[/font] (bottom left), [font=default-bold]Grün[/font] (bottom right). All of them have identically named stops in the same network "Eisen". Switch team with [font=default-bold]/utl-team rot[/font]. In the UTL Manager (Ctrl + Shift + U) you only see your own team – and no train may go to another team's stop.
joined=You are now in team [font=default-bold]__1__[/font].
command-help=Switch team: /utl-team standard|rot|blau|grün
command-list=Teams: __1__ – switch with e.g. /utl-team rot
