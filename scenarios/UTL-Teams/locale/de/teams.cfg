scenario-name=UTL-Teams (vier Teams, je 2 × 2 City Blocks)
description=Prüfkarte für die Team-Trennung: vier Teams – Standard, Rot, Blau und Grün – mit je einem eigenen 2 × 2-Raster (Depots, Anbieter, Abnehmer, Tankstelle, Cleanup). Die vier Raster stehen getrennt nebeneinander, kein Gleis führt hinüber. Alle vier benutzen mit Absicht dieselben Stationsnamen und dasselbe Netz „Eisen“ – ein Zug darf trotzdem nur zu Haltestellen seines eigenen Teams fahren. Mit /utl-team standard|rot|blau|grün wechselt man das Team, auch allein. Alles erforscht, Cheat-Modus an, Teams untereinander friedlich.

[utl-teams]
welcome=[font=default-bold]UTL-Teams[/font]: vier Teams mit je einem eigenen 2 × 2-Viertel – [font=default-bold]Standard[/font] (oben links), [font=default-bold]Rot[/font] (oben rechts), [font=default-bold]Blau[/font] (unten links), [font=default-bold]Grün[/font] (unten rechts). Alle haben gleich benannte Haltestellen im selben Netz „Eisen“. Team wechseln mit [font=default-bold]/utl-team rot[/font]. Im UTL-Manager (Strg + Umschalt + U) siehst du nur dein eigenes Team – und kein Zug darf zu einem fremden Bahnhof fahren.
joined=Du bist jetzt im Team [font=default-bold]__1__[/font].
command-help=Team wechseln: /utl-team standard|rot|blau|grün
command-list=Teams: __1__ – zum Wechseln z. B. /utl-team rot
