# Baut bei jedem Push auf main die Mod-Zip und lädt sie aufs Mod-Portal – aber nur, wenn die
# Version in info.json dort neu ist. Gibt es auf GitHub noch kein Release für die Version, legt er
# eins an (Tag vX.Y.Z, Zip als Download, Text = Abschnitt der Version aus changelog.txt).
# Gepackt wird mit tools/package.sh: ohne tools/, docs/, .github/, .vscode/, CLAUDE.md usw.
# (dieselbe Zip wie lokal).
#
# Voraussetzungen:
#   - Secret FACTORIO_MOD_PORTAL_TOKEN (API-Schlüssel von factorio.com mit den Rechten
#     „ModPortal: Upload Mods“ und – für die Beschreibung – „ModPortal: Edit Mods“).
#   - Die ERSTE Veröffentlichung von Hand im Mod-Portal hochladen: init_upload geht nur für Mods,
#     die es dort schon gibt. Danach laufen alle neuen Versionen über diesen Workflow.
name: Release auf dem Mod-Portal

on:
  push:
    branches:
      - main

permissions:
  contents: write # für Release-Branch, Tag und GitHub-Release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Werkzeuge installieren
        run: sudo apt-get install -y jq zip rsync

      - name: Mod-Name und Version lesen
        id: info
        run: |
          echo "name=$(jq -r '.name' info.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' info.json)" >> "$GITHUB_OUTPUT"

      - name: Version auf dem Mod-Portal prüfen
        id: check
        run: |
          RESPONSE=$(curl -s "https://mods.factorio.com/api/mods/${{ steps.info.outputs.name }}")
          if echo "$RESPONSE" | jq -e '.releases' >/dev/null 2>&1; then
            FOUND=$(echo "$RESPONSE" | jq -r --arg v "${{ steps.info.outputs.version }}" '[.releases[].version] | index($v) != null')
          else
            echo "Mod noch nicht auf dem Portal – die erste Version bitte von Hand hochladen."
            FOUND="missing"
          fi
          echo "Version ${{ steps.info.outputs.version }} schon auf dem Portal: $FOUND"
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"

      - name: GitHub-Release prüfen
        id: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.info.outputs.version }}" >/dev/null 2>&1; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "Noch kein GitHub-Release für v${{ steps.info.outputs.version }}."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip bauen
        if: steps.check.outputs.found == 'false' || steps.gh.outputs.missing == 'true'
        run: |
          bash tools/package.sh
          echo "ZIP=dist/${{ steps.info.outputs.name }}_${{ steps.info.outputs.version }}.zip" >> "$GITHUB_ENV"

      - name: Upload anfordern (init_upload)
        id: init
        if: steps.check.outputs.found == 'false'
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.FACTORIO_MOD_PORTAL_TOKEN }}" \
            -F "mod=${{ steps.info.outputs.name }}" \
            https://mods.factorio.com/api/v2/mods/releases/init_upload)
          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.upload_url // empty' 2>/dev/null || true)
          if [ -z "$UPLOAD_URL" ]; then
            echo "Keine Upload-Adresse erhalten:"
            echo "$RESPONSE"
            exit 1
          fi
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Zip hochladen (finish_upload)
        if: steps.check.outputs.found == 'false'
        run: |
          RESPONSE=$(curl -s -X POST -F "file=@$ZIP" "${{ steps.init.outputs.upload_url }}")
          echo "Antwort des Portals: $RESPONSE"
          if echo "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            # Die Versionsliste des Portals hinkt kurz hinterher: ein Push gleich nach einem
            # Release wollte sonst dieselbe Version noch einmal hochladen und brach ab – dann
            # kamen Release-Branch und Beschreibung nicht mehr dran.
            if echo "$RESPONSE" | grep -q "InvalidModRelease"; then
              echo "Diese Version liegt schon auf dem Portal – Hochladen übersprungen."
            else
              echo "Hochladen fehlgeschlagen."
              exit 1
            fi
          fi

      - name: Release-Branch setzen
        if: steps.check.outputs.found == 'false' || steps.gh.outputs.missing == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B release
          git push origin release --force

      - name: Beschreibung auf dem Mod-Portal aktualisieren
        continue-on-error: true # eine misslungene Beschreibung soll den Release nicht kippen
        run: |
          # Bei einer neuen Version immer; sonst nur, wenn dieser Push die README geändert hat.
          if [ "${{ steps.check.outputs.found }}" != "false" ] \
             && ! git diff --name-only HEAD^ HEAD | grep -qx "README.md"; then
            echo "Keine neue Version und README unverändert – Beschreibung bleibt, wie sie ist."
            exit 0
          fi
          ZEICHEN=$(wc -m < README.md)
          echo "README.md hat $ZEICHEN Zeichen (Portal erlaubt 35000)."
          if [ "$ZEICHEN" -gt 35000 ]; then
            echo "Zu lang – Beschreibung bleibt unverändert."
            exit 1
          fi
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.FACTORIO_MOD_PORTAL_TOKEN }}" \
            -F "mod=${{ steps.info.outputs.name }}" \
            -F "description=<README.md" \
            https://mods.factorio.com/api/v2/mods/edit_details)
          echo "Antwort des Portals: $RESPONSE"
          if echo "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            echo "Beschreibung nicht übernommen (braucht das Recht „ModPortal: Edit Mods“)."
            exit 1
          fi

      - name: GitHub-Release anlegen
        if: steps.gh.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          # Abschnitt dieser Version aus changelog.txt (bis zur nächsten Trennlinie)
          awk -v v="$VERSION" '
            /^-+$/ { if (found) exit; next }
            $0 ~ "^Version: " v "$" { found = 1; next }
            found { print }
          ' changelog.txt > release-notes.md
          [ -s release-notes.md ] || echo "Version $VERSION" > release-notes.md
          gh release create "v$VERSION" "$ZIP" \
            --title "Unified Train Logistics $VERSION" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
