[utl-sign]
ship-depot=Hafen-Depot: zwei Häfen mit gleichem Namen, je ein Frachtschiff
ship-provider=Mischlager: Eisen, Kupfer und Zahnräder – ein Greifarm je Ware
ship-requester=Werkstatt: braucht Eisen und Kupfer, beides kommt in einer Fahrt
ship-fuel=Tankstelle: der Greifarm sitzt am Motor des Schiffs, 17 Felder hinter dem Hafen
ship-train=Zugstrecke im selben UTL-Netz: Züge fahren nur zu Haltestellen, Schiffe nur zu Häfen
