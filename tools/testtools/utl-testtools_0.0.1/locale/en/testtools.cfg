[utl-sign]
ship-depot=Port depot: two ports with the same name, one cargo ship each
ship-provider=Mixed storage: iron, copper and gears – one inserter per good
ship-requester=Workshop: needs iron and copper, both come in one trip
ship-fuel=Fuel station: the inserter sits at the ship's engine, 17 tiles behind the port
ship-train=Train line in the same UTL network: trains only go to train stops, ships only to ports
