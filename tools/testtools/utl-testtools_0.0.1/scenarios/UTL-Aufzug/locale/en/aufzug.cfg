scenario-name=UTL-Aufzug (Space Exploration only)
description=Practice network for the space elevator: a finished elevator between Nauvis and its orbit, a loop with UTL stations in network "Aufzug" on each side. The planet sends iron to orbit, the orbit sends copper down. The scenario keeps the elevator built and powered. Needs Space Exploration (without Space Age).

[utl-aufzug]
welcome=[font=default-bold]UTL-Aufzug[/font]: East of you stands a space elevator to Nauvis Orbit. Both sides have a loop with depot, provider and requester in network "Aufzug". UTL sends trains with iron up and with copper down – through the elevator. The switch "Deliver via space elevator" is on (station window, network section, or UTL manager › Networks). To look upstairs: open the map and switch the surface at the top left. UTL manager: locomotive button in the shortcut bar.
need-se=This scenario needs the mod Space Exploration (without Space Age) – easiest to start with tools/aufzug.sh.
build-failed=The space elevator could not be built – details are in the log (lines with [AUF]).
