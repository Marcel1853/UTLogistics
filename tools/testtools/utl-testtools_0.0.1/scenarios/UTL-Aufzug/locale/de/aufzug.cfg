scenario-name=UTL-Aufzug (nur mit Space Exploration)
description=Übungsnetz für den Weltraumaufzug: Ein fertiger Aufzug zwischen Nauvis und dem Orbit, auf jeder Seite eine Schleife mit UTL-Stationen im Netz „Aufzug“. Der Planet liefert Eisen in den Orbit, der Orbit Kupfer auf den Planeten. Das Szenario hält den Aufzug gebaut und mit Strom. Braucht Space Exploration (ohne Space Age).

[utl-aufzug]
welcome=[font=default-bold]UTL-Aufzug[/font]: Östlich von dir steht ein Weltraumaufzug nach Nauvis Orbit. Beide Seiten haben eine Schleife mit Depot, Anbieter und Abnehmer im Netz „Aufzug“. UTL schickt Züge mit Eisen nach oben und mit Kupfer nach unten – durch den Aufzug. Der Schalter „Über den Weltraumaufzug liefern“ ist an (Stationsfenster, Abschnitt Netzwerk, oder UTL-Manager › Netzwerke). Oben ansehen: Karte öffnen und oben links die Oberfläche wechseln. UTL-Manager: Lok-Knopf in der Shortcut-Leiste.
need-se=Dieses Szenario braucht die Mod Space Exploration (ohne Space Age) – am einfachsten mit tools/aufzug.sh starten.
build-failed=Der Weltraumaufzug ließ sich nicht bauen – Details stehen im Log (Zeilen mit [AUF]).
