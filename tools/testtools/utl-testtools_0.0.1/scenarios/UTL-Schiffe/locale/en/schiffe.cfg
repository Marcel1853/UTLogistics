scenario-name=UTL ships (Cargo Ships only)
description=A practice network for ships: the ring from "UTL examples" as a waterway with buoys, ten UTL ports (two depots, providers, requesters, a fuel station and a cleanup) and two cargo ships that start right away. Next to it a small train line in the same UTL network: ships only go to ports, trains only to train stops. Needs the Cargo Ships mod.

[utl-schiffe]
welcome=[font=default-bold]UTL ships[/font]: ports are UTL stations, ships run deliveries like trains. The requesters destroy everything, so the ships keep going. To the south a train line shares the same UTL network – UTL only sends a vehicle that can reach both provider and requester. Ships cannot turn around, hence the ring. UTL Manager: locomotive button in the shortcut bar.
need-cargo-ships=This scenario needs the Cargo Ships mod – please enable it and restart.
