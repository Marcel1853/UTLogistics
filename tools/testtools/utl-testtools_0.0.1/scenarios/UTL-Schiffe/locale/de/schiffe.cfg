scenario-name=UTL-Schiffe (nur mit Cargo Ships)
description=Übungsnetz für Schiffe: der Rundkurs aus „UTL-Beispiele“ als Wasserweg mit Bojen, zehn UTL-Häfen (zwei Depots, Anbieter, Abnehmer, Tankstelle, Cleanup) und zwei Frachtschiffen, die gleich losfahren. Daneben eine kleine Zugstrecke im selben UTL-Netz: Schiffe fahren nur zu Häfen, Züge nur zu Haltestellen. Braucht die Mod Cargo Ships.

[utl-schiffe]
welcome=[font=default-bold]UTL-Schiffe[/font]: Häfen sind UTL-Stationen, Schiffe fahren Lieferungen wie Züge. Die Abnehmer vernichten alles, deshalb fahren die Schiffe ohne Pause. Südlich liegt eine Zugstrecke im selben UTL-Netz – UTL schickt nur, wer Anbieter und Abnehmer auch erreicht. Schiffe können nicht wenden, deshalb ein Rundkurs. UTL-Manager: Lok-Knopf in der Shortcut-Leiste.
need-cargo-ships=Dieses Szenario braucht die Mod Cargo Ships – bitte aktivieren und neu starten.
